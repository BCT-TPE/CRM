<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activities · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="design-system/tokens.css?v=20261123a">
<link rel="stylesheet" href="assets/crm.css?v=20261126a">
<link rel="stylesheet" href="assets/dashboard.css?v=20261124b">
<link rel="stylesheet" href="assets/theme-v2.css?v=20261126a">
<link rel="stylesheet" href="assets/responsive.css?v=20261126c">
<style>
/* ---------- Page: Activities (CRM V1 §6) ----------
   Same IA as CRMpulse /activities: Mine / My teams / Everyone, four summary tiles (the "Log activity" header button opens the full panel; design review D1 removed the inline composer),
   type chips, search / purpose / period / more filters, and the timeline grouped by week and month, newest first. */
/* Summary tiles */
.sm4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap-grid); }
/* label / figure / note share row heights across a row (subgrid), so a wrapped label never pushes one figure down */
.sm4 > .card { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 0; align-content: start; }
.sm4 small { display: block; font-size: var(--text-xs); color: var(--t3); }
.sm4 b { display: block; margin: 6px 0 4px; font-size: var(--text-3xl); font-weight: 400; letter-spacing: -.03em; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; } /* same as every scope tile figure */
.sm4 span { display: block; font-size: var(--text-xs); color: var(--t3); } /* notes wrap; the subgrid keeps every tile's rows aligned */
.sm4 .card.warn { background: var(--warn-bg); border-color: var(--warn-soft); }
.sm4 .card.warn b { color: var(--warn-text); }
/* Timeline */
/* Period blocks: a clear heading and a rule between blocks; inside a block the line runs dot to dot */
.feed .tabs { padding-bottom: 0; }
/* Custom range (CRMpulse Period = Custom range…): From / To date pickers styled as filter pills */
.select.dr[hidden] { display: none; }
.select.dr .dt { display: flex; height: 100%; }
.select.dr .dt-btn { height: 100%; width: 128px; padding: 0 12px 0 6px; border: 0; background: transparent; font: inherit; font-size: var(--text-sm); font-weight: 500; color: var(--ink); }
.select.dr .dt-btn.ph .dt-v { font-weight: 400; }
.select.dr .dt-ic { width: 14px; height: 14px; color: var(--t3); }
.wkg:first-of-type { padding-top: 16px; } /* 16px between the type tabs and the first period */
.wkg + .wkg { margin-top: 28px; }
.wk { display: flex; align-items: baseline; gap: 8px; margin: 0 0 14px; font-size: var(--text-lg); font-weight: 600; color: var(--ink); }
.wk small { font-size: var(--text-xs); font-weight: 500; color: var(--t3); font-variant-numeric: tabular-nums; }
.ai { display: grid; grid-template-columns: 96px 28px minmax(0, 1fr); gap: 14px; padding-bottom: 14px; }
.ai:last-child { padding-bottom: 0; }
.ai-d { text-align: left; font-size: var(--text-xs); color: var(--t3); line-height: 1.4; padding-top: 12px; white-space: nowrap; } /* date + weekday · time: two lines, no wrapping */
.ai-d b { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--t1); }
.ai-d .wd { font-weight: 400; color: var(--t3); } /* weekday on the date line */
.ai-ic { position: relative; display: flex; justify-content: center; padding-top: 12px; }
.ai-ic span { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--info-bg); color: var(--deep); }
/* one colour per activity type (tokens --act-*) */
.ai-ic span.k-visit { background: var(--act-visit-bg); color: var(--act-visit); }
.ai-ic span.k-call { background: var(--act-call-bg); color: var(--act-call); }
.ai-ic span.k-online { background: var(--act-online-bg); color: var(--act-online); }
.ai-ic span.k-email { background: var(--act-email-bg); color: var(--act-email); }
.ai-ic span.k-message { background: var(--act-message-bg); color: var(--act-message); }
.ai-ic span.k-internal { background: var(--act-internal-bg); color: var(--act-internal); }
.ai-ic span.k-event { background: var(--act-event-bg); color: var(--act-event); }
.ai-ic span.k-other { background: var(--act-other-bg); color: var(--act-other); }
.ai-ic svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ai:not(:last-child) .ai-ic::after { content: ""; position: absolute; top: 26px; bottom: -40px; width: 2px; border-radius: var(--radius-2xs); background: var(--line-2); } /* this dot's centre to the next dot's centre (12px + 14px half dot; 14px row gap) */
.ai-h .lock { flex: none; font-size: var(--text-xs); color: var(--t3); } /* other roles can edit an activity for 7 days; Administrator always (design review) */
.ai-c { min-width: 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.ai-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ai-h b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); font-weight: 600; color: var(--ink); }
.ai-h .sp { flex: 1; }
.ai-h small { flex: none; font-size: var(--text-xs); color: var(--t3); font-variant-numeric: tabular-nums; }
.ai-h .btn.icon-only { width: 28px; height: 28px; padding: 0; justify-content: center; }
.ai-h .btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ptag { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--radius-sm); background: var(--hover); font-size: var(--text-2xs); font-weight: 600; color: var(--t2); white-space: nowrap; }
.ai-m { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; font-size: var(--text-xs); color: var(--t3); }
.ai-m .acc { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--radius-sm); background: var(--field); color: var(--t1); font-weight: 500; }
.ai-m .fu { color: var(--deep); font-weight: 500; }
.ai-n { margin: 6px 0 0; font-size: var(--text-sm); color: var(--t2); }
.more-wrap { position: relative; }
#more-pop { top: 44px; right: 0; left: auto; width: 280px; } /* opens leftwards from the button, like the other pages, so it never runs off the right edge */
#more-pop .grp + .grp { margin-top: 12px; }
body.v2 #more-pop label.select.fsel { display: flex; width: 100%; height: 36px; border-radius: var(--radius-control); border-color: var(--line-2); box-shadow: none; }
#more-pop .fsel .sel-btn { max-width: none; width: 100%; font-weight: 400; }
@media (max-width: 1180px) { .sm4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 768px) {
  /* phone: type icon + date on one line above the card; title + edit, then purpose + ID */
  .ai { grid-template-columns: 24px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
  .ai-ic { grid-row: 1; grid-column: 1; padding-top: 0; }
  .ai-ic span { width: 24px; height: 24px; }
  .ai-ic svg { width: 13px; height: 13px; }
  .ai .ai-ic::after { display: none; } /* no connecting line: the cards sit between the icons */
  .ai-d { grid-row: 1; grid-column: 2; display: flex; align-items: baseline; gap: 6px; padding-top: 0; text-align: left; }
  .ai-c { grid-column: 1 / -1; }
  .ai-d b { display: inline; }
  .ai-c { position: relative; }
  .ai-h b { flex: 1 1 100%; padding-right: 44px; white-space: normal; } /* room for the edit button */
  .ai-h .btn { position: absolute; top: 8px; right: 8px; } /* edit sits in the card's top-right corner */
  .ai-h .ptag { order: 2; }
  .ai-h .sp { display: none; }
  .ai-h small { order: 3; }
    .ai-h { flex-wrap: wrap; }
}
/* Log activity side panel (old CRMpulse ActivityFormDrawer): opened from the "Log activity" header button;
   same .drill panel and form styles as the Tasks panel */
.tf textarea.in { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.tf .in:focus { border-color: var(--deep); }
.tf.bad .in, .tf.bad .dt-btn, .tf.bad .sel-btn { border-color: var(--danger); }
body.v2 .tf-seg { display: flex; width: 100%; background: var(--track); box-shadow: none; }
.tf-box { display: grid; gap: 14px; padding: 16px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); }
.tf-chk { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: var(--text-sm); font-weight: 500; color: var(--ink); cursor: pointer; }
.tf-chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--deep); }
@media (max-width: 480px) { .tf-2 { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body class="v2">
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="v2-head">
      <div class="v2-hello">
        <h1>Activities</h1>
        <p>Every call, meeting, visit and email with customers, newest first.</p>
      </div>
      <div class="acts" style="display:flex;gap:8px">
        <button class="btn primary" id="log-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Log activity</button><!-- design review D1: the full panel from the header -->
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Search subject or number" aria-label="Search"></label>
      <div class="seg" id="f-who" role="radiogroup" aria-label="Whose activities">
        <button data-v="mine" role="radio" aria-checked="false">Mine</button>
        <button data-v="team" role="radio" aria-checked="false">My teams</button>
        <button data-v="all" role="radio" aria-checked="false">Everyone</button>
      </div>
      <label class="select"><span class="lbl">Purpose</span><select id="f-purpose" aria-label="Purpose"></select></label>
      <label class="select" id="w-period"><span class="lbl">Period</span><select id="f-period" aria-label="Period"></select></label>
      <label class="select dr" id="w-from" hidden><span class="lbl">From</span><input type="date" id="f-from" aria-label="From" placeholder="Any"></label>
      <label class="select dr" id="w-to" hidden><span class="lbl">To</span><input type="date" id="f-to" aria-label="To" placeholder="Any"></label>
      <div class="more-wrap">
        <button class="btn" id="more-btn" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>More filters<span class="count-badge" id="more-n" hidden></span></button>
        <div class="pop" id="more-pop" role="dialog" aria-label="More filters" hidden>
          <div class="grp"><h4>Owner</h4><label class="select fsel"><select id="f-owner" aria-label="Owner"></select></label></div>
          <div class="grp"><h4>Context</h4><label class="select fsel"><select id="f-ctx" aria-label="Context"><option value="">All</option><option value="account">Account-level only</option><option value="initiative">Sales initiative only</option></select></label></div>
          <div class="pop-foot"><button class="btn" id="more-clear" type="button">Clear</button><button class="btn primary" id="more-done" type="button">Done</button></div>
        </div>
      </div>
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
    </div>

    <div id="top"></div>

    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261126e"></script>
<script src="assets/crm-data.js?v=20261126d"></script>
<script>
const { toast } = CRM;
const $ = (s) => document.querySelector(s);
const DAY = 864e5;
const P = (d) => `<path d="${d}"/>`;
const TICON = {
  'Customer / prospect visit': '<path d="M12 21s-6-5.3-6-11a6 6 0 0112 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
  'Phone call': P('M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2'),
  'Virtual meeting': '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  'Email': '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>',
  'Messaging': P('M4 5h16v11H8l-4 4z'),
  'Internal meeting': '<circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3 3.2-5 6-5s5.2 2 6 5M16 5.5a3 3 0 010 5.5M18 14c1.6.6 2.7 2.4 3 5"/>',
  'Event / conference': '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  'Other': '<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>'
};
// same matching as CRMpulse activityTypeStyle(): first rule that fits the type's wording wins
const KIND = [[/call|phone/i, 'call'], [/e-?mail/i, 'email'], [/messag|chat/i, 'message'], [/virtual|video|online/i, 'online'], [/visit/i, 'visit'], [/internal/i, 'internal'], [/meeting/i, 'visit'], [/event|conference|webinar/i, 'event']];
const kindOf = (t) => (KIND.find(([re]) => re.test(t)) || [0, 'other'])[1];
const ic = (t) => `<svg viewBox="0 0 24 24" aria-hidden="true">${TICON[t] || TICON.Other}</svg>`;
const EDIT = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>';
const PERIODS = [['60', 'Last 60 days'], ['week', 'This week'], ['month', 'This month'], ['quarter', 'This quarter'], ['all', 'Any time'], ['custom', 'Custom range…']];
const WEEK_START = new Date(TODAY.getTime() - ((TODAY.getDay() + 6) % 7) * DAY); // Monday
const MY_TEAM = PERSON_TEAM[ME];
// CRMpulse defaultWho for a Sales Head: "Everyone". Every role works with Sales Head permissions outside Home (2026-11-26)
const S = { who: CRM.user.oversight ? 'all' : CRM.user.code === 'SALES_MANAGER' ? 'team' : 'mine', type: '', q: '', purpose: '', period: '60', from: '', to: '', owner: '', ctx: '' };

const day = (a) => new Date(a.d.slice(0, 10));
function inPeriod(a, p) {
  const d = day(a), ago = (TODAY - d) / DAY;
  if (p === '60') return ago <= 60; if (p === 'week') return d >= WEEK_START;
  if (p === 'month') return d.getMonth() === TODAY.getMonth() && d.getFullYear() === TODAY.getFullYear();
  if (p === 'quarter') return qOf(a.d.slice(0, 10)) === CUR_Q && fyq(a.d).fy === '2627';
  if (p === 'custom') { const k = a.d.slice(0, 10); return (!S.from || k >= S.from) && (!S.to || k <= S.to); } // inclusive, either end optional
  return true;
}
const whoMatch = (a, w = S.who) => w === 'all' || (w === 'mine' ? a.owner === ME : PERSON_TEAM[a.owner] === MY_TEAM);
function rows(ignoreType) {
  const q = S.q.trim().toLowerCase();
  return ACTIVITIES.filter(a => whoMatch(a) && inPeriod(a, S.period) && (ignoreType || !S.type || a.type === S.type) && (!S.purpose || a.purpose === S.purpose)
    && (!S.owner || a.owner === S.owner) && (!S.ctx || (S.ctx === 'account' ? !a.si : !!a.si))
    && (!q || [a.t, a.id, a.acc, a.siName].some(v => v.toLowerCase().includes(q))));
}

function tiles() {
  const mine = ACTIVITIES.filter(a => whoMatch(a));
  const wk = mine.filter(a => day(a) >= WEEK_START), m30 = mine.filter(a => (TODAY - day(a)) / DAY <= 30);
  const accs = (l) => new Set(l.map(a => a.acc)).size, pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const scope = S.who === 'all' ? ACCOUNTS : ACCOUNTS.filter(a => whoMatch({ owner: a.owner }));
  const quiet = scope.filter(a => !ACTIVITIES.some(x => x.acc === a.name && (TODAY - day(x)) / DAY <= 30));
  const fu = TASKS.filter(t => t.act && m30.some(a => a.id === t.act)).length;
  return `<div class="sm4">
    <div class="card"><small>This week</small><b>${wk.length}</b><span>activities logged · ${pl(accs(wk), 'account')}</span></div>
    <div class="card"><small>Last 30 days</small><b>${m30.length}</b><span>activities across ${pl(accs(m30), 'account')}</span></div>
    <div class="card ${quiet.length ? 'warn' : ''}"><small>Accounts idle 30+ days</small><b>${quiet.length}</b><span>${quiet.length ? quiet.slice(0, 3).map(a => esc(a.name)).join(', ') + (quiet.length > 3 ? ` + ${quiet.length - 3} more` : '') : 'All contacted recently'}</span></div>
    <div class="card"><small>Follow-ups created</small><b>${fu}</b><span>From the last 30 days</span></div>
  </div>`;
}
function typeChips() {
  const base = rows(true), counts = ACT_TYPES.map(t => [t, base.filter(a => a.type === t).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  return `<div class="tabs" role="tablist" aria-label="Filter by type"><button class="tab ${!S.type ? 'on' : ''}" role="tab" aria-selected="${!S.type}" data-act="type" data-v="">All<span class="tab-n">${base.length}</span></button>${counts.map(([t, n]) => `<button class="tab ${S.type === t ? 'on' : ''}" role="tab" aria-selected="${S.type === t}" data-act="type" data-v="${t}">${t}<span class="tab-n">${n}</span></button>`).join('')}</div>`;
}
function groupOf(a) {
  const d = day(a);
  if (d >= WEEK_START) return 'This week';
  if (d >= new Date(WEEK_START.getTime() - 7 * DAY)) return 'Last week';
  return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}
function feed() {
  const list = rows();
  if (!list.length) return `<section class="card">${typeChips()}<div class="empty" style="padding:48px 12px"><b>No activities here</b>Nothing matches these filters.${S.period !== 'all' ? '<br><button class="link" data-act="anytime">Show any time</button>' : ''}</div></section>`;
  const groups = [];
  list.forEach(a => { const k = groupOf(a); if (!groups.length || groups[groups.length - 1][0] !== k) groups.push([k, []]); groups[groups.length - 1][1].push(a); });
  const item = (a) => {
    const d = new Date(a.d), n = actTasks(a.id);
    return `<div class="ai">
      <div class="ai-d"><b>${CRM.date(a.d, false)} <span class="wd">${d.toLocaleDateString('en-GB', { weekday: 'short' })}</span></b><span>${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div>
      <div class="ai-ic"><span class="k-${kindOf(a.type)}">${ic(a.type)}</span></div>
      <div class="ai-c">
        <div class="ai-h"><b>${esc(a.t)}</b><span class="ptag">${a.purpose}</span><span class="sp"></span><small>${a.id}</small>${CRM.user.code !== 'ADMIN' && (a.owner !== ME || (TODAY - day(a)) / DAY > 7) ? `<small class="lock">${a.owner !== ME ? 'Read only' : 'Locked after 7 days'}</small>` : `<button class="btn icon-only" data-act="edit" data-v="${a.id}" aria-label="Edit ${a.id}" data-tip="Edit or delete">${EDIT}</button>`}</div>
        <div class="ai-m"><span class="acc">${esc(a.acc)}</span>${a.si ? `<a class="link" href="initiative.html?id=${encodeURIComponent(a.si)}#activities">${esc(a.siName)}</a>` : ''}<span>by ${a.owner === ME ? 'you' : esc(a.owner)}</span>${n ? `<a class="link fu" href="tasks.html?q=${a.id}">${n} follow-up task${n === 1 ? '' : 's'}</a>` : ''}</div>
        ${a.note ? `<p class="ai-n">${esc(a.note)}</p>` : ''}
      </div></div>`;
  };
  const items = groups.map(([k, l]) => `<section class="wkg" aria-label="${k}"><h3 class="wk">${k}<small>${l.length}</small></h3>${l.map(item).join('')}</section>`).join('');
  return `<section class="card feed" aria-label="Activity timeline">${typeChips()}${items}</section>`;
}
function renderTop() { $('#top').innerHTML = `<div style="margin-bottom:16px">${tiles()}</div>`; }
function render() {
  renderTop();
  $('#page').innerHTML = feed();
  $('#f-who').querySelectorAll('button').forEach(b => { const on = b.dataset.v === S.who; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); });
  const more = [S.owner, S.ctx].filter(Boolean).length; $('#more-n').hidden = !more; $('#more-n').textContent = more;
  $('#reset').hidden = !(S.q || S.purpose || S.period !== '60' || S.owner || S.ctx || S.type);
  const custom = S.period === 'custom';
  $('#w-from').hidden = $('#w-to').hidden = !custom;
  $('#w-from').classList.toggle('set', !!S.from); $('#w-to').classList.toggle('set', !!S.to);
}

// ---- Events ----
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a || !a.closest('#top, #page')) return;
  const act = a.dataset.act;
  if (act === 'type') { S.type = a.dataset.v; render(); }
  else if (act === 'anytime') { S.period = 'all'; S.from = S.to = ''; $('#f-period').value = 'all'; $('#f-from').value = ''; $('#f-to').value = ''; render(); }
  else if (act === 'edit') toast(`Would open ${a.dataset.v} to edit or delete`);
});
const fld = (label, ctl, { req, hint, err, id } = {}) => `<div class="tf ${err ? 'bad' : ''}" ${id ? `data-f="${id}"` : ''}><span class="tf-l">${label}${req ? '<span class="rq">*</span>' : ''}</span>${ctl}${err ? `<span class="tf-e">${err}</span>` : hint ? `<span class="tf-h">${hint}</span>` : ''}</div>`;
const isoDay = (d) => new Date(d).toISOString().slice(0, 10);
const TEAMMATES = [...new Set([ME, ...Object.values(TEAMS).flatMap(t => t.people), ...Object.keys(FUNC)])].sort((a, b) => a === ME ? -1 : b === ME ? 1 : a.localeCompare(b));
function openLog(pre) {
  const v = { ctx: pre.ctx || 'account', to: pre.to || '', type: pre.type || 'Phone call', when: 'today', date: isoDay(TODAY), time: String(new Date().getHours()).padStart(2, '0') + ':00',
    who: pre.who || '', purpose: 'Follow-up', what: pre.what || '', subject: '', subjectTouched: false,
    doNext: false, next: '', follow: '', doTask: false, task: '', taskTo: ME, taskDue: isoDay(TODAY.getTime() + 7 * DAY) };
  let errs = {};
  const scrim = document.createElement('aside'); scrim.className = 'drill tf-panel'; scrim.setAttribute('role', 'dialog'); scrim.setAttribute('aria-labelledby', 'lf-t');
  const prev = document.activeElement;
  const close = () => { document.removeEventListener('keydown', key, true); document.body.classList.remove('drill-open'); setTimeout(() => scrim.remove(), 300); prev && prev.focus && prev.focus(); };
  const snap = () => JSON.stringify({ ...v, subject: v.subjectTouched ? v.subject : '' }); // the auto-filled subject is not an edit
  const start = snap();
  const askClose = async () => { if (snap() === start) return close();
    const r = await CRM.confirm({ title: 'Discard this activity?', body: '<p>What you entered will be lost.</p>',
      actions: [{ label: 'Discard', value: 'discard', kind: 'quiet' }, { label: 'Keep editing', value: null, kind: 'primary' }] });
    if (r === 'discard') close(); };
  const key = (e) => { if (e.key === 'Escape' && !document.body.classList.contains('dlg-open')) { e.preventDefault(); askClose(); } };
  const ctxAcc = () => v.ctx === 'initiative' ? (INITS.find(o => o.id === v.to) || {}).acc : v.to;
  const autoSubject = () => `${ACT_SUBJECT[v.type] || 'Activity with'} ${v.who || ctxAcc() || '…'}`;
  const opt = (val, label, on) => `<option value="${esc(val)}" ${on ? 'selected' : ''}>${esc(label)}</option>`;
  const draw = () => {
    if (!v.subjectTouched) v.subject = autoSubject();
    const acc = ctxAcc(), si = v.ctx === 'initiative' ? INITS.find(o => o.id === v.to) : null;
    const people = acc ? CONTACTS.filter(c => c.acc === acc && c.status === 'Active') : [];
    const targets = v.ctx === 'account' ? ACCOUNTS.map(a => [a.name, a.name]) : INITS.filter(o => o.kind === 'open').map(o => [o.id, o.name]);
    scrim.innerHTML = `<form class="tf-form" novalidate>
      <header class="dr-head"><div><p class="dr-kind">Activities</p><h2 id="lf-t">Log activity</h2><p class="dr-sub">What happened with the customer, for the timeline and the record.</p></div>
        <button type="button" class="icon-btn" data-x="close" aria-label="Close panel">${CRM.icon('x')}</button></header>
      <div class="dr-body"><div class="tf-g">
        ${fld('Log against', `<div class="seg tf-seg" role="radiogroup" aria-label="Log against">${[['initiative', 'Sales initiative'], ['account', 'Account']].map(([k, l]) => `<button type="button" role="radio" aria-checked="${v.ctx === k}" class="${v.ctx === k ? 'on' : ''}" data-ctx="${k}">${l}</button>`).join('')}</div>`)}
        ${fld(v.ctx === 'account' ? 'Account' : 'Sales initiative', `<label class="select fsel"><select data-v="to" aria-label="${v.ctx === 'account' ? 'Account' : 'Sales initiative'}">${opt('', v.ctx === 'account' ? 'Select account…' : 'Select initiative…', !v.to)}${targets.map(([k, l]) => opt(k, l, k === v.to)).join('')}</select></label>`, { req: true, err: errs.to, hint: v.ctx === 'account' ? 'Approved accounts only.' : '', id: 'to' })}
        ${fld('What kind of activity?', `<label class="select fsel"><select data-v="type" aria-label="What kind of activity?">${ACT_TYPES.map(t => opt(t, t, t === v.type)).join('')}</select></label>`, { req: true })}
        ${fld('When?', `<div class="seg tf-seg" role="radiogroup" aria-label="When">${[['today', 'Today'], ['yesterday', 'Yesterday'], ['pick', 'Pick date…']].map(([k, l]) => `<button type="button" role="radio" aria-checked="${v.when === k}" class="${v.when === k ? 'on' : ''}" data-when="${k}">${l}</button>`).join('')}</div>`, { req: true })}
        <div class="tf-2">
          ${v.when === 'pick' ? fld('Date', `<input class="in" type="date" data-v="date" value="${v.date}" max="${isoDay(TODAY)}" aria-label="Activity date">`, { req: true }) : ''}
          ${fld('Time', `<input class="in" type="time" data-v="time" value="${v.time}" aria-label="Time">`)}
        </div>
        ${fld('Who was there?', `<label class="select fsel"><select data-v="who" aria-label="Who was there?" ${acc ? '' : 'disabled'}>${opt('', acc ? 'No contact' : 'Choose the context first', !v.who)}${people.map(c => opt(c.n, c.role ? `${c.n} · ${c.role}` : c.n, c.n === v.who)).join('')}</select></label>`, { hint: acc ? `Contacts at ${esc(acc)}` : '' })}
        ${fld('Purpose', `<label class="select fsel"><select data-v="purpose" aria-label="Purpose">${ACT_PURPOSES.map(p => opt(p, p, p === v.purpose)).join('')}</select></label>`)}
        ${fld('What happened?', `<textarea class="in" data-v="what" aria-label="What happened?">${esc(v.what)}</textarea>`)}
        ${fld('Subject', `<input class="in" data-v="subject" value="${esc(v.subject)}" aria-label="Subject">`, { req: true, err: errs.subject, hint: v.subjectTouched ? '' : 'Filled in for you. Edit if you like.', id: 'subject' })}
        ${si ? `<div class="tf-box"><label class="tf-chk"><input type="checkbox" data-c="doNext" ${v.doNext ? 'checked' : ''}>Update the initiative's next step</label>
          ${v.doNext ? `<div class="tf-2">${fld('Next step', `<input class="in" data-v="next" value="${esc(v.next)}" aria-label="Next step">`)}${fld('Follow-up date', `<input class="in" type="date" data-v="follow" value="${v.follow}" aria-label="Follow-up date">`)}</div>`
            : `<span class="tf-h">${si.next ? `Currently: ${esc(si.next)}${si.follow ? ` (follow up ${CRM.date(si.follow)})` : ''}` : 'The list shows "No next step" for this initiative today.'}</span>`}</div>` : ''}
        <div class="tf-box"><label class="tf-chk"><input type="checkbox" data-c="doTask" ${v.doTask ? 'checked' : ''}>Create a follow-up task</label>
          ${v.doTask ? `${fld('Task', `<input class="in" data-v="task" value="${esc(v.task)}" aria-label="Task">`, { req: true, err: errs.task, id: 'task' })}
            <div class="tf-2">${fld('Assign to', `<label class="select fsel"><select data-v="taskTo" aria-label="Assign to">${TEAMMATES.map(x => opt(x, x === ME ? `${x} (you)` : x, x === v.taskTo)).join('')}</select></label>`, { req: true })}
            ${fld('Due', `<input class="in" type="date" data-v="taskDue" value="${v.taskDue}" aria-label="Due">`, { req: true })}</div>` : ''}</div>
      </div></div>
      <div class="dr-foot"><button type="button" class="btn ghost" data-x="close">Cancel</button><button type="submit" class="btn primary">Log activity</button></div>
    </form>`;
    CRM.enhanceSelects(scrim); CRM.enhanceDates(scrim);
  };
  scrim.addEventListener('click', (e) => {
    if (e.target.closest('[data-x="close"]')) { askClose(); return; }
    const c = e.target.closest('[data-ctx]'); if (c && c.dataset.ctx !== v.ctx) { v.ctx = c.dataset.ctx; v.to = ''; v.who = ''; draw(); return; }
    const w = e.target.closest('[data-when]'); if (w) { v.when = w.dataset.when; v.date = v.when === 'yesterday' ? isoDay(TODAY.getTime() - DAY) : v.when === 'today' ? isoDay(TODAY) : v.date; draw(); }
  });
  scrim.addEventListener('change', (e) => {
    const c = e.target.dataset.c; if (c) { v[c] = e.target.checked; draw(); return; }
    const k = e.target.dataset.v; if (!k) return; v[k] = e.target.value;
    if (k === 'to' || k === 'type' || k === 'who') { if (k === 'to') v.who = ''; draw(); }
  });
  scrim.addEventListener('input', (e) => { const k = e.target.dataset.v; if (!k || e.target.tagName === 'SELECT') return; v[k] = e.target.value; if (k === 'subject') v.subjectTouched = true; });
  scrim.addEventListener('submit', (e) => {
    e.preventDefault(); errs = {};
    if (!v.to) errs.to = v.ctx === 'account' ? 'Pick the account.' : 'Pick the initiative.';
    if (!v.subject.trim()) errs.subject = 'Give it a subject.';
    if (v.doTask && !v.task.trim()) errs.task = 'Say what needs doing.';
    if (Object.keys(errs).length) { draw(); scrim.querySelector('.tf.bad .in, .tf.bad .sel-btn')?.focus(); return; }
    const o = v.ctx === 'initiative' ? INITS.find(x => x.id === v.to) : null, acc = o ? o.acc : v.to;
    const id = 'ACT-2026-' + String(Math.max(...ACTIVITIES.map(x => +x.id.slice(-4))) + 1).padStart(4, '0');
    ACTIVITIES.unshift({ id, d: `${v.date}T${v.time || '09:00'}`, type: v.type, purpose: v.purpose, acc, si: o ? o.id : null, siName: o ? o.name : '', owner: ME, who: v.who ? [v.who] : [], t: v.subject.trim(), note: v.what.trim() });
    ACTIVITIES.sort((a, b) => b.d.localeCompare(a.d));
    if (o && v.doNext) { if (v.next.trim()) o.next = v.next.trim(); if (v.follow) o.follow = v.follow; }
    let extra = '';
    if (v.doTask) { const n = String(Math.max(...TASKS.map(x => +x.id.slice(-4))) + 1).padStart(4, '0');
      TASKS.unshift({ id: 'TSK-2026-' + n, title: v.task.trim(), si: o ? o.id : null, siName: o ? o.name : '', acc, to: v.taskTo, by: ME, status: 'ns', due: v.taskDue, act: id, done: null, desc: '' });
      CRM.refreshTaskBadge(); extra = ' and a follow-up task'; }
    if (S.who !== 'all' && S.who !== 'mine') S.who = 'mine';
    close(); render(); toast(`Logged ${id}${extra}`, 'ok');
  });
  document.querySelectorAll('.tf-panel').forEach(x => x.remove());
  draw(); document.body.appendChild(scrim); document.addEventListener('keydown', key, true);
  requestAnimationFrame(() => { document.body.classList.add('drill-open'); setTimeout(() => scrim.querySelector(v.to ? '[data-v="what"]' : '[data-v="to"]')?.closest('.tf')?.querySelector('textarea, input, .sel-btn')?.focus(), 280); });
}
$('#log-new').addEventListener('click', () => openLog({}));
$('#f-who').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.who = b.dataset.v; render(); } });
function fill(sel, opts, v = '') { sel.innerHTML = opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join(''); }
fill($('#f-purpose'), [['', 'All'], ...ACT_PURPOSES.map(p => [p, p])]);
fill($('#f-period'), PERIODS, '60');
fill($('#f-owner'), [['', 'All'], ...[...new Set(ACTIVITIES.map(a => a.owner))].sort().map(p => [p, p === ME ? `${p} (you)` : p])]);
$('#f-search').addEventListener('input', (e) => { S.q = e.target.value; render(); });
// links from Tasks ("from ACT-…") land on that activity: ?q= fills the search, over any period (design review D9)
{ const q = new URLSearchParams(location.search).get('q'); if (q) { S.q = q; S.period = 'all'; S.who = 'all'; $('#f-search').value = q; $('#f-period').value = 'all'; } }
$('#f-purpose').addEventListener('change', (e) => { S.purpose = e.target.value; render(); });
$('#f-period').addEventListener('change', (e) => { S.period = e.target.value; if (S.period !== 'custom') { S.from = S.to = ''; $('#f-from').value = ''; $('#f-to').value = ''; } render(); });
// a named period replaces custom dates; the two ends keep each other valid
$('#f-from').addEventListener('change', (e) => { S.from = e.target.value; $('#f-to').min = S.from; render(); });
$('#f-to').addEventListener('change', (e) => { S.to = e.target.value; $('#f-from').max = S.to; render(); });
$('#f-owner').addEventListener('change', (e) => { S.owner = e.target.value; render(); });
$('#f-ctx').addEventListener('change', (e) => { S.ctx = e.target.value; render(); });
const setMore = (on) => { $('#more-pop').hidden = !on; $('#more-btn').setAttribute('aria-expanded', String(on)); };
$('#more-btn').addEventListener('click', (e) => { e.stopPropagation(); setMore($('#more-pop').hidden); });
$('#more-pop').addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', () => setMore(false));
$('#more-clear').addEventListener('click', () => { S.owner = S.ctx = ''; $('#f-owner').value = ''; $('#f-ctx').value = ''; render(); }); // as on the other pages: clears what this panel owns
$('#more-done').addEventListener('click', () => setMore(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMore(false); });
$('#reset').addEventListener('click', () => { Object.assign(S, { q: '', purpose: '', period: '60', from: '', to: '', owner: '', ctx: '', type: '' }); $('#f-from').value = ''; $('#f-to').value = ''; $('#f-search').value = ''; $('#f-purpose').value = ''; $('#f-period').value = '60'; $('#f-owner').value = ''; $('#f-ctx').value = ''; render(); });

CRM.renderShell('activities');
CRM.watchSticky($('#filters'));
render();
CRM.riseIn();
// Accounts' Log activity button (old CRMpulse quick action) lands here with ?log=<account>: the panel opens with that account
{ const acc = new URLSearchParams(location.search).get('log'); if (acc && ACCOUNTS.some(a => a.name === acc)) { const g = (k) => new URLSearchParams(location.search).get(k), who = g('who'), type = g('type'); // Contacts' Log call / Log meeting add the person and the type
    openLog({ ctx: 'account', to: acc, who: CONTACTS.some(c => c.acc === acc && c.n === who && c.status === 'Active') ? who : '', type: ACT_TYPES.includes(type) ? type : '' }); } }
</script>
</body>
</html>
