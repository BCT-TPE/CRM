<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales initiatives · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="assets/crm.css?v=20261113x">
<link rel="stylesheet" href="assets/dashboard.css?v=20261113x">
<style>
/* ---------- Page: Sales initiatives (list page) ---------- */
/* Search field in the filter row */
.search { position: relative; display: inline-flex; align-items: center; height: 36px; width: 260px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); }
.search:focus-within { border-color: var(--deep); }
.search svg { position: absolute; left: 11px; width: 16px; height: 16px; fill: none; stroke: var(--t3); stroke-width: 2; stroke-linecap: round; }
.search input { width: 100%; height: 100%; border: 0; background: none; padding: 0 12px 0 34px; font-size: 13px; outline: none; }
.search input::placeholder { color: #8a8f96; }

/* Lifecycle strip: status tiles filter the list (list-page behaviour, as in the old CRM) */
.life { display: grid; grid-template-columns: 1.15fr repeat(3, 1fr) 14px 1fr 1fr 14px 1fr; align-items: stretch; padding: 0; }
.lt { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 20px 24px; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; position: relative; }
.lt:hover { background: #fbfcfe; }
.lt.on { background: var(--info-bg); }
.lt.on::after { content: ""; position: absolute; left: 24px; right: 24px; bottom: 0; height: 2px; border-radius: 2px; background: var(--deep); }
.lt:first-child { border-radius: var(--r-card) 0 0 var(--r-card); }
.lt:last-child { border-radius: 0 var(--r-card) var(--r-card) 0; }
.lt-k { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--t3); white-space: nowrap; }
.lt-k i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.lt-n { font-size: 28px; font-weight: 400; letter-spacing: -.03em; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
.lt-v { font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; }
.lt-v b { font-weight: 500; color: var(--t1); }
.lt + .lt { border-left: 1px solid var(--line); }
.life-arrow { display: grid; place-items: center; color: var(--line-3); }
.life-arrow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.life-arrow + .lt { border-left: 0; }
.dot-pro { background: #a8dcf4; } .dot-lead { background: #00A0E4; } .dot-opp { background: var(--deep); } .dot-won { background: var(--ink); } .dot-lost { background: var(--chart-gray); } .dot-all { background: var(--t3); }

/* List toolbar inside the card */
.lt-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.lt-bar .sum { font-size: 13px; color: var(--t2); }
.lt-bar .sum b { font-weight: 600; color: var(--ink); }
.lt-bar .sp { flex: 1; }
.tog { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font: inherit; font-size: 12px; color: var(--t2); cursor: pointer; }
.tog b { font-weight: 600; color: var(--danger); }
.tog:hover { border-color: var(--line-3); }
.tog.on { background: var(--danger-bg); border-color: #f0c9c1; color: var(--danger); }
.chip-row { display: flex; gap: 8px; align-items: center; }

/* Status pill */
.st { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.st.Prospect { background: #e6f5fc; color: #0a6c99; } .st.Lead { background: #d9f0fb; color: #006a99; } .st.Opportunity { background: var(--info-bg); color: var(--deep); }
.st.won { background: #e7e9ee; color: var(--ink); } .st.lost { background: var(--hover); color: var(--t3); }
.stg2 { display: flex; align-items: center; gap: 7px; min-width: 0; }
/* 13-step progress: 3 prospect · 3 lead · 7 opportunity sub-stages */
.prog { display: flex; gap: 2px; margin-top: 6px; }
.prog i { width: 8px; height: 4px; border-radius: 1px; background: var(--chart-track); }
.prog i.f { background: #6b778a; }
.prog i.c { background: var(--ink); }
.prog i.sep { margin-left: 3px; }

/* Table */
.tbl.si { table-layout: fixed; }
.tbl.si col.c-name { width: 21%; } .tbl.si col.c-stage { width: 25%; } .tbl.si col.c-own { width: 14%; } .tbl.si col.c-val { width: 10%; }
.tbl.si col.c-prob { width: 6%; } .tbl.si col.c-close { width: 9%; } .tbl.si col.c-next { width: 15%; }
.tbl.si td { height: 64px; padding-top: 10px; padding-bottom: 10px; }
.next-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next-none { color: var(--danger); }
.fu { font-size: 12px; color: var(--t3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fu.late { color: var(--danger); }

/* Kanban */
.kb { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.kb-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px; border-radius: 14px; background: var(--canvas); }
.kb-h { display: flex; align-items: center; gap: 7px; padding: 2px 4px 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
.kb-h i { width: 8px; height: 8px; border-radius: 50%; }
.kb-h small { margin-left: auto; font-weight: 400; color: var(--t3); font-variant-numeric: tabular-nums; }
.kb-c { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kb-c:hover { border-color: var(--line-3); box-shadow: 0 2px 8px rgb(16 24 42 / 6%); }
.kb-c b { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.35; }
.kb-c small { font-size: 12px; color: var(--t3); }
.kb-c .kb-v { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.kb-c .kb-v span { font-size: 12px; font-weight: 400; color: var(--t3); }
.kb-empty { padding: 16px 4px; font-size: 12px; color: var(--t3); text-align: center; }

/* Funnel: one row per sub-stage, bar = value, grouped by main status */
.fn { display: flex; flex-direction: column; }
.fn-g { display: flex; align-items: center; gap: 8px; padding: 14px 0 6px; font-size: 12px; color: var(--t3); }
.fn-g:first-child { padding-top: 0; }
.fn-r { display: grid; grid-template-columns: 220px minmax(0, 1fr) 64px 88px 14px; align-items: center; gap: 16px; width: calc(100% + 16px); margin: 0 -8px; padding: 8px; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.fn-r:hover { background: var(--hover); }
.fn-r.zero { cursor: default; } .fn-r.zero:hover { background: none; }
.fn-n { font-size: 13px; font-weight: 500; color: var(--t1); }
.fn-r.zero .fn-n, .fn-r.zero .fn-c, .fn-r.zero .fn-v { color: var(--t3); font-weight: 400; }
.fn-bar { height: 12px; border-radius: 4px; background: var(--chart-track); position: relative; }
.fn-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.fn-c, .fn-v { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.fn-c { color: var(--t3); } .fn-v { font-weight: 500; color: var(--ink); }

.filter-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--midnight); color: #fff; font-size: 12px; }
.filter-chip button { display: grid; place-items: center; width: 18px; height: 18px; border: 0; border-radius: 50%; background: rgb(255 255 255 / 18%); color: #fff; cursor: pointer; padding: 0; }
.filter-chip svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 2; fill: none; }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>Sales initiatives</h1>
        <p>Prospects, leads and opportunities as one record, from first interest to closure · USD</p>
      </div>
      <div class="acts">
        <button class="btn" id="export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export to Excel</button>
        <button class="btn primary" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New sales initiative</button>
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Search ID, name, account, owner" aria-label="Search initiatives"></label>
      <div class="seg" id="f-mine" role="radiogroup" aria-label="Whose initiatives">
        <button data-v="all" class="on" role="radio" aria-checked="true">Everyone</button>
        <button data-v="me" role="radio" aria-checked="false">My initiatives</button>
      </div>
      <label class="select" id="w-team"><span class="lbl">Team</span><select id="f-team" aria-label="Sales team"></select></label>
      <label class="select" id="w-close"><span class="lbl">Expected close</span><select id="f-close" aria-label="Expected close"></select></label>
      <div style="position:relative">
        <button class="btn" id="more-btn" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>More filters<span class="count-badge" id="more-n" hidden></span></button>
        <div class="pop" id="more-pop" role="dialog" aria-label="More filters" hidden style="top:44px;right:0">
          <div class="grp"><h4>Owner</h4><div id="m-owner"></div></div>
          <div class="grp"><h4>Geography</h4><div id="m-geo"></div></div>
          <div class="pop-foot"><button class="link" id="more-clear">Clear</button><button class="btn primary" id="more-done" style="height:32px">Done</button></div>
        </div>
      </div>
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
    </div>

    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261113x"></script>
<script src="assets/crm-data.js?v=20261113x"></script>
<script>
/* Sales initiatives — the list behind every number on the dashboards (requirement 5.12: list, kanban and funnel views). */
const { money, moneyBig, icon, toast } = CRM;
const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const S = { q: '', mine: 'all', team: '', close: '', owners: [], geo: [], status: 'open', attn: false, view: 'list', sort: 'value', page: 1, stage: '' };
const PER_PAGE = 10;
const STATUS = [
  ['open', 'All open', 'dot-all', o => o.kind === 'open'],
  ['Prospect', 'Prospects', 'dot-pro', o => o.kind === 'open' && o.status === 'Prospect'],
  ['Lead', 'Leads', 'dot-lead', o => o.kind === 'open' && o.status === 'Lead'],
  ['Opportunity', 'Open opportunities', 'dot-opp', o => o.kind === 'open' && o.status === 'Opportunity'],
  ['won', 'Closed won', 'dot-won', o => o.kind === 'won'],
  ['lost', 'Closed lost', 'dot-lost', o => o.kind === 'lost'],
  ['all', 'All', 'dot-all', () => true]
];
const NOUN = { open: 'open initiatives', Prospect: 'prospects', Lead: 'leads', Opportunity: 'open opportunities', won: 'closed won', lost: 'closed lost', all: 'initiatives' };
const fu = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : null;
function needs(o) {
  if (o.kind !== 'open') return [];
  const r = [];
  if (!o.next) r.push('No next step');
  if (o.follow && new Date(o.follow) < TODAY) r.push('Follow-up overdue');
  if (o.close && new Date(o.close) < TODAY) r.push('Close date passed');
  if (o.days > 30) r.push(`${o.days} days in stage`);
  return r;
}
function closeMatch(o) {
  if (!S.close) return true;
  if (S.close === 'none') return !o.close;
  if (!o.close) return false;
  const f = fyq(o.close);
  const [fy, q] = S.close.split('-');
  return f.fy === fy && (!q || f.q === +q);
}
function base() { // every filter except the status tiles, attention and stage chip
  const qs = S.q.trim().toLowerCase();
  return INITS.filter(o =>
    (S.mine === 'all' || o.owner === ME) &&
    (!S.team || o.team === S.team) &&
    (!S.owners.length || S.owners.includes(o.owner)) &&
    (!S.geo.length || S.geo.includes(TEAMS[o.team].geo)) &&
    closeMatch(o) &&
    (!qs || [o.id, o.name, o.acc, o.owner].some(v => v.toLowerCase().includes(qs))));
}
function inStatus(list) { return list.filter(STATUS.find(s => s[0] === S.status)[3]); }
function listRows() {
  let r = inStatus(base());
  if (S.stage) r = r.filter(o => o.sub === S.stage);
  if (S.attn) r = r.filter(o => needs(o).length);
  return r;
}

/* ---------- Render ---------- */
const page = document.getElementById('page');
function zoneHead(n, title, scope) { return `<div class="zone s12"><h2 class="zone-t">${title}</h2><span class="zone-s">${scope}</span></div>`; }
function render() {
  syncControls();
  const b = base();
  page.innerHTML = `
    <div class="grid">
      ${zoneHead(1, 'Lifecycle', 'Prospect → lead → opportunity → closed · select a status to filter the list')}
      ${lifeStrip(b)}
      ${zoneHead(2, 'Initiatives', S.view === 'list' ? 'One row per initiative · select a row to open it' : S.view === 'kanban' ? 'Grouped by main status and funnel code' : 'Every configured sub-stage, in order · select a stage to list it')}
      ${listCard(b)}
    </div>`;
  if (!render.done) { page.querySelectorAll('.card, .zone').forEach((el, i) => { el.classList.add('rise'); el.style.animationDelay = Math.min(i, 8) * 40 + 'ms'; }); render.done = true; }
}

function lifeStrip(b) {
  const tile = ([k, n, dot, f]) => {
    const r = b.filter(f), v = r.reduce((s, o) => s + o.value, 0);
    return `<button class="lt ${S.status === k ? 'on' : ''}" data-act="status" data-v="${k}" aria-pressed="${S.status === k}">
      <span class="lt-k"><i class="${dot}"></i>${n}</span><span class="lt-n">${r.length}</span><span class="lt-v"><b>${money(v)}</b></span></button>`;
  };
  const arrow = `<span class="life-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>`;
  const [open, pro, lead, opp, won, lost, all] = STATUS;
  return `<section class="card s12 life" aria-label="Initiatives by status">${tile(open)}${tile(pro)}${tile(lead)}${tile(opp)}${arrow}${tile(won)}${tile(lost)}${arrow}${tile(all)}</section>`;
}

function listCard(b) {
  const rows = listRows();
  const g = rows.reduce((s, o) => s + o.value, 0), w = rows.reduce((s, o) => s + (o.w || 0), 0);
  const attnN = inStatus(b).filter(o => needs(o).length).length;
  const label = STATUS.find(s => s[0] === S.status)[1];
  const body = S.view === 'list' ? listView(rows) : S.view === 'kanban' ? kanbanView(rows) : funnelView(inStatus(b));
  return `
  <section class="card s12" id="list-card" aria-label="${label}">
    <div class="lt-bar">
      <span class="sum"><b>${rows.length}</b> ${NOUN[S.status]} · <b>${money(g)}</b> total value · <b>${money(w)}</b> weighted</span>
      <span class="chip-row">
        ${S.stage ? `<span class="filter-chip">Stage: ${esc(S.stage)}<button data-act="unstage" aria-label="Clear stage filter"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>` : ''}
        ${attnN || S.attn ? `<button class="tog ${S.attn ? 'on' : ''}" data-act="attn" aria-pressed="${S.attn}" data-tip-h="Needs attention" data-tip="No next step, follow-up overdue, close date passed, or more than 30 days in the stage."><b>${attnN}</b> need attention</button>` : ''}
      </span>
      <span class="sp"></span>
      <div class="seg" role="radiogroup" aria-label="View">
        ${[['list', 'List'], ['kanban', 'Kanban'], ['funnel', 'Funnel']].map(([k, n]) => `<button data-act="view" data-v="${k}" class="${S.view === k ? 'on' : ''}" role="radio" aria-checked="${S.view === k}">${n}</button>`).join('')}
      </div>
    </div>
    ${body}
  </section>`;
}

const SORTS = {
  name: { fn: (a, b) => a.name.localeCompare(b.name), dir: 'asc' },
  stage: { fn: (a, b) => (b.step ?? 99) - (a.step ?? 99), dir: 'desc' },
  value: { fn: (a, b) => b.value - a.value, dir: 'desc' },
  prob: { fn: (a, b) => b.prob - a.prob, dir: 'desc' },
  close: { fn: (a, b) => (a.close || '9999').localeCompare(b.close || '9999'), dir: 'asc' },
  next: { fn: (a, b) => (a.follow || '9999').localeCompare(b.follow || '9999'), dir: 'asc' }
};
function th(key, label, cls = '', tip = '') {
  if (!key) return `<th class="${cls}">${tip ? `<span class="def" tabindex="0" data-tip="${tip}">${label}</span>` : label}</th>`;
  const on = S.sort === key;
  return `<th class="${cls}" aria-sort="${on ? (SORTS[key].dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button class="th-sort ${on ? 'on' : ''}" data-act="sort" data-v="${key}">${label}<span class="arr" aria-hidden="true">${on ? (SORTS[key].dir === 'asc' ? '↑' : '↓') : '↕'}</span></button></th>`;
}
const ell = (txt, cls = '') => `<div class="ell ${cls}" title="${esc(txt)}">${esc(txt)}</div>`;
function prog(o) {
  if (o.kind !== 'open') return '';
  return `<div class="prog" aria-label="Step ${o.step + 1} of ${ALL_STEPS.length}">${ALL_STEPS.map((_, i) => `<i class="${i < o.step ? 'f' : i === o.step ? 'c' : ''} ${i === 3 || i === 6 ? 'sep' : ''}"></i>`).join('')}</div>`;
}
function stagePill(o) { return o.kind === 'open' ? `<span class="st ${o.status}">${o.status}</span>` : `<span class="st ${o.kind}">${o.kind === 'won' ? 'Won' : 'Lost'}</span>`; }
function listView(rows) {
  if (!rows.length) return emptyMsg();
  rows = rows.slice().sort(SORTS[S.sort].fn);
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  S.page = Math.min(S.page, pages);
  const shown = rows.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  return `
    <div class="tbl-wrap"><table class="tbl si">
      <colgroup><col class="c-name"><col class="c-stage"><col class="c-own"><col class="c-val"><col class="c-prob"><col class="c-close"><col class="c-next"></colgroup>
      <thead><tr>${th('name', 'Initiative')}${th('stage', 'Stage', '', 'Main status and sub-stage. The bar shows the 13 configured steps: 3 prospect, 3 lead, 7 opportunity.')}${th('', 'Owner / team')}${th('value', 'Value', 'r')}${th('prob', 'Prob.', 'r')}${th('close', 'Close')}${th('next', 'Next step')}</tr></thead>
      <tbody>${shown.map(o => {
        const local = localAmount(o.value, o.cur), late = o.follow && new Date(o.follow) < TODAY, passed = o.kind === 'open' && o.close && new Date(o.close) < TODAY;
        return `<tr class="click" data-act="open" data-id="${o.id}" tabindex="0">
          <td>${ell(o.name, 't-main')}${ell(`${o.id} · ${o.acc}`, 't-sub')}</td>
          <td><div class="stg2">${stagePill(o)}${o.kind === 'open' ? `<span class="ell" title="${esc(o.sub)}">${o.sub}</span>${o.code ? `<span class="code">${o.code}</span>` : ''}` : `<span class="muted">${o.kind === 'won' ? 'Closed won · L0' : 'Closed lost'}</span>`}</div>
            ${o.kind === 'open' ? `${prog(o)}<div class="t-sub ${o.days > 30 ? 'hot' : ''}" style="margin-top:4px">${o.days} days in stage</div>` : `<div class="t-sub">${o.kind === 'lost' ? esc(o.reason) : 'Booked'}</div>`}</td>
          <td>${ell(o.owner)}${ell(o.team, 't-sub')}</td>
          <td class="r num"><div class="t-val">${money(o.value)}</div>${local ? `<div class="t-sub">${local}</div>` : ''}</td>
          <td class="r num">${o.prob}%</td>
          <td class="num">${o.close ? `<span class="${passed ? 'hot' : ''}">${fmtDate(o.close)}</span>` : '<span class="muted">Not set</span>'}</td>
          <td>${o.kind !== 'open' ? '<span class="muted">—</span>' : o.next ? `<div class="next-t" title="${esc(o.next)}">${esc(o.next)}</div>${o.follow ? `<div class="fu ${late ? 'late' : ''}">${late ? 'Overdue' : 'Follow-up'} ${fu(o.follow)}</div>` : ''}` : '<span class="next-none">No next step</span>'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, rows.length)} of ${rows.length}</span><span class="sp"></span>
      <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
      ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
      <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button>
    </div>`;
}

function kanbanView(rows) {
  const cols = [
    ['Prospect', 'dot-pro', o => o.kind === 'open' && o.status === 'Prospect'],
    ['Lead', 'dot-lead', o => o.kind === 'open' && o.status === 'Lead'],
    ['Opportunity · L3', 'dot-opp', o => o.kind === 'open' && o.code === 'L3'],
    ['Opportunity · L2', 'dot-opp', o => o.kind === 'open' && o.code === 'L2'],
    ['Opportunity · L1', 'dot-opp', o => o.kind === 'open' && o.code === 'L1'],
    ['Closed won', 'dot-won', o => o.kind === 'won'],
    ['Closed lost', 'dot-lost', o => o.kind === 'lost']
  ].filter(c => rows.some(c[2]) || (S.status === 'open' && c[0].indexOf('Closed') < 0) || (S.status === 'Opportunity' && c[0].startsWith('Opp')));
  if (!rows.length) return emptyMsg();
  return `<div class="kb">${cols.map(([n, dot, f]) => {
    const r = rows.filter(f).sort((a, b) => b.value - a.value);
    return `<div class="kb-col"><div class="kb-h"><i class="${dot}"></i>${n}<small>${r.length} · ${money(r.reduce((s, o) => s + o.value, 0))}</small></div>
      ${r.length ? r.map(o => `<button class="kb-c" data-act="open" data-id="${o.id}"><b>${esc(o.name)}</b><small>${esc(o.acc)}</small><small>${esc(o.sub)} · ${esc(o.owner)}</small>
        <span class="kb-v">${money(o.value)}<span>${o.kind === 'open' ? (o.close ? fu(o.close) : 'No close date') : fu(o.close)}</span></span></button>`).join('') : '<div class="kb-empty">Nothing here</div>'}
    </div>`;
  }).join('')}</div>`;
}

function funnelView(rows) {
  if (!rows.length) return emptyMsg();
  const groups = [['Prospect', PRE_STAGES.Prospect, 'dot-pro', '#a8dcf4'], ['Lead', PRE_STAGES.Lead, 'dot-lead', '#00A0E4'], ['Opportunity', STAGES.map(x => x.name), 'dot-opp', 'var(--deep)'], ['Closed', ['Closed won', 'Closed lost'], 'dot-won', 'var(--ink)']];
  const max = Math.max(1, ...ALL_STEPS.concat(['Closed won', 'Closed lost']).map(st => rows.filter(o => o.sub === st).reduce((s, o) => s + o.value, 0)));
  return `<div class="fn">${groups.map(([g, steps, dot, color]) => {
    const inG = rows.filter(o => steps.includes(o.sub));
    if (g === 'Closed' && !inG.length) return '';
    return `<div class="fn-g"><span class="st ${g === 'Closed' ? 'won' : g}">${g}</span>${inG.length} · ${money(inG.reduce((s, o) => s + o.value, 0))}</div>` + steps.map(st => {
      const r = rows.filter(o => o.sub === st), v = r.reduce((s, o) => s + o.value, 0);
      return `<button class="fn-r ${r.length ? '' : 'zero'}" ${r.length ? `data-act="stage" data-v="${esc(st)}"` : 'disabled'}>
        <span class="fn-n">${st}</span><span class="fn-bar">${v ? `<i style="width:${Math.max(v / max * 100, 1.5).toFixed(1)}%;background:${st === 'Closed lost' ? 'var(--chart-gray)' : color}"></i>` : ''}</span>
        <span class="fn-c">${r.length} deal${r.length === 1 ? '' : 's'}</span><span class="fn-v">${r.length ? money(v) : '—'}</span>${r.length ? chev : '<span></span>'}</button>`;
    }).join('');
  }).join('')}</div>`;
}

function emptyMsg() {
  const any = S.q || S.mine !== 'all' || S.team || S.close || S.owners.length || S.geo.length || S.attn || S.stage;
  return `<div class="empty"><b>No initiatives match</b>${S.mine === 'me' ? 'You have nothing in this status. ' : ''}${any ? '<button class="link" data-act="reset">Clear filters</button>' : ''}</div>`;
}

/* ---------- Controls ---------- */
const $ = (s) => document.querySelector(s);
function syncControls() {
  document.querySelectorAll('#f-mine button').forEach(b => { const on = b.dataset.v === S.mine; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  const teams = Object.keys(TEAMS).filter(t => !S.geo.length || S.geo.includes(TEAMS[t].geo));
  $('#f-team').innerHTML = `<option value="">All teams</option>` + teams.map(t => `<option ${S.team === t ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const closeOpts = [['', 'Any date'], ['2627', 'FY26-27'], ['2627-3', 'Q3 FY26-27 (now)'], ['2627-4', 'Q4 FY26-27'], ['2728', 'FY27-28'], ['none', 'Not set']];
  $('#f-close').innerHTML = closeOpts.map(([v, n]) => `<option value="${v}" ${S.close === v ? 'selected' : ''}>${n}</option>`).join('');
  $('#w-team').classList.toggle('set', !!S.team);
  $('#w-close').classList.toggle('set', !!S.close);
  const more = S.owners.length + S.geo.length;
  $('#more-n').hidden = !more; $('#more-n').textContent = more;
  $('#reset').hidden = !(S.q || S.mine !== 'all' || S.team || S.close || more || S.attn || S.stage || S.status !== 'open');
}
function buildMore() {
  const people = [...new Set(Object.values(TEAMS).flatMap(t => t.people))].sort();
  $('#m-owner').innerHTML = people.map(p => `<label class="check"><input type="checkbox" data-m="owners" value="${esc(p)}" ${S.owners.includes(p) ? 'checked' : ''}>${esc(p)}${p === ME ? ' (you)' : ''}</label>`).join('');
  $('#m-geo').innerHTML = Object.keys(GEO_TARGET).map(g => `<label class="check"><input type="checkbox" data-m="geo" value="${g}" ${S.geo.includes(g) ? 'checked' : ''}>${g}</label>`).join('');
}
function setMore(open) { $('#more-pop').hidden = !open; $('#more-btn').setAttribute('aria-expanded', open); if (open) buildMore(); }
function resetAll() { const v = S.view; Object.assign(S, { q: '', mine: 'all', team: '', close: '', owners: [], geo: [], status: 'open', attn: false, page: 1, stage: '' }); S.view = v; $('#f-search').value = ''; render(); }

let searchT;
$('#f-search').addEventListener('input', (e) => { clearTimeout(searchT); searchT = setTimeout(() => { S.q = e.target.value; S.page = 1; render(); }, 150); });
$('#f-mine').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.mine = b.dataset.v; S.page = 1; render(); });
$('#f-team').addEventListener('change', (e) => { S.team = e.target.value; S.page = 1; render(); });
$('#f-close').addEventListener('change', (e) => { S.close = e.target.value; S.page = 1; render(); });
$('#reset').addEventListener('click', resetAll);
$('#more-btn').addEventListener('click', (e) => { e.stopPropagation(); setMore($('#more-pop').hidden); });
$('#more-pop').addEventListener('click', (e) => e.stopPropagation());
$('#more-pop').addEventListener('change', (e) => {
  const i = e.target, arr = S[i.dataset.m], k = arr.indexOf(i.value);
  if (i.checked && k < 0) arr.push(i.value); if (!i.checked && k >= 0) arr.splice(k, 1);
  S.page = 1; render();
});
$('#more-clear').addEventListener('click', () => { S.owners = []; S.geo = []; buildMore(); render(); });
$('#more-done').addEventListener('click', () => setMore(false));
document.addEventListener('click', () => setMore(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMore(false); });

page.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'status') { S.status = a.dataset.v; S.page = 1; S.stage = ''; render(); }
  else if (act === 'attn') { S.attn = !S.attn; S.page = 1; render(); }
  else if (act === 'view') { S.view = a.dataset.v; S.page = 1; render(); }
  else if (act === 'stage') { S.stage = a.dataset.v; S.view = 'list'; S.page = 1; render(); }
  else if (act === 'unstage') { S.stage = ''; S.page = 1; render(); }
  else if (act === 'sort') { S.sort = a.dataset.v; S.page = 1; render(); }
  else if (act === 'page') { S.page = +a.dataset.v; render(); }
  else if (act === 'open') { const o = INITS.find(x => x.id === a.dataset.id); toast(`Would open ${o.id} · ${o.name}`); }
  else if (act === 'reset') resetAll();
});
page.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });
$('#new').addEventListener('click', () => toast('Would open the new Sales initiative form'));
$('#export').addEventListener('click', () => {
  const rows = listRows();
  const head = ['Initiative', 'Name', 'Account', 'Main status', 'Sub-stage', 'Owner', 'Team', 'Value (USD)', 'Probability %', 'Expected close', 'Next step', 'Follow-up'];
  const csv = [head, ...rows.map(o => [o.id, o.name, o.acc, o.kind === 'open' ? o.status : o.kind === 'won' ? 'Closed won' : 'Closed lost', o.sub, o.owner, o.team, Math.round(o.value), o.prob, o.close || '', o.next || '', o.follow || ''])]
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = 'sales-initiatives.csv'; a.click();
  toast(`Exported ${rows.length} initiatives`);
});

CRM.renderShell('initiatives');
CRM.watchSticky($('#filters'));
render();
</script>
</body>
</html>
