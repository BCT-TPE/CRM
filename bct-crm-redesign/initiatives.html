<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales initiatives · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="design-system/tokens.css?v=20261118b">
<link rel="stylesheet" href="assets/crm.css?v=20261118a">

<style>
/* ---------- Page: Sales initiatives (list page) ---------- */
/* Lifecycle strip: status tiles filter the list (list-page behaviour, as in the old CRM) */
/* Lifecycle: three related groups, each its own card. Open = total + its three statuses (in order);
   Closed = won + lost; All = everything. Selected tile = soft fill only (no underline). */
.life-g { padding: 8px; gap: 0; }
.life-h { display: flex; align-items: baseline; gap: 8px; padding: 10px 16px 4px; font-size: var(--text-xs); font-weight: 600; color: var(--ink); }
.life-h span { font-weight: 400; color: var(--t3); }
.life-cells { display: grid; gap: 4px; align-items: stretch; flex: 1; }
.life-open .life-cells { grid-template-columns: 1.1fr 1fr 1fr 1fr; }
.life-closed .life-cells { grid-template-columns: 1fr 1fr; }
.life-all .life-cells { grid-template-columns: 1fr; }
.lt { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 12px 16px 14px; border: 0; border-radius: var(--radius-lg); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.lt:hover { background: var(--hover); }
.lt.on { background: var(--info-bg); }
.lt-k { display: flex; align-items: center; gap: 7px; font-size: var(--text-xs); color: var(--t3); white-space: nowrap; }
.lt-k i { width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; }
.lt-n { font-size: var(--text-3xl); font-weight: 400; letter-spacing: -.03em; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
.lt-v { font-size: var(--text-xs); color: var(--t3); font-variant-numeric: tabular-nums; }
.lt-v b { font-weight: 500; color: var(--t1); }
.dot-pro { background: var(--cyan-200); } .dot-lead { background: var(--cyan); } .dot-opp { background: var(--deep); } .dot-won { background: var(--ink); } .dot-lost { background: var(--chart-gray); } .dot-all { background: var(--t3); }

/* List toolbar inside the card */
.lt-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.lt-bar .sum { font-size: var(--text-sm); color: var(--t2); }
.lt-bar .sum b { font-weight: 600; color: var(--ink); }
.lt-bar .sp { flex: 1; }
.tog { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-pill); background: var(--surface); font: inherit; font-size: var(--text-xs); color: var(--t2); cursor: pointer; }
.tog b { font-weight: 600; color: var(--danger); }
.tog:hover { border-color: var(--line-3); }
.tog.on { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
.chip-row { display: flex; gap: 8px; align-items: center; }

/* Status pill */
.st { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--radius-sm); font-size: var(--text-2xs); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.st.Prospect { background: var(--cyan-50); color: var(--cyan-text); } .st.Lead { background: var(--ice); color: var(--cyan-text); } .st.Opportunity { background: var(--info-bg); color: var(--deep); }
.st.won { background: var(--chart-pipe-soft); color: var(--ink); } .st.lost { background: var(--hover); color: var(--t3); }
.stg2 { display: flex; align-items: center; gap: 7px; min-width: 0; }
/* 13-step progress: 3 prospect · 3 lead · 7 opportunity sub-stages */
.prog { display: flex; gap: 2px; width: max-content; margin-top: 0; padding: 6px 0 2px; cursor: help; } /* taller hit area for the tooltip */
.prog i { width: 8px; height: 4px; border-radius: var(--radius-2xs); background: var(--chart-track); }
.prog i.f { background: var(--chart-step); }
.prog i.c { background: var(--ink); }
.prog i.sep { margin-left: 3px; }

/* Table */
.tbl.si { table-layout: fixed; }
.tbl.si col.c-name { width: 21%; } .tbl.si col.c-stage { width: 25%; } .tbl.si col.c-own { width: 14%; } .tbl.si col.c-val { width: 10%; }
.tbl.si col.c-prob { width: 6%; } .tbl.si col.c-close { width: 9%; } .tbl.si col.c-next { width: 15%; }
.tbl.si td { height: 64px; padding-top: 10px; padding-bottom: 10px; }
.next-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next-none { color: var(--danger); }
.fu { font-size: var(--text-xs); color: var(--t3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fu.late { color: var(--danger); }

/* Kanban */
.kb { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.kb-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px; border-radius: var(--radius-lg); background: var(--canvas); }
.kb-h { display: flex; align-items: center; gap: 7px; padding: 2px 4px 6px; font-size: var(--text-xs); font-weight: 600; color: var(--ink); }
.kb-h i { width: 8px; height: 8px; border-radius: var(--radius-full); }
.kb-h small { margin-left: auto; font-weight: 400; color: var(--t3); font-variant-numeric: tabular-nums; }
.kb-c { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); background: var(--surface); text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kb-c:hover { border-color: var(--line-3); box-shadow: var(--shadow-raise); }
.kb-c b { font-size: var(--text-sm); font-weight: 500; color: var(--ink); line-height: 1.35; }
.kb-c small { font-size: var(--text-xs); color: var(--t3); }
.kb-c .kb-v { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; font-size: var(--text-sm); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.kb-c .kb-v span { font-size: var(--text-xs); font-weight: 400; color: var(--t3); }
.v2 .kb-c { border-radius: var(--radius-lg); border-color: var(--glass-line); box-shadow: var(--shadow-card); } /* same border and shadow as cards */
.v2 .kb-c:hover { border-color: var(--line-3); }
/* Selected tile: same soft fill as Pipeline mix on white cards; white (no border) on the tinted Open card */
.v2 .lt.on { background: var(--hover); box-shadow: none; }
.v2 .life-open .lt.on { background: var(--surface); }
.kb-empty { padding: 16px 4px; font-size: var(--text-xs); color: var(--t3); text-align: center; }

/* Lifecycle funnel (same structure as CRMpulse): one band per stage, width = initiatives that reached it,
   "here now" + avg days on the right, conversion between bands, KPI tiles beside, the selected band's records below. */
.fn-wrap { display: flex; flex-direction: column; gap: 20px; } /* KPI row on top, funnel below */
.fn-h { margin: 0 0 2px; font-size: var(--text-md); font-weight: 600; color: var(--ink); }
.fn-p { margin: 0; font-size: var(--text-xs); color: var(--t3); }
/* Drop-off columns (Mixpanel style): solid = reached this stage, faint cap = lost since the stage before */
.fnc-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.fnc { display: flex; flex-direction: column; align-items: stretch; min-width: 0; padding: 10px 10px 12px; border: 1px solid transparent; border-radius: var(--radius-lg); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.fnc:hover { background: var(--hover); }
.fnc.on { background: var(--hover); } /* fill only, same as Pipeline mix */
.fnc-plot { position: relative; height: 200px; display: flex; flex-direction: column; justify-content: flex-end; }
.fnc-n { margin-bottom: 6px; text-align: center; font-size: var(--text-sm); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.fnc-drop { border-radius: var(--radius-sm) var(--radius-sm) 0 0; opacity: .22; }
.fnc-bar { border-radius: 0 0 var(--radius-sm) var(--radius-sm); transition: height .45s var(--ease); }
.fnc-drop + .fnc-bar { border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
.fnc-bar:first-child { border-radius: var(--radius-sm); }
.fnc-conv { margin-top: 8px; text-align: center; font-size: var(--text-xs); color: var(--t3); }
.fnc-conv b { font-weight: 600; color: var(--ok); } .fnc-conv b.lo { color: var(--warn); }
.fnc-k { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: var(--text-sm); font-weight: 500; color: var(--ink); white-space: nowrap; }
.fnc-k small { display: block; font-size: var(--text-xs); font-weight: 400; color: var(--t3); }
.fnc-s { margin-top: 6px; font-size: var(--text-xs); color: var(--t3); line-height: 1.45; }
.fnc-s b { font-weight: 600; color: var(--ink); }
.fn-note { margin: 14px 0 0; font-size: var(--text-xs); color: var(--t3); }
.fn-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.fk { padding: 14px 16px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); background: var(--surface); }
.fk-k { font-size: var(--text-xs); color: var(--t3); }
.fk-v { margin-top: 6px; font-size: var(--text-2xl); font-weight: 500; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.fk-v.neg { color: var(--danger); } .fk-v.warn { color: var(--warn); }
.fk-s { margin-top: 4px; font-size: var(--text-xs); color: var(--t3); }
.fn-list { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
.fn-list-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.fn-list-h b { font-size: var(--text-md); font-weight: 600; color: var(--ink); }
.fn-list-h span { font-size: var(--text-xs); color: var(--t3); }
.tbl.fnt col.c-n { width: 34%; } .tbl.fnt col.c-s { width: 24%; } .tbl.fnt col.c-o { width: 18%; } .tbl.fnt col.c-v { width: 12%; } .tbl.fnt col.c-d { width: 12%; }

.filter-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: var(--radius-pill); background: var(--midnight); color: var(--on-dark); font-size: var(--text-xs); }
.filter-chip button { display: grid; place-items: center; width: 18px; height: 18px; border: 0; border-radius: var(--radius-full); background: var(--on-dark-soft); color: var(--on-dark); cursor: pointer; padding: 0; }
.filter-chip svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 2; fill: none; }
</style>
</head>
<body class="v2">
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="v2-head">
      <div class="v2-hello">
        <div class="v2-top"><span class="v2-eyebrow">Sales</span></div>
        <h1>Sales initiatives</h1>
        <p>Prospects, leads and opportunities as one record, from first interest to closure · USD</p>
      </div>
      <div class="acts" style="display:flex;gap:8px">
        <button class="btn" id="export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export to Excel</button>
        <button class="btn primary" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New sales initiative</button>
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Search ID, name, account, owner" aria-label="Search initiatives"></label>
      <div class="seg" id="f-mine" role="radiogroup" aria-label="Whose initiatives">
        <button data-v="all" class="on" role="radio" aria-checked="true">Everyone</button>
        <button data-v="me" role="radio" aria-checked="false">My initiatives</button>
      </div>
      <label class="select" id="w-team"><span class="lbl">Team</span><select id="f-team" aria-label="Sales team"></select></label>
      <label class="select" id="w-close"><span class="lbl">Expected close</span><select id="f-close" aria-label="Expected close"></select></label>
      <div style="position:relative">
        <button class="btn" id="more-btn" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>More filters<span class="count-badge" id="more-n" hidden></span></button>
        <div class="pop" id="more-pop" role="dialog" aria-label="More filters" hidden style="top:44px;right:0">
          <div class="grp"><h4>Owner</h4><div id="m-owner"></div></div>
          <div class="grp"><h4>Geography</h4><div id="m-geo"></div></div>
          <div class="pop-foot"><button class="link" id="more-clear">Clear</button><button class="btn primary" id="more-done" style="height:32px">Done</button></div>
        </div>
      </div>
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
    </div>

    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261118a"></script>
<script src="assets/crm-data.js?v=20261116a"></script>
<script>
/* Sales initiatives — the list behind every number on the dashboards (requirement 5.12: list, kanban and funnel views). */
const { money, moneyBig, icon, toast } = CRM;
const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const S = { q: '', mine: 'all', team: '', close: '', owners: [], geo: [], status: 'open', attn: false, view: 'list', sort: 'value', page: 1, stage: '', band: '' };
const PER_PAGE = 10;
const STATUS = [
  ['open', 'All open', 'dot-all', o => o.kind === 'open'],
  ['Prospect', 'Prospects', 'dot-pro', o => o.kind === 'open' && o.status === 'Prospect'],
  ['Lead', 'Leads', 'dot-lead', o => o.kind === 'open' && o.status === 'Lead'],
  ['Opportunity', 'Open opportunities', 'dot-opp', o => o.kind === 'open' && o.status === 'Opportunity'],
  ['won', 'Closed won', 'dot-won', o => o.kind === 'won'],
  ['lost', 'Closed lost', 'dot-lost', o => o.kind === 'lost'],
  ['all', 'All', 'dot-all', () => true]
];
const NOUN = { open: 'open initiatives', Prospect: 'prospects', Lead: 'leads', Opportunity: 'open opportunities', won: 'closed won', lost: 'closed lost', all: 'initiatives' };
const fu = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : null;
function needs(o) {
  if (o.kind !== 'open') return [];
  const r = [];
  if (!o.next) r.push('No next step');
  if (o.follow && new Date(o.follow) < TODAY) r.push('Follow-up overdue');
  if (o.close && new Date(o.close) < TODAY) r.push('Close date passed');
  if (o.days > 30) r.push(`${o.days} days in stage`);
  return r;
}
function closeMatch(o) {
  if (!S.close) return true;
  if (S.close === 'none') return !o.close;
  if (!o.close) return false;
  const f = fyq(o.close);
  const [fy, q] = S.close.split('-');
  return f.fy === fy && (!q || f.q === +q);
}
function base() { // every filter except the status tiles, attention and stage chip
  const qs = S.q.trim().toLowerCase();
  return INITS.filter(o =>
    (S.mine === 'all' || o.owner === ME) &&
    (!S.team || o.team === S.team) &&
    (!S.owners.length || S.owners.includes(o.owner)) &&
    (!S.geo.length || S.geo.includes(TEAMS[o.team].geo)) &&
    closeMatch(o) &&
    (!qs || [o.id, o.name, o.acc, o.owner].some(v => v.toLowerCase().includes(qs))));
}
function inStatus(list) { return list.filter(STATUS.find(s => s[0] === S.status)[3]); }
function listRows() {
  let r = inStatus(base());
  if (S.stage) r = r.filter(o => o.sub === S.stage);
  if (S.attn) r = r.filter(o => needs(o).length);
  return r;
}

/* ---------- Render ---------- */
const page = document.getElementById('page');
function zoneHead(n, title, scope) { return `<div class="zone s12"><h2 class="zone-t">${title}</h2><span class="zone-s">${scope}</span></div>`; }
function render() {
  syncControls();
  const b = base();
  page.innerHTML = `
    <div class="grid">
      ${zoneHead(1, 'Lifecycle', 'Prospect → lead → opportunity → closed · select a status to filter the list')}
      ${lifeStrip(b)}
      ${zoneHead(2, 'Initiatives', S.view === 'list' ? 'One row per initiative · select a row to open it' : S.view === 'kanban' ? 'Grouped by main status and funnel code' : 'How far initiatives get · the status tiles above do not apply here')}
      ${listCard(b)}
    </div>`;
  if (!render.done) { page.querySelectorAll('.card, .zone').forEach((el, i) => { el.classList.add('rise'); el.style.animationDelay = Math.min(i, 8) * 40 + 'ms'; }); render.done = true; }
}

function lifeStrip(b) {
  const sum = (f) => { const r = b.filter(f); return [r.length, r.reduce((s, o) => s + o.value, 0)]; };
  const tile = ([k, n, dot, f], short) => {
    const [c, v] = sum(f);
    return `<button class="lt ${S.status === k ? 'on' : ''}" data-act="status" data-v="${k}" aria-pressed="${S.status === k}">
      <span class="lt-k"><i class="${dot}"></i>${short || n}</span><span class="lt-n">${c}</span><span class="lt-v"><b>${money(v)}</b></span></button>`;
  };
  const [open, pro, lead, opp, won, lost, all] = STATUS;
  const [, closedV] = sum(o => o.kind !== 'open'), closedN = sum(o => o.kind !== 'open')[0];
  return `
    <section class="card s7 life-g life-open tint" aria-label="Open initiatives">
      <div class="life-h">Open<span>in progress, from first interest to opportunity</span></div>
      <div class="life-cells">${tile(open, 'All open')}${tile(pro)}${tile(lead)}${tile(opp, 'Opportunities')}</div>
    </section>
    <section class="card s3 life-g life-closed" aria-label="Closed initiatives">
      <div class="life-h">Closed<span>${closedN} · ${money(closedV)}</span></div>
      <div class="life-cells">${tile(won, 'Won')}${tile(lost, 'Lost')}</div>
    </section>
    <section class="card s2 life-g life-all" aria-label="All initiatives">
      <div class="life-h">Total<span>all time</span></div>
      <div class="life-cells">${tile(all)}</div>
    </section>`;
}

function listCard(b) {
  const rows = listRows();
  const g = rows.reduce((s, o) => s + o.value, 0), w = rows.reduce((s, o) => s + (o.w || 0), 0);
  const attnN = inStatus(b).filter(o => needs(o).length).length;
  const label = STATUS.find(s => s[0] === S.status)[1];
  const body = S.view === 'list' ? listView(rows) : S.view === 'kanban' ? kanbanView(rows) : funnelView(b);
  return `
  <section class="card s12" id="list-card" aria-label="${label}">
    <div class="lt-bar">
      <span class="sum"><b>${rows.length}</b> ${NOUN[S.status]} · <b>${money(g)}</b> total value · <b>${money(w)}</b> weighted</span>
      <span class="chip-row">
        ${S.stage ? `<span class="filter-chip">Stage: ${esc(S.stage)}<button data-act="unstage" aria-label="Clear stage filter"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>` : ''}
        ${attnN || S.attn ? `<button class="tog ${S.attn ? 'on' : ''}" data-act="attn" aria-pressed="${S.attn}" data-tip-h="Needs attention" data-tip="No next step, follow-up overdue, close date passed, or more than 30 days in the stage."><b>${attnN}</b> need attention</button>` : ''}
      </span>
      <span class="sp"></span>
      <div class="seg" role="radiogroup" aria-label="View">
        ${[['list', 'List'], ['kanban', 'Kanban'], ['funnel', 'Funnel']].map(([k, n]) => `<button data-act="view" data-v="${k}" class="${S.view === k ? 'on' : ''}" role="radio" aria-checked="${S.view === k}">${n}</button>`).join('')}
      </div>
    </div>
    ${body}
  </section>`;
}

const SORTS = {
  name: { fn: (a, b) => a.name.localeCompare(b.name), dir: 'asc' },
  stage: { fn: (a, b) => (b.step ?? 99) - (a.step ?? 99), dir: 'desc' },
  value: { fn: (a, b) => b.value - a.value, dir: 'desc' },
  prob: { fn: (a, b) => b.prob - a.prob, dir: 'desc' },
  close: { fn: (a, b) => (a.close || '9999').localeCompare(b.close || '9999'), dir: 'asc' },
  next: { fn: (a, b) => (a.follow || '9999').localeCompare(b.follow || '9999'), dir: 'asc' }
};
function th(key, label, cls = '', tip = '') {
  if (!key) return `<th class="${cls}">${tip ? `<span class="def" tabindex="0" data-tip="${tip}">${label}</span>` : label}</th>`;
  const on = S.sort === key;
  return `<th class="${cls}" aria-sort="${on ? (SORTS[key].dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button class="th-sort ${on ? 'on' : ''}" data-act="sort" data-v="${key}">${label}<span class="arr" aria-hidden="true">${on ? (SORTS[key].dir === 'asc' ? '↑' : '↓') : '↑'}</span></button></th>`;
}
const ell = (txt, cls = '') => `<div class="ell ${cls}">${esc(txt)}</div>`;
function prog(o) {
  if (o.kind !== 'open') return '';
  // Tooltip explains the dashes: one per sub-stage across the lifecycle, grouped prospect · lead · opportunity
  const n = ALL_STEPS.length, next = ALL_STEPS[o.step + 1];
  const grp = (name, list) => `<div class='row'><span>${name}${name === o.status ? ' · now' : ''}</span><span>${list.length} sub-stages</span></div>`;
  const tip = `<b>Lifecycle · step ${o.step + 1} of ${n}</b>`
    + grp('Prospect', PRE_STAGES.Prospect) + grp('Lead', PRE_STAGES.Lead) + grp('Opportunity', STAGES)
    + `<div class='row'><span>Now</span><span>${esc(o.sub)}</span></div>`
    + (next ? `<div class='row'><span>Next</span><span>${esc(next)}</span></div>` : '')
    + `<div class='row'><span>One dash per sub-stage · dark = now</span></div>`;
  return `<div class="prog" tabindex="0" aria-label="Lifecycle step ${o.step + 1} of ${n}: ${esc(o.sub)}" data-tip-html="${tip}">${ALL_STEPS.map((_, i) => `<i class="${i < o.step ? 'f' : i === o.step ? 'c' : ''} ${i === 3 || i === 6 ? 'sep' : ''}"></i>`).join('')}</div>`;
}
function stagePill(o) { return o.kind === 'open' ? `<span class="st ${o.status}">${o.status}</span>` : `<span class="st ${o.kind}">${o.kind === 'won' ? 'Won' : 'Lost'}</span>`; }
function listView(rows) {
  if (!rows.length) return emptyMsg();
  rows = rows.slice().sort(SORTS[S.sort].fn);
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  S.page = Math.min(S.page, pages);
  const shown = rows.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  return `
    <div class="tbl-wrap"><table class="tbl si">
      <colgroup><col class="c-name"><col class="c-stage"><col class="c-own"><col class="c-val"><col class="c-prob"><col class="c-close"><col class="c-next"></colgroup>
      <thead><tr>${th('name', 'Initiative')}${th('stage', 'Stage', '', 'Main status and sub-stage. The bar shows the 13 configured steps: 3 prospect, 3 lead, 7 opportunity.')}${th('', 'Owner / team')}${th('value', 'Value', 'r')}${th('prob', 'Prob.', 'r')}${th('close', 'Close')}${th('next', 'Next step')}</tr></thead>
      <tbody>${shown.map(o => {
        const local = localAmount(o.value, o.cur), late = o.follow && new Date(o.follow) < TODAY, passed = o.kind === 'open' && o.close && new Date(o.close) < TODAY;
        return `<tr class="click" data-act="open" data-id="${o.id}" tabindex="0">
          <td>${ell(o.name, 't-main')}${ell(`${o.id} · ${o.acc}`, 't-sub')}</td>
          <td><div class="stg2">${stagePill(o)}${o.kind === 'open' ? `<span class="ell">${o.sub}</span>${o.code ? `<span class="code">${o.code}</span>` : ''}` : `<span class="muted">${o.kind === 'won' ? 'Closed won · L0' : 'Closed lost'}</span>`}</div>
            ${o.kind === 'open' ? `${prog(o)}<div class="t-sub ${o.days > 30 ? 'hot' : ''}" style="margin-top:4px">${o.days} days in stage</div>` : `<div class="t-sub">${o.kind === 'lost' ? esc(o.reason) : 'Booked'}</div>`}</td>
          <td><div class="own">${CRM.avatar(o.owner)}<div class="own-t">${ell(o.owner)}${ell(o.team, 't-sub')}</div></div></td>
          <td class="r num"><div class="t-val">${money(o.value)}</div>${local ? `<div class="t-sub">${local}</div>` : ''}</td>
          <td class="r num">${o.prob}%</td>
          <td class="num">${o.close ? `<span class="${passed ? 'hot' : ''}">${fmtDate(o.close)}</span>` : '<span class="muted">Not set</span>'}</td>
          <td>${o.kind !== 'open' ? '<span class="muted">—</span>' : o.next ? `<div class="next-t">${esc(o.next)}</div>${o.follow ? `<div class="fu ${late ? 'late' : ''}">${late ? 'Overdue' : 'Follow-up'} ${fu(o.follow)}</div>` : ''}` : '<span class="next-none">No next step</span>'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, rows.length)} of ${rows.length}</span><span class="sp"></span>
      <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
      ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
      <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button>
    </div>`;
}

function kanbanView(rows) {
  const cols = [
    ['Prospect', 'dot-pro', o => o.kind === 'open' && o.status === 'Prospect'],
    ['Lead', 'dot-lead', o => o.kind === 'open' && o.status === 'Lead'],
    ['Opportunity · L3', 'dot-opp', o => o.kind === 'open' && o.code === 'L3'],
    ['Opportunity · L2', 'dot-opp', o => o.kind === 'open' && o.code === 'L2'],
    ['Opportunity · L1', 'dot-opp', o => o.kind === 'open' && o.code === 'L1'],
    ['Closed won', 'dot-won', o => o.kind === 'won'],
    ['Closed lost', 'dot-lost', o => o.kind === 'lost']
  ].filter(c => rows.some(c[2]) || (S.status === 'open' && c[0].indexOf('Closed') < 0) || (S.status === 'Opportunity' && c[0].startsWith('Opp')));
  if (!rows.length) return emptyMsg();
  return `<div class="kb">${cols.map(([n, dot, f]) => {
    const r = rows.filter(f).sort((a, b) => b.value - a.value);
    return `<div class="kb-col"><div class="kb-h"><i class="${dot}"></i>${n}<small>${r.length} · ${money(r.reduce((s, o) => s + o.value, 0))}</small></div>
      ${r.length ? r.map(o => `<button class="kb-c" data-act="open" data-id="${o.id}"><b>${esc(o.name)}</b><small>${esc(o.acc)}</small><small>${esc(o.sub)} · ${esc(o.owner)}</small>
        <span class="kb-v">${money(o.value)}<span>${o.kind === 'open' ? (o.close ? fu(o.close) : 'No close date') : fu(o.close)}</span></span></button>`).join('') : '<div class="kb-empty">Nothing here</div>'}
    </div>`;
  }).join('')}</div>`;
}

// Lifecycle funnel. "Reached" = initiatives whose furthest stage is at or past the band (a skipped stage still counts as
// passed); lost initiatives count up to where they got and are never "here now". Uses every status, so the status tiles don't apply.
const BANDS = [
  { k: 'pro', n: 'Prospect', fill: 'var(--cyan-200)', f: o => o.kind === 'open' && o.status === 'Prospect' },
  { k: 'lead', n: 'Lead', fill: 'var(--cyan-300)', f: o => o.kind === 'open' && o.status === 'Lead' },
  { k: 'L3', n: 'Opportunity', sub: 'L3 · Pipeline', fill: 'var(--cyan-400)', f: o => o.kind === 'open' && o.code === 'L3' },
  { k: 'L2', n: 'Opportunity', sub: 'L2 · Best case', fill: 'var(--cyan)', f: o => o.kind === 'open' && o.code === 'L2' },
  { k: 'L1', n: 'Opportunity', sub: 'L1 · Commit', fill: 'var(--deep)', dk: true, f: o => o.kind === 'open' && o.code === 'L1' },
  { k: 'won', n: 'Closed won', fill: 'var(--midnight)', dk: true, f: o => o.kind === 'won' }
];
const BAND_IX = { Prospect: 0, Lead: 1, L3: 2, L2: 3, L1: 4 };
function furthest(o) { if (o.kind === 'won') return 5; if (o.kind === 'lost') return BAND_IX[o.reached || 'L3']; return o.status === 'Opportunity' ? BAND_IX[o.code] : BAND_IX[o.status]; }
function funnelView(b) {
  if (!b.length) return emptyMsg();
  const reached = BANDS.map((_, i) => b.filter(o => furthest(o) >= i).length);
  const max = Math.max(1, reached[0]);
  if (!S.band || !BANDS.some(x => x.k === S.band)) S.band = (b.some(BANDS[2].f) ? BANDS[2] : BANDS.find(x => b.some(x.f)) || BANDS[2]).k;
  const H = 200 - 26; // plot height minus the number label
  const bands = `<div class="fnc-row">${BANDS.map((x, i) => {
    const now = b.filter(x.f), v = now.reduce((s2, o) => s2 + o.value, 0);
    const avg = now.length && x.k !== 'won' ? Math.round(now.reduce((s2, o) => s2 + (o.days || 0), 0) / now.length) : null;
    const prev = i ? reached[i - 1] : reached[0], hb = reached[i] / max * H, hd = (prev - reached[i]) / max * H;
    const conv = i && prev ? pct(reached[i], prev) : null;
    return `<button class="fnc ${S.band === x.k ? 'on' : ''}" data-act="band" data-v="${x.k}" aria-pressed="${S.band === x.k}"
        data-tip-html="<b>${x.n}${x.sub ? ' · ' + x.sub : ''}</b><div class='row'><span>Reached</span><span>${reached[i]}</span></div>${i ? `<div class='row'><span>Lost since ${BANDS[i - 1].sub ? BANDS[i - 1].sub.split(' · ')[0] : BANDS[i - 1].n}</span><span>${prev - reached[i]}</span></div>` : ''}<div class='row'><span>Here now</span><span>${now.length} · ${money(v)}</span></div>">
        <span class="fnc-plot"><span class="fnc-n">${reached[i]}</span>${hd > 0 ? `<span class="fnc-drop" style="height:${hd.toFixed(1)}px;background: ${x.fill}"></span>` : ''}<span class="fnc-bar" style="height:${Math.max(hb, 2).toFixed(1)}px;background: ${x.fill}"></span></span>
        <span class="fnc-conv">${conv == null ? 'reached' : `<b class="${conv < 70 ? 'lo' : ''}">${conv}%</b> moved on`}</span>
        <span class="fnc-k">${x.n}<small>${x.sub || '&nbsp;'}</small></span>
        <span class="fnc-s"><b>${now.length}</b> here now · ${money(v)}<br>${x.k === 'won' ? 'closed' : avg == null ? 'none here now' : `avg ${avg} days`}</span>
      </button>`;
  }).join('')}</div>`;
  const won = b.filter(o => o.kind === 'won'), lost = b.filter(o => o.kind === 'lost'), open = b.filter(o => o.kind === 'open');
  const ov = open.reduce((s, o) => s + o.value, 0), ow = open.reduce((s, o) => s + o.w, 0);
  const avgDays = open.length ? Math.round(open.reduce((s, o) => s + (o.days || 0), 0) / open.length) : null;
  const attn = open.filter(o => needs(o).length).length;
  const fk = (k, v, sub, cls = '') => `<div class="fk"><div class="fk-k">${k}</div><div class="fk-v ${cls}">${v}</div><div class="fk-s">${sub}</div></div>`;
  const band = BANDS.find(x => x.k === S.band), rows = b.filter(band.f).sort((a2, b2) => b2.value - a2.value);
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE)); S.page = Math.min(S.page, pages);
  const shown = rows.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  return `
    <div class="fn-wrap">
      <div>
          <h3 class="fn-h">Lifecycle funnel</h3>
          <p class="fn-p">How many initiatives reached each stage · solid = reached, faint = lost since the stage before · select a stage to list what's in it now</p>
      </div>
      <div class="fn-kpis">
        ${fk('Win rate', won.length + lost.length ? pct(won.length, won.length + lost.length) + '%' : '—', `${won.length} won · ${lost.length} lost`)}
        ${fk('Lost', lost.length, `${money(lost.reduce((s, o) => s + o.value, 0))} lost value`, lost.length ? 'neg' : '')}
        ${fk('Open pipeline', money(ov), `${open.length} open initiatives`)}
        ${fk('<span class="def" tabindex="0" data-tip="Σ value × probability.">Weighted</span>', money(ow), 'Value × probability')}
        ${fk('Avg days in stage', avgDays == null ? '—' : `${avgDays} days`, 'Open initiatives')}
        ${fk('<span class="def" tabindex="0" data-tip="No next step, follow-up overdue, close date passed, or more than 30 days in the stage.">Need attention</span>', attn, 'Open initiatives', attn ? 'warn' : '')}
      </div>
      <div>
        ${bands}
        <p class="fn-note"><span class="def" tabindex="0" data-tip="Counted from each initiative's stage history.">“Reached”</span> counts initiatives whose furthest recorded stage is at or past the band, so a skipped stage still counts as passed. Lost initiatives (${lost.length}) count up to where they got and are never “here now”.</p>
      </div>
    </div>
    <div class="fn-list">
      <div class="fn-list-h"><b>In ${band.n.charAt(0).toLowerCase() + band.n.slice(1)}${band.sub ? ' · ' + band.sub.split(' · ')[0] : ''} now</b><span>${rows.length} initiative${rows.length === 1 ? '' : 's'} · ${money(rows.reduce((s, o) => s + o.value, 0))} · select a row to open it</span></div>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl fnt">
        <colgroup><col class="c-n"><col class="c-s"><col class="c-o"><col class="c-v"><col class="c-d"></colgroup>
        <thead><tr><th>Initiative</th><th>Stage</th><th>Owner</th><th class="r">Value</th><th class="r">${band.k === 'won' ? 'Closed' : 'Days in stage'}</th></tr></thead>
        <tbody>${shown.map(o => `<tr class="click" data-act="open" data-id="${o.id}" tabindex="0">
          <td>${ell(o.name, 't-main')}${ell(o.acc, 't-sub')}</td><td>${ell(o.sub)}</td><td><div class="own">${CRM.avatar(o.owner)}<div class="own-t">${ell(o.owner)}</div></div></td>
          <td class="r num t-val">${money(o.value)}</td>
          <td class="r num">${band.k === 'won' ? fmtDate(o.close) : `<span class="${o.days > 90 ? 'hot' : ''}">${o.days} days</span>`}</td></tr>`).join('')}</tbody>
      </table></div>
      ${pages > 1 ? `<div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, rows.length)} of ${rows.length}</span><span class="sp"></span>
        <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
        ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}">${i + 1}</button>`).join('')}
        <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button></div>` : ''}`
      : `<div class="empty"><b>Nothing here now</b>No initiatives are in this stage under the current filters.</div>`}
    </div>`;
}

function emptyMsg() {
  const any = S.q || S.mine !== 'all' || S.team || S.close || S.owners.length || S.geo.length || S.attn || S.stage;
  return `<div class="empty"><b>No initiatives match</b>${S.mine === 'me' ? 'You have nothing in this status. ' : ''}${any ? '<button class="link" data-act="reset">Clear filters</button>' : ''}</div>`;
}

/* ---------- Controls ---------- */
const $ = (s) => document.querySelector(s);
function syncControls() {
  document.querySelectorAll('#f-mine button').forEach(b => { const on = b.dataset.v === S.mine; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  const teams = Object.keys(TEAMS).filter(t => !S.geo.length || S.geo.includes(TEAMS[t].geo));
  $('#f-team').innerHTML = `<option value="">All teams</option>` + teams.map(t => `<option ${S.team === t ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const closeOpts = [['', 'Any date'], ['2627', 'FY26-27'], ['2627-3', 'Q3 FY26-27 (now)'], ['2627-4', 'Q4 FY26-27'], ['2728', 'FY27-28'], ['none', 'Not set']];
  $('#f-close').innerHTML = closeOpts.map(([v, n]) => `<option value="${v}" ${S.close === v ? 'selected' : ''}>${n}</option>`).join('');
  $('#w-team').classList.toggle('set', !!S.team);
  $('#w-close').classList.toggle('set', !!S.close);
  const more = S.owners.length + S.geo.length;
  $('#more-n').hidden = !more; $('#more-n').textContent = more;
  $('#reset').hidden = !(S.q || S.mine !== 'all' || S.team || S.close || more || S.attn || S.stage || S.status !== 'open');
}
function buildMore() {
  const people = [...new Set(Object.values(TEAMS).flatMap(t => t.people))].sort();
  $('#m-owner').innerHTML = people.map(p => `<label class="check"><input type="checkbox" data-m="owners" value="${esc(p)}" ${S.owners.includes(p) ? 'checked' : ''}>${esc(p)}${p === ME ? ' (you)' : ''}</label>`).join('');
  $('#m-geo').innerHTML = Object.keys(GEO_TARGET).map(g => `<label class="check"><input type="checkbox" data-m="geo" value="${g}" ${S.geo.includes(g) ? 'checked' : ''}>${g}</label>`).join('');
}
function setMore(open) { $('#more-pop').hidden = !open; $('#more-btn').setAttribute('aria-expanded', open); if (open) buildMore(); }
function resetAll() { const v = S.view; Object.assign(S, { q: '', mine: 'all', team: '', close: '', owners: [], geo: [], status: 'open', attn: false, page: 1, stage: '' }); S.view = v; $('#f-search').value = ''; render(); }

let searchT;
$('#f-search').addEventListener('input', (e) => { clearTimeout(searchT); searchT = setTimeout(() => { S.q = e.target.value; S.page = 1; render(); }, 150); });
$('#f-mine').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.mine = b.dataset.v; S.page = 1; render(); });
$('#f-team').addEventListener('change', (e) => { S.team = e.target.value; S.page = 1; render(); });
$('#f-close').addEventListener('change', (e) => { S.close = e.target.value; S.page = 1; render(); });
$('#reset').addEventListener('click', resetAll);
$('#more-btn').addEventListener('click', (e) => { e.stopPropagation(); setMore($('#more-pop').hidden); });
$('#more-pop').addEventListener('click', (e) => e.stopPropagation());
$('#more-pop').addEventListener('change', (e) => {
  const i = e.target, arr = S[i.dataset.m], k = arr.indexOf(i.value);
  if (i.checked && k < 0) arr.push(i.value); if (!i.checked && k >= 0) arr.splice(k, 1);
  S.page = 1; render();
});
$('#more-clear').addEventListener('click', () => { S.owners = []; S.geo = []; buildMore(); render(); });
$('#more-done').addEventListener('click', () => setMore(false));
document.addEventListener('click', () => setMore(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMore(false); });

page.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'status') { S.status = a.dataset.v; S.page = 1; S.stage = ''; render(); }
  else if (act === 'attn') { S.attn = !S.attn; S.page = 1; render(); }
  else if (act === 'view') { S.view = a.dataset.v; S.page = 1; render(); }
  else if (act === 'band') { S.band = a.dataset.v; S.page = 1; render(); }
  else if (act === 'stage') { S.stage = a.dataset.v; S.view = 'list'; S.page = 1; render(); }
  else if (act === 'unstage') { S.stage = ''; S.page = 1; render(); }
  else if (act === 'sort') { S.sort = a.dataset.v; S.page = 1; render(); }
  else if (act === 'page') { S.page = +a.dataset.v; render(); }
  else if (act === 'open') location.href = `initiative.html?id=${encodeURIComponent(a.dataset.id)}`;
  else if (act === 'reset') resetAll();
});
page.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });
$('#new').addEventListener('click', () => { location.href = 'initiative-new.html'; });
$('#export').addEventListener('click', () => {
  const rows = listRows();
  const head = ['Initiative', 'Name', 'Account', 'Main status', 'Sub-stage', 'Owner', 'Team', 'Value (USD)', 'Probability %', 'Expected close', 'Next step', 'Follow-up'];
  const csv = [head, ...rows.map(o => [o.id, o.name, o.acc, o.kind === 'open' ? o.status : o.kind === 'won' ? 'Closed won' : 'Closed lost', o.sub, o.owner, o.team, Math.round(o.value), o.prob, o.close || '', o.next || '', o.follow || ''])]
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = 'sales-initiatives.csv'; a.click();
  toast(`Exported ${rows.length} initiatives`);
});

CRM.renderShell('initiatives');
CRM.watchSticky($('#filters'));
render();
</script>
</body>
</html>
