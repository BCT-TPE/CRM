<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="design-system/tokens.css?v=20261123a">
<link rel="stylesheet" href="assets/crm.css?v=20261127f">
<link rel="stylesheet" href="assets/dashboard.css?v=20261124b">
<link rel="stylesheet" href="assets/theme-v2.css?v=20261127b">
<link rel="stylesheet" href="assets/responsive.css?v=20261127c">
<style>
/* ---------- Page: Tasks (CRM V1 §7) ----------
   Mirrors CRMpulse /tasks (tasks-view, task-board): five view tiles, search / assignee / "show completed and
   cancelled", then one table (sortable, paged), open tasks first. Visual language = the other pages. */
/* Scope tiles: the same tinted card of tiles as Accounts and Sales initiatives (selected tile = white) */
.sc-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 8px; }
/* label / count / note on shared rows (subgrid), so tiles side by side line up */
.sc-tiles { grid-auto-rows: auto; }
.tt { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 4px; align-content: start; min-width: 0; padding: 16px; border: 0; border-radius: var(--radius-lg); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.tt:hover { background: var(--hover); }
.tt.on { background: var(--surface); box-shadow: var(--shadow-soft); }
.tt-k { font-size: var(--text-xs); color: var(--t3); white-space: nowrap; }
.tt-n { font-size: var(--text-3xl); font-weight: 400; letter-spacing: -.03em; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
.tt-n.hot { color: var(--danger); }
.tt-s { font-size: var(--text-xs); color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk-note { margin: 0; font-size: var(--text-sm); color: var(--t3); }
/* List: the same table as the other list pages (fixed layout, 64px rows, sortable headers, pager) */
.tbl.tk { table-layout: fixed; }
.tbl.tk col.c-t { width: 40%; } .tbl.tk col.c-a { width: 24%; } .tbl.tk col.c-s { width: 12%; } .tbl.tk col.c-d { width: 24%; }
.tbl.tk tbody tr { cursor: pointer; } /* the whole row opens the task (no separate edit button) */
.tbl.tk td { height: 64px; padding-top: 10px; padding-bottom: 10px; }
.tk-t { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; align-items: center; }
.tk-t input { width: 16px; height: 16px; margin: 0; accent-color: var(--deep); cursor: pointer; }
.tk-t input:disabled { cursor: not-allowed; }
.tk-t .open { max-width: 100%; padding: 0; border: 0; background: none; font: inherit; font-weight: 500; color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-t .open { cursor: inherit; }
.tbl.tk .link:hover { text-decoration: none; } /* links inside a task row: no underline either */
tr.is-done .open, tr.is-cxl .open { color: var(--t3); text-decoration: line-through; font-weight: 400; }
.tk-t .t-sub .link { font-size: var(--text-xs); }
.late { color: var(--danger); } .today { color: var(--warn-text); }
.dlg .ed { display: grid; gap: 12px; margin-top: 12px; }
.dlg .ed label { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-xs); font-weight: 500; color: var(--t2); }
.dlg .ed .in { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-control); background: var(--surface); font: inherit; font-size: var(--text-sm); color: var(--ink); }
.dlg .ed .fsel { display: flex; width: 100%; }
/* Task form in the side panel (.drill, as on Pipeline / Performance) */
.tf textarea.in { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.tf .in:focus { border-color: var(--deep); } .tf .in:disabled { background: var(--field); color: var(--t2); }
.tf.bad .in, .tf.bad .dt-btn { border-color: var(--danger); }
@media (max-width: 1180px) { .sc-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 768px) {
  .sc-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tbl.tk { min-width: 720px; }
  .tbl.tk col.c-t { width: 30%; } /* pinned column stays ~216px, as on the other tables */
}
</style>
</head>
<body class="v2">
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="v2-head">
      <div class="v2-hello">
        <h1>Tasks</h1>
        <p>Follow-ups for anyone: Sales, Presales, Delivery, Finance, Legal.</p>
      </div>
      <div class="acts" style="display:flex;gap:8px">
        <button class="btn primary" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New task</button>
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Search title or number" aria-label="Search tasks"></label>
      <label class="select"><span class="lbl">Assignee</span><select id="f-to" aria-label="Assignee"></select></label>
      <button class="ftog" id="f-closed" aria-pressed="false"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Show completed and cancelled</button>
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
    </div>

    <div id="top"></div>
    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261127a"></script>
<script src="assets/crm-data.js?v=20261126d"></script>
<script src="assets/task-form.js?v=20261127a"></script>
<script>
const { toast } = CRM;
const $ = (s) => document.querySelector(s);
const DAY = 864e5;
const iso = (d) => new Date(d).toISOString().slice(0, 10);
const TODAY_ISO = iso(TODAY);
const SUNDAY = new Date(TODAY.getTime() + ((7 - TODAY.getDay()) % 7) * DAY);
const PEOPLE = [...new Set([ME, ...Object.values(TEAMS).flatMap(t => t.people), ...Object.keys(FUNC)])].sort((a, b) => a === ME ? -1 : b === ME ? 1 : a.localeCompare(b));
const nameOf = (p) => p === ME ? `${p} (you)` : p;
const STATUS_LABEL = CRM.TASK_STATUS; // assets/task-form.js
const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const daysUntil = (d) => Math.round((new Date(d) - TODAY) / DAY);

const VIEWS = [
  ['mine', 'My open tasks', (t) => t.to === ME],
  ['given', 'Assigned by me', (t) => t.by === ME && t.to !== ME],
  ['team_overdue', 'Team overdue', (t) => taskLate(t)],
  ['week', 'Due this week', (t) => t.due && new Date(t.due) >= TODAY && new Date(t.due) <= SUNDAY],
  ['all', 'All open', () => true]
];
const EMPTY = { mine: 'Nothing open is assigned to you.', given: "You haven't given anyone an open task.", team_overdue: 'Nothing is overdue.', week: 'Nothing is due between today and Sunday.', all: 'No open tasks match.' };
// Default view: everyone, Administrator included, opens on My open tasks; with none open, on the ones they finished.
// (Old CRMpulse opened managers on Team overdue; the design team chose My open tasks for every role, 2026-11-23.)
const myOpen = TASKS.filter(t => taskOpen(t) && t.to === ME).length;
const S0 = { view: 'mine', closed: !myOpen, note: myOpen ? '' : "You have no open tasks; showing the ones you've finished." };
const S = { ...S0, q: '', to: '', sort: 'due', page: 1 };

function tiles() {
  const open = TASKS.filter(taskOpen), mine = open.filter(t => t.to === ME), late = open.filter(taskLate);
  const done30 = TASKS.filter(t => t.status === 'done' && t.done && (TODAY - new Date(t.done)) / DAY <= 30).length;
  const sub = { mine: mine.length ? (mine.filter(taskLate).length ? `${mine.filter(taskLate).length} overdue` : 'None overdue') : 'None assigned', given: 'Given to others',
    team_overdue: late.length ? `Oldest ${Math.max(...late.map(t => -daysUntil(t.due)))} days` : 'Nothing overdue', week: 'Today to Sunday', all: `${done30} done in 30 days` }; // short enough for one line on a phone tile
  return `<section class="card tint sc-tiles" role="tablist" aria-label="Task views">${VIEWS.map(([k, l, fn]) => { const n = open.filter(fn).length, alert = k === 'team_overdue' && n > 0;
    return `<button role="tab" aria-selected="${S.view === k}" class="tt ${S.view === k ? 'on' : ''}" data-act="view" data-v="${k}"><span class="tt-k">${l}</span><span class="tt-n ${alert ? 'hot' : ''}">${n}</span><span class="tt-s">${sub[k]}</span></button>`; }).join('')}</section>
    ${S.note ? `<p class="tk-note">${S.note}</p>` : ''}`;
}
function scoped() {
  const fn = VIEWS.find(v => v[0] === S.view)[2], q = S.q.trim().toLowerCase();
  return TASKS.filter(t => fn(t) && (!S.to || t.to === S.to) && (!q || t.title.toLowerCase().includes(q) || t.id.toLowerCase().includes(q) || (t.act || '').toLowerCase() === q));
}
const SORTS = {
  title: { fn: (a, b) => a.title.localeCompare(b.title), dir: 'asc' },
  to: { fn: (a, b) => a.to.localeCompare(b.to), dir: 'asc' },
  status: { fn: (a, b) => ['ns', 'ip', 'done', 'cxl'].indexOf(a.status) - ['ns', 'ip', 'done', 'cxl'].indexOf(b.status), dir: 'asc' },
  due: { fn: (a, b) => (a.due || '9999').localeCompare(b.due || '9999'), dir: 'asc' } // overdue first
};
const PER_PAGE = 10;
function th(key, label, cls = '') {
  if (!key) return `<th class="${cls}">${label}</th>`;
  const on = S.sort === key;
  return `<th class="${cls}" aria-sort="${on ? 'ascending' : 'none'}"><button class="th-sort ${on ? 'on' : ''}" data-act="sort" data-v="${key}">${label}<span class="arr" aria-hidden="true">↑</span></button></th>`;
}
const ell = (html, cls = '') => `<div class="ell ${cls}">${html}</div>`;
function row(t) {
  const closed = !taskOpen(t), late = taskLate(t), n = t.due ? daysUntil(t.due) : null;
  const rel = closed ? (t.status === 'done' && t.done ? `Done ${CRM.date(t.done)}` : 'Cancelled') : late ? `${pl(-n, 'day')} overdue` : n === 0 ? 'Today' : n != null ? `In ${pl(n, 'day')}` : '';
  const block = t.status === 'done' ? 'Completed tasks are final.' : t.status === 'cxl' ? 'Cancelled tasks are final.' : '';
  const rel2 = [t.si ? `<a class="link" href="initiative.html?id=${encodeURIComponent(t.si)}#tasks">${esc(t.siName)}</a>` : t.acc ? `<a class="link" href="${(ACCOUNTS.find(x => x.name === t.acc) || {}).id ? `account.html?id=${ACCOUNTS.find(x => x.name === t.acc).id}` : `accounts.html?q=${encodeURIComponent(t.acc)}`}">${esc(t.acc)}</a>` : '', t.act ? `<a class="link" href="activities.html?q=${t.act}">from ${t.act}</a>` : ''].filter(Boolean).join(' · ');
  return `<tr class="click is-${t.status}" data-act="edit" data-v="${t.id}" data-id="${t.id}" tabindex="0">
    <td><div class="tk-t"><label class="ck40" data-act="ck"><input type="checkbox" data-act="done" data-v="${t.id}" ${t.status === 'done' ? 'checked' : ''} ${block ? 'disabled' : ''} aria-label="Mark ${esc(t.title)} complete${block ? ` (${block})` : ''}"></label>
      <div style="min-width:0"><div class="open">${esc(t.title)}</div>${ell(`${t.id}${rel2 ? ' · ' + rel2 : ''}`, 't-sub')}</div></div></td>
    <td><div class="own">${CRM.avatar(t.to)}<div class="own-t">${ell(esc(t.to))}${ell(`${funcOf(t.to)} · by ${t.by === ME ? 'you' : esc(t.by)}`, 't-sub')}</div></div></td>
    <td><span class="sb ${t.status}">${STATUS_LABEL[t.status]}</span></td>
    <td class="num"><div class="${late ? 'late' : !closed && n === 0 ? 'today' : ''}">${t.due ? CRM.date(t.due) : '<span class="muted">Not set</span>'}</div>${rel ? `<div class="t-sub ${late ? 'late' : ''}">${rel}</div>` : ''}</td>
  </tr>`;
}
function board() {
  const all = scoped(), open = all.filter(taskOpen), closed = all.filter(t => !taskOpen(t));
  let list = S.closed ? all : open;
  if (!list.length) return `<section class="card"><div class="empty" style="padding:40px 12px">${EMPTY[S.view]}${closed.length && !S.closed ? ` <button class="link" data-act="showclosed">Show ${pl(closed.length, 'completed or cancelled task')}</button>` : ''}</div></section>`;
  // open tasks first (by the chosen column), then completed and cancelled ones
  list = list.slice().sort((a, b) => (taskOpen(b) - taskOpen(a)) || SORTS[S.sort].fn(a, b));
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE)); S.page = Math.min(S.page, pages);
  const shown = list.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  return `<section class="card" aria-label="Tasks"><div class="tbl-wrap"><table class="tbl tk">
      <colgroup><col class="c-t"><col class="c-a"><col class="c-s"><col class="c-d"></colgroup>
      <thead><tr>${th('title', 'Task')}${th('to', 'Assigned to')}${th('status', 'Status')}${th('due', 'Due')}</tr></thead>
      <tbody>${shown.map(row).join('')}</tbody></table></div>
    <div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, list.length)} of ${list.length}</span><span class="sp"></span>
      <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
      ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
      <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button></div>
  </section>`;
}
function renderTop() {
  $('#top').innerHTML = `<div style="display:flex;flex-direction:column;gap:16px;margin-bottom:16px">${tiles()}</div>`;
  CRM.enhanceSelects($('#top')); CRM.enhanceDates($('#top'));
}
function render() {
  CRM.refreshTaskBadge();
  renderTop();
  $('#page').innerHTML = board();
  $('#f-closed').setAttribute('aria-pressed', String(S.closed));
  $('#reset').hidden = !(S.q || S.to);
}

// Task form (stands in for CRMpulse's task drawer) — the one way to add a task on this page (the quick-add row was dropped:
// it couldn't link an account or initiative). New task opens it with due tomorrow and you as assignee; a task's title or edit button opens it filled.
// Cancelling asks why (required); completing takes an optional outcome. Completed and cancelled tasks are read-only.
// Task form: the shared side panel (assets/task-form.js)
const openForm = (x) => CRM.taskForm(x, { onSaved: render });

// ---- Events ----
document.addEventListener('click', (e) => {
  if (e.target.closest('#page tr.click a, #page tr.click input')) return; // links and the checkbox inside a row do their own thing
  const a = e.target.closest('[data-act]'); if (!a || !a.closest('#top, #page')) return;
  const act = a.dataset.act;
  if (act === 'view') { S.view = a.dataset.v; S.note = ''; S.page = 1; render(); }
  else if (act === 'sort') { S.sort = a.dataset.v; S.page = 1; render(); }
  else if (act === 'page') { S.page = +a.dataset.v; render(); }
  else if (act === 'showclosed') { S.closed = true; render(); }
  else if (act === 'edit') openForm(TASKS.find(t => t.id === a.dataset.v));
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('#page tr.click')) e.target.click(); });
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (e.target.dataset.act === 'done' && e.target.closest('#page')) {
    const t = TASKS.find(x => x.id === e.target.dataset.v);
    if (e.target.checked) { const was = { status: t.status, done: t.done }; t.status = 'done'; t.done = TODAY_ISO; render(); CRM.refreshTaskBadge();
      toast(`${t.id} completed.`, 'ok', { label: 'Undo', fn: () => { Object.assign(t, was); render(); CRM.refreshTaskBadge(); toast(`${t.id} is open again.`); } }); }
  }
});
function fill(sel, opts) { sel.innerHTML = opts.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join(''); }
fill($('#f-to'), [['', 'All'], ...PEOPLE.map(p => [p, nameOf(p)])]);
// links from Activities ("1 follow-up task") land here with ?q=ACT-…: search it across every view (design review D9)
{ const q = new URLSearchParams(location.search).get('q'); if (q) { S.q = q; S.view = 'all'; S.closed = true; $('#f-search').value = q; } }
$('#f-search').addEventListener('input', (e) => { S.q = e.target.value; S.page = 1; render(); });
$('#f-to').addEventListener('change', (e) => { S.to = e.target.value; S.page = 1; render(); });
$('#f-closed').addEventListener('click', () => { S.closed = !S.closed; S.page = 1; render(); });
$('#reset').addEventListener('click', () => { S.q = ''; S.to = ''; $('#f-search').value = ''; $('#f-to').value = ''; render(); });
$('#new').addEventListener('click', () => openForm(null));
// Home's "New task" lands here with ?new=1: open the empty form once the page is drawn
if (new URLSearchParams(location.search).get('new')) requestAnimationFrame(() => openForm(null));

CRM.renderShell('tasks');
CRM.watchSticky($('#filters'));
render();
CRM.riseIn();
</script>
</body>
</html>
