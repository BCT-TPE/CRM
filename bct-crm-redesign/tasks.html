<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="design-system/tokens.css?v=20261120c">
<link rel="stylesheet" href="assets/crm.css?v=20261120a">
<link rel="stylesheet" href="assets/dashboard.css?v=20261120a">

<style>
/* ---------- Page: Tasks (CRM V1 §7) ----------
   Mirrors CRMpulse /tasks (tasks-view, task-board): five view tiles, search / assignee / "show completed and
   cancelled", then one table (sortable, paged), open tasks first. Visual language = the other pages. */
/* Scope tiles: the same tinted card of tiles as Accounts and Sales initiatives (selected tile = white) */
.sc-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 8px; }
/* label / count / note on shared rows (subgrid), so tiles side by side line up */
.sc-tiles { grid-auto-rows: auto; }
.tt { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 4px; align-content: start; min-width: 0; padding: 16px; border: 0; border-radius: var(--radius-lg); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.tt:hover { background: var(--hover); }
.tt.on { background: var(--surface); box-shadow: var(--shadow-soft); }
.tt-k { font-size: var(--text-xs); color: var(--t3); white-space: nowrap; }
.tt-n { font-size: var(--text-3xl); font-weight: 400; letter-spacing: -.03em; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
.tt-n.hot { color: var(--danger); }
.tt-s { font-size: var(--text-xs); color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk-note { margin: 0; font-size: var(--text-sm); color: var(--t3); }
/* Filter toggle: a pill like the filter selects; set = deep border, as a set select */
.ftog { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-control); background: var(--surface); font: inherit; font-size: var(--text-sm); color: var(--t1); cursor: pointer; white-space: nowrap; }
body.v2 .ftog { border-radius: var(--radius-pill); border-color: var(--surface); background: var(--glass); box-shadow: var(--shadow-card); }
body.v2 .ftog:hover { background: var(--surface); }
.ftog i { display: grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid var(--line-3); border-radius: var(--radius-2xs); color: var(--on-dark); }
.ftog i svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
body.v2 .ftog[aria-pressed="true"] { border-color: var(--deep); background: var(--surface); }
.ftog[aria-pressed="true"] i { border-color: var(--midnight); background: var(--midnight); }
.ftog[aria-pressed="true"] i svg { opacity: 1; }
/* List: the same table as the other list pages (fixed layout, 64px rows, sortable headers, pager) */
.tbl.tk { table-layout: fixed; }
.tbl.tk col.c-t { width: 40%; } .tbl.tk col.c-a { width: 24%; } .tbl.tk col.c-s { width: 12%; } .tbl.tk col.c-d { width: 16%; } .tbl.tk col.c-e { width: 8%; }
.tbl.tk tbody tr { cursor: default; }
.tbl.tk td { height: 64px; padding-top: 10px; padding-bottom: 10px; }
.tk-t { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; align-items: center; }
.tk-t input { width: 16px; height: 16px; margin: 0; accent-color: var(--deep); cursor: pointer; }
.tk-t input:disabled { cursor: not-allowed; }
.tk-t .open { max-width: 100%; padding: 0; border: 0; background: none; font: inherit; font-weight: 500; color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-t .open:hover { color: var(--deep); } /* the row already highlights on hover: no underline */
.tbl.tk .link:hover { text-decoration: none; } /* links inside a task row: no underline either */
tr.is-done .open, tr.is-cxl .open { color: var(--t3); text-decoration: line-through; font-weight: 400; }
.tk-t .t-sub .link { font-size: var(--text-xs); }
.late { color: var(--danger); } .today { color: var(--warn-text); }
td.ed-c .btn.icon-only { width: 32px; height: 32px; padding: 0; justify-content: center; }
td.ed-c .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sb { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--radius-sm); font-size: var(--text-2xs); font-weight: 600; white-space: nowrap; }
.sb.ns { background: var(--hover); color: var(--t2); } .sb.ip { background: var(--info-bg); color: var(--deep); }
.sb.done { background: var(--ok-bg); color: var(--ok-text); } .sb.cxl { background: var(--field); color: var(--t3); }
.dlg .ed { display: grid; gap: 12px; margin-top: 12px; }
.dlg .ed label { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-xs); font-weight: 500; color: var(--t2); }
.dlg .ed .in { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-control); background: var(--surface); font: inherit; font-size: var(--text-sm); color: var(--ink); }
.dlg .ed .fsel { display: flex; width: 100%; }
/* Task form in the side panel (.drill, as on Pipeline / Performance) */
.tf-panel .tf-form { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.tf-panel .dr-body { padding: 20px 24px 24px; }
.tf-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 0; font-size: var(--text-xs); color: var(--t3); }
.sb.late { background: var(--danger-bg); color: var(--danger); }
.tf-ctx { margin: 0; font-size: var(--text-sm); color: var(--t3); } .tf-ctx b { font-weight: 500; color: var(--t1); }
.tf-g { display: grid; gap: 16px; }
.tf-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.tf { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tf-l { font-size: var(--text-sm); font-weight: 500; color: var(--ink); } .tf-l .rq { margin-left: 2px; color: var(--danger); }
.tf-h { font-size: var(--text-xs); color: var(--t3); } .tf-e { font-size: var(--text-xs); color: var(--danger); }
.tf .in { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-control); background: var(--surface); font: inherit; font-size: var(--text-sm); color: var(--ink); outline: none; }
.tf textarea.in { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.tf .in:focus { border-color: var(--deep); } .tf .in:disabled { background: var(--field); color: var(--t2); }
.tf.bad .in, .tf.bad .dt-btn { border-color: var(--danger); }
body.v2 .tf label.select.fsel { display: flex; width: 100%; height: 40px; border-radius: var(--radius-control); border-color: var(--line-2); background: var(--surface); box-shadow: none; }
.tf .fsel .sel-btn { max-width: none; width: 100%; padding-left: 12px; font-weight: 400; color: var(--ink); }
body.v2 .tf-seg { display: flex; width: 100%; background: var(--track); box-shadow: none; }
.tf-seg button { flex: 1 1 0; }
.tf-ro { margin: 0; font-size: var(--text-sm); color: var(--t1); }
@media (max-width: 480px) { .tf-2 { grid-template-columns: 1fr; } .tf-seg { flex-wrap: wrap; } }
@media (max-width: 1180px) { .sc-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 768px) {
  .sc-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tbl.tk { min-width: 720px; }
  .tbl.tk col.c-t { width: 30%; } /* pinned column stays ~216px, as on the other tables */
}
</style>
</head>
<body class="v2">
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="v2-head">
      <div class="v2-hello">
        <div class="v2-top"><span class="v2-eyebrow">Tasks</span></div>
        <h1>Tasks</h1>
        <p>Follow-ups for anyone: Sales, Presales, Delivery, Finance, Legal.</p>
      </div>
      <div class="acts" style="display:flex;gap:8px">
        <button class="btn primary" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New task</button>
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Search title or number" aria-label="Search tasks"></label>
      <label class="select"><span class="lbl">Assignee</span><select id="f-to" aria-label="Assignee"></select></label>
      <button class="ftog" id="f-closed" aria-pressed="false"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Show completed and cancelled</button>
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
    </div>

    <div id="top"></div>
    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261120h"></script>
<script src="assets/crm-data.js?v=20261120b"></script>
<script>
const { toast } = CRM;
const $ = (s) => document.querySelector(s);
const DAY = 864e5;
const iso = (d) => new Date(d).toISOString().slice(0, 10);
const TODAY_ISO = iso(TODAY);
const SUNDAY = new Date(TODAY.getTime() + ((7 - TODAY.getDay()) % 7) * DAY);
const PEOPLE = [...new Set([ME, ...Object.values(TEAMS).flatMap(t => t.people), ...Object.keys(FUNC)])].sort((a, b) => a === ME ? -1 : b === ME ? 1 : a.localeCompare(b));
const nameOf = (p) => p === ME ? `${p} (you)` : p;
const EDIT = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>';
const STATUS_LABEL = { ns: 'Not started', ip: 'In progress', done: 'Completed', cxl: 'Cancelled' };
const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const daysUntil = (d) => Math.round((new Date(d) - TODAY) / DAY);

const VIEWS = [
  ['mine', 'My open tasks', (t) => t.to === ME],
  ['given', 'Assigned by me', (t) => t.by === ME && t.to !== ME],
  ['team_overdue', 'Team overdue', (t) => taskLate(t)],
  ['week', 'Due this week', (t) => t.due && new Date(t.due) >= TODAY && new Date(t.due) <= SUNDAY],
  ['all', 'All open', () => true]
];
const EMPTY = { mine: 'Nothing open is assigned to you.', given: "You haven't given anyone an open task.", team_overdue: 'Nothing is overdue.', week: 'Nothing is due between today and Sunday.', all: 'No open tasks match.' };
// Default view (CRMpulse decision 2026-11-04): a salesperson opens on My open tasks; with none open, on the ones they finished
const myOpen = TASKS.filter(t => taskOpen(t) && t.to === ME).length;
const S = { view: 'mine', closed: !myOpen, note: myOpen ? '' : "You have no open tasks; showing the ones you've finished.", q: '', to: '', sort: 'due', page: 1 };

function tiles() {
  const open = TASKS.filter(taskOpen), mine = open.filter(t => t.to === ME), late = open.filter(taskLate);
  const done30 = TASKS.filter(t => t.status === 'done' && t.done && (TODAY - new Date(t.done)) / DAY <= 30).length;
  const sub = { mine: mine.length ? (mine.filter(taskLate).length ? `${mine.filter(taskLate).length} overdue` : 'None overdue') : 'None assigned', given: 'Given to others',
    team_overdue: late.length ? `Oldest ${Math.max(...late.map(t => -daysUntil(t.due)))} days` : 'Nothing overdue', week: 'Today to Sunday', all: `${done30} done in 30 days` }; // short enough for one line on a phone tile
  return `<section class="card tint sc-tiles" role="tablist" aria-label="Task views">${VIEWS.map(([k, l, fn]) => { const n = open.filter(fn).length, alert = k === 'team_overdue' && n > 0;
    return `<button role="tab" aria-selected="${S.view === k}" class="tt ${S.view === k ? 'on' : ''}" data-act="view" data-v="${k}"><span class="tt-k">${l}</span><span class="tt-n ${alert ? 'hot' : ''}">${n}</span><span class="tt-s">${sub[k]}</span></button>`; }).join('')}</section>
    ${S.note ? `<p class="tk-note">${S.note}</p>` : ''}`;
}
function scoped() {
  const fn = VIEWS.find(v => v[0] === S.view)[2], q = S.q.trim().toLowerCase();
  return TASKS.filter(t => fn(t) && (!S.to || t.to === S.to) && (!q || t.title.toLowerCase().includes(q) || t.id.toLowerCase().includes(q)));
}
const SORTS = {
  title: { fn: (a, b) => a.title.localeCompare(b.title), dir: 'asc' },
  to: { fn: (a, b) => a.to.localeCompare(b.to), dir: 'asc' },
  status: { fn: (a, b) => ['ns', 'ip', 'done', 'cxl'].indexOf(a.status) - ['ns', 'ip', 'done', 'cxl'].indexOf(b.status), dir: 'asc' },
  due: { fn: (a, b) => (a.due || '9999').localeCompare(b.due || '9999'), dir: 'asc' } // overdue first
};
const PER_PAGE = 10;
function th(key, label, cls = '') {
  if (!key) return `<th class="${cls}">${label}</th>`;
  const on = S.sort === key;
  return `<th class="${cls}" aria-sort="${on ? 'ascending' : 'none'}"><button class="th-sort ${on ? 'on' : ''}" data-act="sort" data-v="${key}">${label}<span class="arr" aria-hidden="true">↑</span></button></th>`;
}
const ell = (html, cls = '') => `<div class="ell ${cls}">${html}</div>`;
function row(t) {
  const closed = !taskOpen(t), late = taskLate(t), n = t.due ? daysUntil(t.due) : null;
  const rel = closed ? (t.status === 'done' && t.done ? `Done ${CRM.date(t.done)}` : 'Cancelled') : late ? `${pl(-n, 'day')} overdue` : n === 0 ? 'Today' : n != null ? `In ${pl(n, 'day')}` : '';
  const block = t.status === 'done' ? 'Completed tasks are final.' : t.status === 'cxl' ? 'Cancelled tasks are final.' : '';
  const rel2 = [t.si ? `<a class="link" href="initiative.html?id=${encodeURIComponent(t.si)}#tasks">${esc(t.siName)}</a>` : t.acc ? `<a class="link" href="accounts.html">${esc(t.acc)}</a>` : '', t.act ? `<a class="link" href="activities.html">from ${t.act}</a>` : ''].filter(Boolean).join(' · ');
  return `<tr class="is-${t.status}" data-id="${t.id}">
    <td><div class="tk-t"><input type="checkbox" data-act="done" data-v="${t.id}" ${t.status === 'done' ? 'checked' : ''} ${block ? 'disabled' : ''} aria-label="Mark ${esc(t.title)} complete${block ? ` (${block})` : ''}">
      <div style="min-width:0"><button class="open" data-act="edit" data-v="${t.id}">${esc(t.title)}</button>${ell(`${t.id}${rel2 ? ' · ' + rel2 : ''}`, 't-sub')}</div></div></td>
    <td><div class="own">${CRM.avatar(t.to)}<div class="own-t">${ell(esc(t.to))}${ell(`${funcOf(t.to)} · by ${t.by === ME ? 'you' : esc(t.by)}`, 't-sub')}</div></div></td>
    <td><span class="sb ${t.status}">${STATUS_LABEL[t.status]}</span></td>
    <td class="num"><div class="${late ? 'late' : !closed && n === 0 ? 'today' : ''}">${t.due ? CRM.date(t.due) : '<span class="muted">Not set</span>'}</div>${rel ? `<div class="t-sub ${late ? 'late' : ''}">${rel}</div>` : ''}</td>
    <td class="r ed-c"><button class="btn icon-only" data-act="edit" data-v="${t.id}" aria-label="Edit ${esc(t.title)}" data-tip="Edit">${EDIT}</button></td>
  </tr>`;
}
function board() {
  const all = scoped(), open = all.filter(taskOpen), closed = all.filter(t => !taskOpen(t));
  let list = S.closed ? all : open;
  if (!list.length) return `<section class="card"><div class="empty" style="padding:40px 12px">${EMPTY[S.view]}${closed.length && !S.closed ? ` <button class="link" data-act="showclosed">Show ${pl(closed.length, 'completed or cancelled task')}</button>` : ''}</div></section>`;
  // open tasks first (by the chosen column), then completed and cancelled ones
  list = list.slice().sort((a, b) => (taskOpen(b) - taskOpen(a)) || SORTS[S.sort].fn(a, b));
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE)); S.page = Math.min(S.page, pages);
  const shown = list.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  return `<section class="card" aria-label="Tasks"><div class="tbl-wrap"><table class="tbl tk">
      <colgroup><col class="c-t"><col class="c-a"><col class="c-s"><col class="c-d"><col class="c-e"></colgroup>
      <thead><tr>${th('title', 'Task')}${th('to', 'Assigned to')}${th('status', 'Status')}${th('due', 'Due')}<th class="r" aria-label="Edit"></th></tr></thead>
      <tbody>${shown.map(row).join('')}</tbody></table></div>
    <div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, list.length)} of ${list.length}</span><span class="sp"></span>
      <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
      ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
      <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button></div>
  </section>`;
}
function renderTop() {
  $('#top').innerHTML = `<div style="display:flex;flex-direction:column;gap:16px;margin-bottom:16px">${tiles()}</div>`;
  CRM.enhanceSelects($('#top')); CRM.enhanceDates($('#top'));
}
function render() {
  renderTop();
  $('#page').innerHTML = board();
  $('#f-closed').setAttribute('aria-pressed', String(S.closed));
  $('#reset').hidden = !(S.q || S.to);
}

// Task form (stands in for CRMpulse's task drawer) — the one way to add a task on this page (the quick-add row was dropped:
// it couldn't link an account or initiative). New task opens it with due tomorrow and you as assignee; a task's title or edit button opens it filled.
// Cancelling asks why (required); completing takes an optional outcome. Completed and cancelled tasks are read-only.
const fld = (label, ctl, { req, hint, err, id } = {}) => `<div class="tf ${err ? 'bad' : ''}" ${id ? `data-f="${id}"` : ''}><span class="tf-l">${label}${req ? '<span class="rq">*</span>' : ''}</span>${ctl}${err ? `<span class="tf-e">${err}</span>` : hint ? `<span class="tf-h">${hint}</span>` : ''}</div>`;
function openForm(t) {
  const isNew = !t, final = !!t && !taskOpen(t);
  const v = isNew ? { acc: '', si: '', title: '', to: ME, due: iso(TODAY.getTime() + DAY), status: 'ns', note: '', desc: '' }
    : { acc: t.acc, si: t.si || '', title: t.title, to: t.to, due: t.due || '', status: t.status, note: t.note || '', desc: t.desc || '' };
  let errs = {};
  // Side panel: the same .drill panel as the Pipeline / Performance drill-downs (slides in from the right)
  const scrim = document.createElement('aside'); scrim.className = 'drill tf-panel'; scrim.setAttribute('role', 'dialog'); scrim.setAttribute('aria-labelledby', 'tf-t');
  const prev = document.activeElement;
  const close = () => { document.removeEventListener('keydown', key, true); document.body.classList.remove('drill-open'); setTimeout(() => scrim.remove(), 300); prev && prev.focus && prev.focus(); };
  const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
  const changing = !isNew && v.status !== t.status && (v.status === 'done' || v.status === 'cxl');
  const draw = () => {
    const sis = INITS.filter(o => o.kind === 'open' && (!v.acc || o.acc === v.acc));
    const closing = !isNew && v.status !== t.status && (v.status === 'done' || v.status === 'cxl');
    const ctx = !isNew && (t.siName || t.acc) ? `<p class="tf-ctx"><b>${esc(t.siName || t.acc)}</b>${t.act ? ` · from ${t.act}` : ''}</p>` : '';
    scrim.innerHTML = `<form class="tf-form" novalidate>
      <header class="dr-head"><div><p class="dr-kind">${isNew ? 'Tasks' : t.id}</p><h2 id="tf-t">${isNew ? 'New task' : esc(t.title)}</h2>
      ${isNew ? '<p class="dr-sub">Follow-ups for anyone: Sales, Presales, Delivery, Finance, Legal.</p>' : `<p class="tf-sub"><span class="sb ${t.status}">${STATUS_LABEL[t.status]}</span>${taskLate(t) ? '<span class="sb late">Overdue</span>' : ''} ${t.id} · assigned by ${t.by === ME ? 'you' : esc(t.by)}</p>`}
      </div><button type="button" class="icon-btn" data-x="close" aria-label="Close panel">${CRM.icon('x')}</button></header>
      <div class="dr-body"><div class="tf-g">
        ${isNew ? fld('Account', `<label class="select fsel"><select data-v="acc"><option value="">No account</option>${ACCOUNTS.map(a => `<option ${a.name === v.acc ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label>`, { hint: 'Optional.' })
          + fld('Sales initiative', `<label class="select fsel"><select data-v="si"><option value="">No initiative</option>${sis.map(o => `<option value="${o.id}" ${o.id === v.si ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select></label>`, { hint: 'Optional; sets the account.' }) : ctx}
        ${fld('What needs doing?', `<input class="in" data-v="title" value="${esc(v.title)}" ${final ? 'disabled' : ''} aria-label="What needs doing?">`, { req: !final, err: errs.title, id: 'title' })}
        <div class="tf-2">
          ${fld('Who should do it?', `<label class="select fsel"><select data-v="to" ${final ? 'disabled' : ''}>${PEOPLE.map(x => `<option value="${esc(x)}" ${x === v.to ? 'selected' : ''}>${esc(nameOf(x))} · ${funcOf(x)}</option>`).join('')}</select></label>`, { req: !final, hint: !isNew && !final ? 'Reassigning keeps the previous owner in the history.' : '' })}
          ${fld('When is it due?', `<input class="in" type="date" data-v="due" value="${v.due}" ${final ? 'disabled' : ''} aria-label="When is it due?">`, { req: !final, err: errs.due, id: 'due' })}
        </div>
        ${isNew ? '' : fld('Status', `<div class="seg tf-seg" role="radiogroup" aria-label="Status">${Object.entries(STATUS_LABEL).map(([k, l]) => `<button type="button" role="radio" aria-checked="${v.status === k}" class="${v.status === k ? 'on' : ''}" data-st="${k}" ${final ? 'disabled' : ''}>${l}</button>`).join('')}</div>`)}
        ${closing ? fld(v.status === 'cxl' ? 'Why is it cancelled?' : 'Outcome', `<textarea class="in" data-v="note" aria-label="${v.status === 'cxl' ? 'Why is it cancelled?' : 'Outcome'}">${esc(v.note)}</textarea>`, { req: v.status === 'cxl', hint: v.status === 'done' ? 'Optional.' : '', err: errs.note, id: 'note' }) : ''}
        ${final && t.note ? fld(t.status === 'cxl' ? 'Why it was cancelled' : 'Outcome', `<p class="tf-ro">${esc(t.note)}</p>`) : ''}
        ${fld('Details', `<textarea class="in" data-v="desc" ${final ? 'disabled' : ''} aria-label="Details">${esc(v.desc)}</textarea>`, { hint: final ? '' : 'Optional: context, progress notes.' })}
      </div>
      </div></div>
      <div class="dr-foot">${final ? '<button type="button" class="btn primary" data-x="close">Close</button>' : `<button type="submit" class="btn primary">${isNew ? 'Create task' : 'Save'}</button><button type="button" class="btn ghost" data-x="close">Cancel</button>`}</div>
    </form>`;
    CRM.enhanceSelects(scrim); CRM.enhanceDates(scrim);
  };
  scrim.addEventListener('click', (e) => {
    if (e.target.closest('[data-x="close"]')) { close(); return; }
    const b = e.target.closest('[data-st]'); if (b && !final) { v.status = b.dataset.st; draw(); }
  });
  scrim.addEventListener('change', (e) => { const k = e.target.dataset.v; if (!k) return; v[k] = e.target.value;
    if (k === 'si') { const o = INITS.find(x => x.id === v.si); if (o) v.acc = o.acc; draw(); } else if (k === 'acc') { v.si = ''; draw(); } });
  scrim.addEventListener('input', (e) => { const k = e.target.dataset.v; if (k) v[k] = e.target.value; });
  scrim.addEventListener('submit', (e) => {
    e.preventDefault();
    const closing = !isNew && v.status !== t.status && (v.status === 'done' || v.status === 'cxl');
    errs = {};
    if (!v.title.trim()) errs.title = 'Say what needs doing.';
    if (!v.due) errs.due = 'Pick a due date.';
    if (closing && v.status === 'cxl' && !v.note.trim()) errs.note = 'Say why it is cancelled.';
    if (Object.keys(errs).length) { draw(); scrim.querySelector('.tf.bad .in, .tf.bad .dt-btn')?.focus(); return; }
    const o = INITS.find(x => x.id === v.si);
    if (isNew) {
      const n = String(Math.max(...TASKS.map(x => +x.id.slice(-4))) + 1).padStart(4, '0');
      const nt = { id: 'TSK-2026-' + n, title: v.title.trim(), si: o ? o.id : null, siName: o ? o.name : '', acc: o ? o.acc : v.acc, to: v.to, by: ME, status: 'ns', due: v.due, act: null, done: null, desc: v.desc };
      TASKS.unshift(nt); close(); render(); toast(`${nt.id} added for ${nt.to === ME ? 'you' : nt.to}.`, 'ok'); return;
    }
    const moved = v.to !== t.to;
    Object.assign(t, { title: v.title.trim(), to: v.to, due: v.due, status: v.status, desc: v.desc, note: closing ? v.note.trim() : t.note, done: v.status === 'done' ? (t.done || TODAY_ISO) : null });
    close(); render(); toast(v.status === 'cxl' && closing ? `${t.id} cancelled.` : moved ? `${t.id} reassigned to ${v.to}.` : `${t.id} saved.`, 'ok');
  });
  document.querySelectorAll('.tf-panel').forEach(x => x.remove());
  draw(); document.body.appendChild(scrim); document.addEventListener('keydown', key, true);
  requestAnimationFrame(() => { document.body.classList.add('drill-open'); setTimeout(() => scrim.querySelector(final ? '[data-x="close"]' : '[data-v="title"]')?.focus(), 280); });
}

// ---- Events ----
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a || !a.closest('#top, #page')) return;
  const act = a.dataset.act;
  if (act === 'view') { S.view = a.dataset.v; S.note = ''; S.page = 1; render(); }
  else if (act === 'sort') { S.sort = a.dataset.v; S.page = 1; render(); }
  else if (act === 'page') { S.page = +a.dataset.v; render(); }
  else if (act === 'showclosed') { S.closed = true; render(); }
  else if (act === 'edit') openForm(TASKS.find(t => t.id === a.dataset.v));
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (e.target.dataset.act === 'done' && e.target.closest('#page')) {
    const t = TASKS.find(x => x.id === e.target.dataset.v);
    if (e.target.checked) { t.status = 'done'; t.done = TODAY_ISO; render(); toast(`${t.id} completed.`, 'ok'); }
  }
});
function fill(sel, opts) { sel.innerHTML = opts.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join(''); }
fill($('#f-to'), [['', 'All'], ...PEOPLE.map(p => [p, nameOf(p)])]);
$('#f-search').addEventListener('input', (e) => { S.q = e.target.value; S.page = 1; render(); });
$('#f-to').addEventListener('change', (e) => { S.to = e.target.value; S.page = 1; render(); });
$('#f-closed').addEventListener('click', () => { S.closed = !S.closed; S.page = 1; render(); });
$('#reset').addEventListener('click', () => { S.q = ''; S.to = ''; $('#f-search').value = ''; $('#f-to').value = ''; render(); });
$('#new').addEventListener('click', () => openForm(null));

CRM.renderShell('tasks');
CRM.watchSticky($('#filters'));
render();
</script>
</body>
</html>
