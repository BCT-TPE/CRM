<style>
/* ---------- Page: one report (old CRMpulse /reports/[id]) ----------
   Same layout as the list pages: back link and title, the filter bar (search in the report, fiscal year, quarter, salesperson,
   team; geography and the report's own filters in More filters; Details and Export at the end), the report's summary figures,
   a row count, and the rows in a sortable table. Rows that stand for one record open it. */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; margin: -8px 0 0; font-size: var(--text-sm); color: var(--t3); text-decoration: none; }
.back:hover { color: var(--deep); } .back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* header KPIs: right of the title, the figures level with the top of the title (back link 32px + h1 margin 14px + its half-leading) */
.kpis-rp { display: grid; grid-template-columns: repeat(var(--n), auto); gap: 20px 32px; max-width: 62%; } /* up to four a row, in columns, so a second row lines up */
.kpis-rp .v2-kl { white-space: normal; }
@media (min-width: 1361px) { .v2-head:has(> .kpis-rp) { align-items: flex-start; } .v2-head > .kpis-rp { margin-top: calc(32px + 14px + 1.7px); } }
@media (max-width: 1360px) { body.v2 .v2-head > .kpis-rp { max-width: none; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
@media (max-width: 768px) { body.v2 .v2-head > .kpis-rp { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tbl.rp td { height: 64px; } /* DESIGN §2: table rows 64px */
.tbl.rp th { white-space: nowrap; } .tbl.rp td { white-space: nowrap; } .tbl.rp td.wrap { white-space: normal; min-width: 200px; }
.rd dl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; margin: 12px 0 0; }
.rd dt { font-size: var(--text-xs); color: var(--t3); } .rd dd { margin: 2px 0 0; font-size: var(--text-sm); color: var(--ink); }
.rd h3 { margin: 16px 0 8px; font-size: var(--text-xs); font-weight: 600; color: var(--t2); } .rd ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rd li { padding: 3px 9px; border-radius: var(--radius-pill); background: var(--hover); font-size: var(--text-xs); color: var(--t2); } .rd li b { font-weight: 600; color: var(--ink); }
.exp-wrap { position: relative; } #exp-pop { top: 44px; right: 0; left: auto; width: 240px; padding: 6px; }
#exp-pop button { display: flex; align-items: center; width: 100%; min-height: 40px; padding: 0 12px; border: 0; border-radius: var(--radius-control); background: none; font: inherit; font-size: var(--text-sm); color: var(--ink); text-align: left; cursor: pointer; }
@media (hover: hover) { #exp-pop button:hover { background: var(--hover); } } @media (max-width: 767px) { #exp-pop button { min-height: 44px; } } /* touch leaves no hover fill; phone list items 44px (design review) */ #exp-pop small { margin-left: 6px; color: var(--t3); }
.more-wrap { position: relative; } #more-pop { top: 44px; right: 0; left: auto; width: 300px; }
body.v2 #more-pop label.select.fsel { display: flex; width: 100%; height: 40px; border-radius: var(--radius-control); border-color: var(--line-2); box-shadow: none; }
#more-pop .fsel .sel-btn { max-width: none; width: 100%; font-weight: 400; }
#details[aria-pressed="true"] { border-color: var(--deep); }
@media (max-width: 1100px) { .rd dl { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 768px) { #more-pop { width: calc(100vw - 32px); } </style>
</head>

        <div class="pop" id="exp-pop" role="menu" aria-label="Export" hidden><button type="button" role="menuitem" data-fmt="xlsx">Excel (.xlsx)<small>formatted</small></button><button type="button" role="menuitem" data-fmt="csv">CSV (.csv)<small>plain data</small></button></div>

<script>

const S = { q: '', fy: '2627', qtr: '', owner: '', team: '', geo: '', main: '', state: '', cls: 'sbu', sort: null, page: 1, details: false };
const MINE = null; // every role sees the whole company outside Home (2026-11-26; View as only changes Home and the sidebar)
const seen = (owner) => !MINE || MINE.includes(owner); // only the records you are allowed to see, as in the old app
const FYL = () => `FY${S.fy.slice(0, 2)}-${S.fy.slice(2)}`;
const fyOf = (d) => d ? fyq(d) : null;
const inPeriod = (d) => { if (!d) return false; const x = fyq(d); return x.fy === S.fy && (!S.qtr || x.q === +S.qtr); };
const who = (o) => (!S.owner || o.owner === S.owner) && (!S.team || o.team === S.team) && (!S.geo || TEAMS[o.team]?.geo === S.geo) && seen(o.owner);
const MAIN = ['Prospect', 'Lead', 'Opportunity'], STATES = [['open', 'Open'], ['won', 'Closed won'], ['lost', 'Closed lost']];
const CLS = TARGET_DIMS.filter(([k]) => !['geography', 'region', 'salesperson'].includes(k));
const KIND = { text: 'Text', money: 'Amount (USD)', count: 'Count', pct: 'Percentage', date: 'Date', number: 'Number' };
const stageName = (o) => o.stage || o.sub;
const C = (key, label, kind = 'text') => ({ key, label, kind });
const BASE = [C('code', 'Initiative ID'), C('name', 'Name'), C('account', 'Account'), C('owner', 'Owner'), C('team', 'Team')];
const siRow = (o) => ({ code: o.id, name: o.name, account: o.acc, owner: o.owner, team: o.team, main: o.status, sub: stageName(o), funnel: o.code && (!o.kind || o.kind === 'open') ? o.code : '', value: o.value,
  prob: o.prob, weighted: o.value * (o.prob || 0) / 100, close: o.close || '', actual: o.closed || '', days: o.days, ageing: o.days == null ? '' : AGE_NAMES[ageBucket(o.days)], reason: o.reason || '', _link: `initiative.html?id=${encodeURIComponent(o.id)}` });
const openOpps = () => S.fy !== '2627' ? [] : OPPS.filter(o => who(o) && (!S.qtr || o.q === +S.qtr)); // the same open pipeline as Pipeline & forecast (the current FY; a quarter = deals closing in it)

const PERF = [C('name', 'Name'), C('bookings', 'Bookings', 'money'), C('target', 'Target', 'money'), C('pct', 'Achievement %', 'pct'), C('variance', 'Variance', 'money'), C('won', 'Won', 'count'), C('lost', 'Lost', 'count')];
function build() { // { cols, rows, kpis, note }
  switch (INFO.id) {
    case 'initiative-register': { const l = INITS.filter(o => who(o) && (!S.main || o.status === S.main) && (!S.state || o.kind === S.state)).sort((a, b) => a.id.localeCompare(b.id));
      return { cols: [...BASE, C('main', 'Main Status'), C('sub', 'Sub-Stage'), C('value', 'Value', 'money'), C('close', 'Expected Close', 'date')], rows: l.map(siRow), kpis: [['Initiatives', l.length, 'count']], note: 'All periods: the register is not period-filtered.' }; }
    case 'open-pipeline': { const l = openOpps().sort((a, b) => b.value - a.value);
      return { cols: [...BASE, C('sub', 'Stage'), C('funnel', 'Funnel'), C('value', 'Value', 'money'), C('prob', 'Probability %', 'count'), C('weighted', 'Weighted Value', 'money'), C('close', 'Expected Close', 'date')], rows: l.map(siRow),
        kpis: [['Open Opportunities', l.length, 'count'], ['Pipeline Value', sumOf(l)], ['Weighted Pipeline', sumOf(l, 'w')]] }; }
    case 'sales-funnel': { const l = openOpps();
      const rows = STAGES.map(st => { const x = l.filter(o => o.st === st.id); return { stage: st.name, funnel: st.code, count: x.length, value: sumOf(x), weighted: sumOf(x, 'w') }; });
      return { cols: [C('stage', 'Stage'), C('funnel', 'Funnel'), C('count', 'Opportunities', 'count'), C('value', 'Pipeline Value', 'money'), C('weighted', 'Weighted Value', 'money')], rows,
        kpis: ['L3', 'L2', 'L1'].map(c => { const x = l.filter(o => o.code === c); return [`${c} (${x.length})`, sumOf(x)]; }) }; }
    case 'pipeline-ageing': { const l = openOpps().sort((a, b) => b.days - a.days);
      return { cols: [...BASE, C('sub', 'Stage'), C('days', 'Days in Stage', 'count'), C('ageing', 'Ageing'), C('value', 'Value', 'money')], rows: l.map(siRow), kpis: AGE_NAMES.map((n, i) => [n, l.filter(o => ageBucket(o.days) === i).length, 'count']) }; }
    case 'quarterly-forecast': { const l = OPPS.filter(o => who(o)), dated = l.filter(o => o.close && fyq(o.close).fy === S.fy);
      const rows = [1, 2, 3, 4].filter(q => !S.qtr || q === +S.qtr).map(q => { const x = dated.filter(o => fyq(o.close).q === q); return { quarter: `Q${q} ${FYL()}`, count: x.length, gross: sumOf(x), weighted: sumOf(x, 'w') }; });
      return { cols: [C('quarter', 'Expected Close Quarter'), C('count', 'Opportunities', 'count'), C('gross', 'Gross Value', 'money'), C('weighted', 'Weighted Value', 'money')], rows, kpis: [['No expected close date (excluded)', l.filter(o => !o.close).length, 'count']] }; }
    case 'closed-won': case 'closed-lost': { const won = INFO.id === 'closed-won', l = closedIn().filter(o => o.result === (won ? 'won' : 'lost')).sort((a, b) => b.closed.localeCompare(a.closed));
      return { cols: [...BASE, C('value', won ? 'Booking Value' : 'Value', 'money'), C('actual', 'Actual Close', 'date'), ...(won ? [] : [C('reason', 'Loss Reason')])], rows: l.map(o => siRow({ ...o, kind: o.result })),
        kpis: [[won ? 'Won' : 'Lost', l.length, 'count'], [won ? 'Booking Value' : 'Lost Value', sumOf(l)]] }; }
    case 'salesperson-performance': { const l = closedIn(), names = [...new Set(l.map(o => o.owner))].sort();
      return { cols: PERF, rows: names.map(n => perf(n, l.filter(o => o.owner === n && o.result === 'won'), l.filter(o => o.owner === n && o.result === 'lost'), PERSON_TARGET[n] != null ? PERSON_TARGET[n] * share() : null)), note: 'Targets shown are those defined for that dimension alone.' }; }
    case 'team-performance': { const l = closedIn(), teams = [...new Set(l.map(o => o.team))].sort();
      return { cols: PERF, rows: teams.map(t => perf(t, l.filter(o => o.team === t && o.result === 'won'), l.filter(o => o.team === t && o.result === 'lost'), null)), note: 'Targets shown are those defined for that dimension alone.' }; }
    case 'geo-performance': { const l = closedIn(), geoT = Object.fromEntries(targetRows('geography', S.fy).map(r => [r.name, r.annual])), regT = Object.fromEntries(targetRows('region', S.fy).map(r => [r.name, r.annual])), rows = [];
      Object.keys(SALES_REGION).filter(g => !S.geo || g === S.geo).forEach(g => { const mine = l.filter(o => sellOf(o).geography === g);
        rows.push(perf(g, mine.filter(o => o.result === 'won'), mine.filter(o => o.result === 'lost'), geoT[g] != null ? geoT[g] * share() : null));
        SALES_REGION[g].forEach(r => { const reg = mine.filter(o => sellOf(o).region === r); if (reg.length || regT[r] != null) rows.push(perf(`${g} › ${r}`, reg.filter(o => o.result === 'won'), reg.filter(o => o.result === 'lost'), regT[r] != null ? regT[r] * share() : null)); }); });
      return { cols: PERF, rows, note: 'Targets shown are those defined for that dimension alone.' }; }
    case 'classification-performance': { const l = closedIn(), dim = S.cls, name = TARGET_DIMS.find(d => d[0] === dim)[1], tg = Object.fromEntries(targetRows(dim, S.fy).map(r => [r.name, r.annual]));
      const vals = [...new Set([...Object.keys(tg), ...l.map(o => sellOf(o)[dim])])].filter(Boolean).sort();
      return { cols: PERF, rows: vals.map(v => { const mine = l.filter(o => sellOf(o)[dim] === v); return perf(v, mine.filter(o => o.result === 'won'), mine.filter(o => o.result === 'lost'), tg[v] != null ? tg[v] * share() : null); }).filter(r => r.won || r.lost || r.target != null),
        note: `Bookings and ${name}-only targets per ${name} value.` }; }
    case 'target-achievement': { const cq = S.fy === '2627' ? CUR_Q : S.fy === '2526' ? 5 : 0, rows = [];
      TARGET_DIMS.forEach(([dim, label], di) => targetRows(dim, S.fy).forEach((r, ri) => r.q.forEach((t, i) => { if (t == null || (S.qtr && i + 1 !== +S.qtr)) return;
        if (dim === 'salesperson' ? !seen(r.name) || (S.owner && r.name !== S.owner) : MINE) return; // a salesperson / manager sees their own salesperson targets
        if (S.geo && ((dim === 'geography' && r.name !== S.geo) || (dim === 'region' && SALES_REGION_GEO[r.name] !== S.geo))) return;
        const a = i + 1 > cq ? 0 : r.ach[i]; rows.push({ code: `TGT-${S.fy}-${dim.slice(0, 3).toUpperCase()}-${String(di * 100 + ri * 4 + i + 1).padStart(4, '0')}`, fy: FYL(), quarter: `Q${i + 1}`, dimension: label, scope: r.name, target: t, achievement: a, variance: a - t, pct: t ? a / t * 100 : null, _link: 'targets.html' }); })));
      return { cols: [C('code', 'Target ID'), C('fy', 'Financial Year'), C('quarter', 'Quarter'), C('dimension', 'Dimension'), C('scope', 'Value'), C('target', 'Target', 'money'), C('achievement', 'Achievement', 'money'), C('variance', 'Variance', 'money'), C('pct', 'Achievement %', 'pct')], rows,
        note: 'Each target is for one dimension value and is compared independently; targets are not totalled.' }; }
    case 'activities': { const l = ACTIVITIES.filter(a => inPeriod(a.d.slice(0, 10)) && seen(a.owner) && (!S.owner || a.owner === S.owner)), by = {};
      l.forEach(a => { by[a.type] = (by[a.type] || 0) + 1; });
      return { cols: [C('code', 'Activity'), C('date', 'Date', 'date'), C('type', 'Type'), C('purpose', 'Purpose'), C('subject', 'Subject'), C('account', 'Account'), C('owner', 'Owner')],
        rows: l.map(a => ({ code: a.id, date: a.d.slice(0, 10), type: a.type, purpose: a.purpose, subject: a.t, account: a.acc, owner: a.owner, _link: `activities.html?q=${a.id}` })), kpis: Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v, 'count']) }; }
    case 'task-status': { const l = TASKS.filter(t => inPeriod(t.due) && seen(t.to) && (!S.owner || t.to === S.owner)).sort((a, b) => a.due.localeCompare(b.due)), by = {};
      l.forEach(t => { by[TASK_STATUS[t.status]] = (by[TASK_STATUS[t.status]] || 0) + 1; }); const late = l.filter(taskLate).length;
      return { cols: [C('code', 'Task'), C('title', 'Title'), C('owner', 'Owner'), C('status', 'Status'), C('due', 'Due Date', 'date'), C('overdue', 'Overdue')],
        rows: l.map(t => ({ code: t.id, title: t.title, owner: t.to, status: TASK_STATUS[t.status], due: t.due, overdue: taskLate(t) ? 'Overdue' : '', _link: `tasks.html?q=${t.id}` })), kpis: [...Object.entries(by).map(([k, v]) => [k, v, 'count']), ['Overdue', late, 'count']], note: 'Tasks due in the period.' }; }
    case 'order-register': { const l = ORDERS.filter(o => (!o.date || inPeriod(o.date)) && seen(o.owner) && (!S.owner || o.owner === S.owner));
      return { cols: [C('code', 'Order'), C('account', 'Account'), C('initiative', 'Opportunity'), C('reference', 'PO / Contract'), C('date', 'Order Date', 'date'), C('status', 'Status'), C('type', 'Type'), C('currency', 'Currency'), C('order_value', 'Order Value', 'number'), C('value', 'Value', 'money')],
        rows: l.map(o => ({ code: o.id, account: o.acc, initiative: o.si, reference: o.po, date: o.date, status: o.status, type: o.type, currency: o.cur, order_value: o.value, value: orderUsd(o), _link: `orders.html?open=${o.id}` })),
        kpis: [['Orders', l.length, 'count'], ['Confirmed order value', l.filter(o => o.status === 'Open' || o.status === 'Completed').reduce((t, o) => t + orderUsd(o), 0)]], note: 'Orders dated in the period, plus Draft orders not yet dated.' }; }
  }
}
const NUM = ['money', 'count', 'pct', 'number'];
const PEOPLE_SET = new Set([...Object.values(TEAMS).flatMap(t => t.people), ...Object.keys(FUNC)]);
// a column that names a person shows the avatar with the name, as in every table on the site
const person = (c, v) => ['owner', 'name', 'scope'].includes(c.key) && PEOPLE_SET.has(v);
const txt = (c, v) => cell(c, v).replace(/<[^>]+>/g, '');
function cell(c, v) {
  if (person(c, v)) return `<div class="own">${CRM.avatar(v)}<div class="own-t"><div class="ell">${esc(v)}</div></div></div>`;
  if (v === null || v === undefined || v === '') return c.kind === 'money' || c.kind === 'pct' ? 'N/A' : '—';
  if (c.kind === 'money') return money(v); if (c.kind === 'pct') return `${(+v).toFixed(1)}%`; if (c.kind === 'number') return Math.round(v).toLocaleString('en-US');
  if (c.kind === 'date') return CRM.date(v); if (c.kind === 'count') return String(Math.round(v)); return esc(String(v));
}
const cmp = (c, a, b) => { const e = (v) => v === null || v === undefined || v === ''; if (e(a) || e(b)) return e(a) - e(b);
  return NUM.includes(c.kind) ? a - b : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); };
let R = null;
function render() {
  R = build();
  const t = S.q.trim().toLowerCase();
  let rows = t ? R.rows.filter(r => R.cols.some(c => txt(c, r[c.key]).toLowerCase().includes(t))) : R.rows;
  const col = S.sort && R.cols.find(c => c.key === S.sort.key);
  if (col) rows = rows.slice().sort((x, y) => { const e = (v) => v === null || v === undefined || v === ''; return e(x[col.key]) || e(y[col.key]) ? cmp(col, x[col.key], y[col.key]) : cmp(col, x[col.key], y[col.key]) * S.sort.dir; });
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE)); S.page = Math.min(S.page, pages);
  const shown = rows.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  $('#r-sub').innerHTML = CRM.dots(`${INFO.desc} · ${INFO.id === 'initiative-register' ? 'All periods' : `${FYL()}${S.qtr ? ` Q${S.qtr}` : ''}`} · USD`);
  const th = (c) => { const d = S.sort && S.sort.key === c.key ? S.sort.dir : 0, r = NUM.includes(c.kind);
    return `<th class="${r ? 'r' : ''}" aria-sort="${d === 1 ? 'ascending' : d === -1 ? 'descending' : 'none'}"><button class="th-sort ${d ? 'on' : ''}" data-act="sort" data-v="${c.key}">${c.label}<span class="arr" aria-hidden="true">${d === -1 ? '↓' : '↑'}</span></button></th>`; };
  // the report's summary figures sit in the page header, top right, as on Home
  document.querySelectorAll('.v2-head > [data-hr]').forEach(e => e.remove());
  if (R.kpis && R.kpis.length) $('.v2-head').insertAdjacentHTML('beforeend', `<div class="v2-kpis kpis-rp" data-hr aria-label="Summary" style="--n:${Math.min(R.kpis.length, 4)}">${R.kpis.map(([l, v, k]) => `<div class="v2-kpi"><div class="v2-kv">${k === 'count' ? v : moneyBig(v)}</div><div class="v2-kl">${esc(l)}</div></div>`).join('')}</div>`);
  const det = S.details ? `<section class="card rd" aria-label="Report details"><div class="card-h"><div><h2>Report details</h2><p>${esc(R.note || INFO.desc)}</p></div></div>
      <dl><div><dt>Group</dt><dd>${esc(INFO.group)}</dd></div><div><dt>Period</dt><dd>${INFO.id === 'initiative-register' ? 'All periods' : FYL() + (S.qtr ? ` Q${S.qtr}` : '')}</dd></div><div><dt>Currency</dt><dd>USD (every amount at the configured rates)</dd></div><div><dt>Rows</dt><dd>${R.rows.length}</dd></div>
        <div><dt>Filters on this view</dt><dd>${applied() ? `${applied()} applied` : 'None besides the financial year'}</dd></div><div><dt>Scope</dt><dd>Only the records you are allowed to see</dd></div><div><dt>Formats</dt><dd>Excel (.xlsx, formatted) · CSV (.csv, plain)</dd></div></dl>
      <h3>Columns</h3><ul>${R.cols.map(c => `<li><b>${c.label}</b> · ${KIND[c.kind]}</li>`).join('')}</ul></section>` : '';
  const table = rows.length ? `<section class="card" aria-label="Report rows"><div class="tbl-wrap"><table class="tbl rp"><thead><tr>${R.cols.map(th).join('')}</tr></thead>
      <tbody>${shown.map(r => `<tr class="${r._link ? 'click' : ''}" ${r._link ? `data-href="${r._link}" tabindex="0"` : ''}>${R.cols.map((c, j) => `<td class="${NUM.includes(c.kind) ? 'r num' : ''} ${/name|subject|title|stage$/i.test(c.key) ? 'wrap' : ''}">${j === 0 ? `<span class="t-main">${cell(c, r[c.key])}</span>` : cell(c, r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${rows.length > PER_PAGE ? `<div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, rows.length)} of ${rows.length}</span><span class="sp"></span>
        <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
        ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
        <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button></div>` : ''}</section>`
    : `<section class="card"><div class="empty" style="padding:48px 12px"><b>${R.rows.length ? 'No rows match the search.' : 'No records for these filters.'}</b>${applied() || t ? '<button class="link" data-act="reset">Clear filters</button>' : ''}</div></section>`;
  $('#page').innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">${det}${table}</div>`;
  $('#reset').hidden = !(applied() || S.q); const m = [S.geo, S.main, S.state, S.cls !== 'sbu' && INFO.params.includes('classification_id') ? S.cls : ''].filter(Boolean).length; $('#more-n').hidden = !m; $('#more-n').textContent = m;
  $('#export').disabled = !R.rows.length; $('#details').setAttribute('aria-pressed', String(S.details));
}
const applied = () => [S.qtr, S.owner, S.team, S.geo, S.main, S.state, S.cls !== 'sbu' && INFO.params.includes('classification_id') ? S.cls : ''].filter(Boolean).length;
function buildMore() {
  const g = (k, l, opts, v) => `<div class="grp"><h4>${l}</h4><label class="select fsel"><select data-m="${k}" aria-label="${l}">${opts.map(([x, n]) => `<option value="${esc(x)}" ${x === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label></div>`;
  $('#m-grid').innerHTML = g('geo', 'Geography', [['', 'All'], ...Object.keys(SALES_REGION).map(x => [x, x])], S.geo)
    + (INFO.params.includes('main_status') ? g('main', 'Main Status', [['', 'All'], ...MAIN.map(x => [x, x])], S.main) : '')
    + (INFO.params.includes('state') ? g('state', 'State', [['', 'All'], ...STATES], S.state) : '')
    + (INFO.params.includes('classification_id') ? g('cls', 'Classification', CLS.map(([k, l]) => [k, k === 'sbu' ? `${l} (default)` : l]), S.cls) : '');
  CRM.enhanceSelects($('#m-grid'));
}
const setMore = (on) => { $('#more-pop').hidden = !on; $('#more-btn').setAttribute('aria-expanded', String(on)); if (on) buildMore(); };
const setExp = (on) => { $('#exp-pop').hidden = !on; $('#export').setAttribute('aria-expanded', String(on)); };
function resetAll() { Object.assign(S, { q: '', qtr: '', owner: '', team: '', geo: '', main: '', state: '', cls: 'sbu', page: 1 }); ['#f-search', '#f-q', '#f-owner', '#f-team'].forEach(s => $(s).value = ''); render(); }
document.title = `${INFO.title} · BCT CRM`; $('#r-title').textContent = INFO.title;
const fill = (sel, opts) => { sel.innerHTML = opts.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join(''); };
fill($('#f-owner'), [['', 'All'], ...[...new Set(Object.values(TEAMS).flatMap(t => t.people))].filter(seen).sort().map(p => [p, p === ME ? `${p} (you)` : p])]);
fill($('#f-team'), [['', 'All'], ...Object.keys(TEAMS).filter(t => !MINE || TEAMS[t].people.some(seen)).map(t => [t, t])]);
const on = (id, k) => $(id).addEventListener('change', (e) => { S[k] = e.target.value; S.page = 1; render(); });
on('#f-fy', 'fy'); on('#f-q', 'qtr'); on('#f-owner', 'owner'); on('#f-team', 'team');
$('#f-search').addEventListener('input', (e) => { S.q = e.target.value; S.page = 1; render(); });
$('#reset').addEventListener('click', resetAll);
$('#more-btn').addEventListener('click', (e) => { e.stopPropagation(); setExp(false); setMore($('#more-pop').hidden); });
$('#more-pop').addEventListener('click', (e) => e.stopPropagation());
$('#more-pop').addEventListener('change', (e) => { const k = e.target.dataset.m; if (!k) return; S[k] = e.target.value; S.page = 1; render(); });
$('#more-clear').addEventListener('click', () => { Object.assign(S, { geo: '', main: '', state: '', cls: 'sbu' }); buildMore(); render(); });
$('#more-done').addEventListener('click', () => setMore(false));
$('#export').addEventListener('click', (e) => { e.stopPropagation(); setMore(false); setExp($('#exp-pop').hidden); });
$('#exp-pop').addEventListener('click', (e) => { const b = e.target.closest('[data-fmt]'); if (!b) return; setExp(false); toast(`Report exported as ${b.dataset.fmt === 'csv' ? 'CSV' : 'Excel'}.`, 'ok'); });
document.addEventListener('click', () => { setMore(false); setExp(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { setMore(false); setExp(false); } });
$('#details').addEventListener('click', () => { S.details = !S.details; render(); });
$('#page').addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) { if (a.dataset.act === 'sort') { const k = a.dataset.v; S.sort = !S.sort || S.sort.key !== k ? { key: k, dir: 1 } : S.sort.dir === 1 ? { key: k, dir: -1 } : null; render(); }
    else if (a.dataset.act === 'page') { S.page = +a.dataset.v; render(); } else if (a.dataset.act === 'reset') resetAll(); return; }
  const tr = e.target.closest('tr[data-href]'); if (tr) location.href = tr.dataset.href; // a row that stands for one record opens it
});
$('#page').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-href]')) location.href = e.target.dataset.href; });
CRM.renderShell('reports');
CRM.watchSticky($('#filters'));
render();
CRM.riseIn();
</script>
</body>
</html>
