<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales targets · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="design-system/tokens.css?v=20261123a">
<link rel="stylesheet" href="assets/crm.css?v=20261126a">
<link rel="stylesheet" href="assets/dashboard.css?v=20261124b">
<link rel="stylesheet" href="assets/theme-v2.css?v=20261126a">
<link rel="stylesheet" href="assets/responsive.css?v=20261126c">
<style>
/* ---------- Page: Sales targets (CRM V1 §10, old CRMpulse /targets "Sales Targets & Allocation"; the title follows the menu) ----------
   Fiscal year + search, one tab per dimension (each planned on its own, never added across), a Q1–Q4 grid with what each
   quarter has achieved, annual target, achieved and %. The whole row opens the side panel: the four quarters with their
   remarks and history, and Edit for the roles that plan targets. Visual language = the other list pages. */
.tbl.tg { table-layout: fixed; }
.tbl.tg col.c-n { width: 18%; } .tbl.tg col.c-q { width: 14%; } .tbl.tg col.c-a { width: 11%; } .tbl.tg col.c-h { width: 9.5%; } .tbl.tg col.c-p { width: 5.5%; }
.tbl.tg td { height: 64px; padding-top: 10px; padding-bottom: 10px; }
.tbl.tg td.qt { padding-right: 6px; }
.tbl.tg th .now { font-weight: 400; color: var(--t3); }
.qt b { display: block; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.qt small { display: block; margin-top: 2px; font-size: var(--text-xs); color: var(--t3); } /* wraps rather than cutting the % off */
.pc { font-weight: 600; font-variant-numeric: tabular-nums; }
.pc.ok { color: var(--ok-text); } .pc.warn { color: var(--warn-text); } .pc.low { color: var(--danger); }
.tbl.tg td.cur { background: var(--surface-faint); }
.no-t { color: var(--t3); }
.ro-note { margin: 0 0 12px; font-size: var(--text-xs); color: var(--t3); }
/* side panel: one block per quarter */
.tq { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-lg); }
.tq-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.tq-h b { font-size: var(--text-sm); font-weight: 600; color: var(--ink); } .tq-h b small { margin-left: 8px; font-size: var(--text-xs); font-weight: 400; color: var(--t3); }
.tq-h > span { font-size: var(--text-xs); color: var(--t3); font-variant-numeric: tabular-nums; }
.tq dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin: 0; }
.tq dt { font-size: var(--text-xs); color: var(--t3); } .tq dd { margin: 2px 0 0; font-size: var(--text-sm); color: var(--ink); font-variant-numeric: tabular-nums; } .tq dd.no-t { color: var(--t3); }
.tq details { font-size: var(--text-xs); } .tq summary { display: inline-flex; align-items: center; min-height: 40px; font-weight: 500; color: var(--deep); cursor: pointer; }
.tq details ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; color: var(--t2); } .tq details li { display: flex; justify-content: space-between; gap: 12px; }
.tg-amt { position: relative; } .tg-amt .in { padding-right: 52px; font-variant-numeric: tabular-nums; } .tg-amt span { position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; font-size: var(--text-xs); font-weight: 600; color: var(--t3); pointer-events: none; }
.tg-sum { align-self: end; padding-bottom: 10px; text-align: right; font-size: var(--text-sm); color: var(--t3); } .tg-sum b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) { .tbl.tg { min-width: 980px; } }
.ph-pc { display: none; }
@media (max-width: 767px) { .ph-pc { display: inline; } .main .tbl.tg tbody td.tg-p { display: none; } } /* phone card: % sits after Achieved instead of a row of its own */
</style>
</head>
<body class="v2">
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="v2-head">
      <div class="v2-hello">
        <h1>Sales targets</h1>
        <p>Quarterly booking targets per dimension, compared with Closed Won bookings (USD). Each dimension is planned independently; targets are never combined or added across dimensions.</p>
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Search geography" aria-label="Search"></label>
      <label class="select"><span class="lbl">Fiscal year</span><select id="f-fy" aria-label="Fiscal year"><option value="2526">FY25-26</option><option value="2627" selected>FY26-27</option><option value="2728">FY27-28</option></select></label>
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
    </div>

    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261126e"></script>
<script src="assets/crm-data.js?v=20261126d"></script>
<script>
const { money, toast } = CRM;
const $ = (s) => document.querySelector(s);
const PER_PAGE = 10;
const S = { dim: 'geography', fy: '2627', q: '', page: 1 };
const EDITS = {}; // `${fy}|${dim}|${name}` → { q: [4 values or null], rem: [4 remarks], cur } saved in this session
const NOUN = { geography: ['geography', 'geographies'], region: ['region', 'regions'], salesperson: ['salesperson', 'salespeople'], sbu: ['SBU', 'SBUs'], practice: ['practice', 'practices'], offering: ['offering', 'offerings'], technology: ['technology', 'technologies'], vertical: ['vertical', 'verticals'] };
// old attainmentTone: 100% and over green; a finished quarter under 90% red (amber from 90%); the quarter in progress and the year are amber until met
const pctCls = (p, running) => p >= 100 ? 'ok' : running || p >= 90 ? 'warn' : 'low';
const curQ = () => S.fy === '2627' ? CUR_Q : S.fy === '2526' ? 5 : 0; // FY25-26 is over, FY27-28 hasn't started
const FYL = () => `FY${S.fy.slice(0, 2)}-${S.fy.slice(2)}`;
// planners (Settings, old seed): Administrator, Sales Head, Sales Manager; a manager only for their own team's salespeople
const canPlan = (name) => CRM.user.oversight || (CRM.user.code === 'SALES_MANAGER' && S.dim === 'salesperson' && TEAMS[PERSON_TEAM[ME]].people.includes(name));
const noPlan = () => CRM.user.oversight ? '' : CRM.user.code === 'SALES_MANAGER' ? 'A Sales Manager can set targets only for their team members.' : 'Your role cannot maintain sales targets.';

function rows() {
  const q = S.q.trim().toLowerCase();
  return targetRows(S.dim, S.fy).map(r => { const e = EDITS[`${S.fy}|${S.dim}|${r.name}`]; return e ? { ...r, q: e.q, rem: e.rem, cur: e.cur, annual: e.q.some(x => x != null) ? e.q.reduce((t, x) => t + (x || 0), 0) : null } : { ...r, rem: ['', '', '', ''], cur: 'USD' }; })
    .filter(r => !q || r.name.toLowerCase().includes(q));
}
function qCell(r, i) {
  const cq = curQ(), t = r.q[i], a = r.ach[i], qn = i + 1;
  if (t == null) return `<td class="qt ${qn === cq ? 'cur' : ''}"><b class="no-t">—</b><small>${a ? `${money(a)} won` : 'No target'}</small></td>`;
  const p = t ? Math.round(a / t * 100) : 0;
  const sub = qn > cq && !a ? 'Not started' : `${money(a)} · <span class="pc ${pctCls(p, qn === cq)}">${p}%${qn === cq ? ' so far' : ''}</span>`;
  return `<td class="qt ${qn === cq ? 'cur' : ''}"><b>${money(t)}</b><small>${sub}</small></td>`;
}
function body() {
  const list = rows(), cq = curQ();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE)); S.page = Math.min(S.page, pages);
  const shown = list.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  const [one, many] = NOUN[S.dim];
  const tabs = `<div class="tabs" role="tablist" aria-label="Dimension">${TARGET_DIMS.map(([k, l]) => `<button class="tab ${S.dim === k ? 'on' : ''}" role="tab" aria-selected="${S.dim === k}" data-act="dim" data-v="${k}">${l}</button>`).join('')}</div>`;
  const table = list.length ? `<div class="tbl-wrap"><table class="tbl tg">
      <colgroup><col class="c-n"><col class="c-q"><col class="c-q"><col class="c-q"><col class="c-q"><col class="c-a"><col class="c-h"><col class="c-p"></colgroup>
      <thead><tr><th>${TARGET_DIMS.find(d => d[0] === S.dim)[1]}</th>${[1, 2, 3, 4].map(q => `<th>Q${q}${q === cq ? ' <span class="now">· now</span>' : ''}</th>`).join('')}<th class="r">Annual target</th><th class="r">Achieved</th><th class="r">%</th></tr></thead>
      <tbody>${shown.map(r => { const h = r.ach.reduce((x, y) => x + y, 0), p = r.annual ? Math.round(h / r.annual * 100) : null;
        return `<tr class="click" data-act="open" data-v="${esc(r.name)}" tabindex="0"><td>${S.dim === 'salesperson' ? `<div class="own">${CRM.avatar(r.name)}<div class="own-t"><div class="ell t-main">${esc(r.name)}</div><div class="ell t-sub">${esc(PERSON_TEAM[r.name] || '')}</div></div></div>` : `<div class="ell t-main">${esc(r.name)}</div>`}</td>
          ${[0, 1, 2, 3].map(i => qCell(r, i)).join('')}
          <td class="r num"><b class="${r.annual ? '' : 'no-t'}">${r.annual ? money(r.annual) : 'No target'}</b></td>
          <td class="r num">${money(h)}${p == null ? '' : `<span class="ph-pc"> · <span class="pc ${pctCls(p, true)}">${p}%</span></span>`}</td>
          <td class="r num tg-p">${p == null ? '<span class="no-t">—</span>' : `<span class="pc ${pctCls(p, true)}">${p}%</span>`}</td></tr>`; }).join('')}</tbody>
    </table></div>
    <div class="pager"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, list.length)} of ${list.length}</span><span class="sp"></span>
      <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
      ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
      <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button></div>`
    : `<div class="empty" style="padding:48px 12px"><b>No ${many} match</b>${S.q ? `Nothing matches "${esc(S.q)}".` : `No active ${many} to plan.`}</div>`;
  const ro = list.length && !list.some(r => canPlan(r.name)) ? `<p class="ro-note">You can read these targets; your role cannot plan ${one} targets.</p>` : '';
  return `<section class="card" aria-label="Targets by ${one}">${tabs}
    ${ro}${table}</section>
    <p class="list-note">Under each quarter's target: closed won in that quarter and the share of the target.<br><b>Red</b>: a finished quarter under 90% of its target (amber from 90%). The quarter in progress and the year stay amber until they reach 100%.</p>`;
}
function render() {
  $('#page').innerHTML = body();
  $('#f-search').placeholder = `Search ${NOUN[S.dim][0]}`;
  $('#reset').hidden = !S.q;
}

// Side panel (old TargetRowDrawer): view the four quarters, their remarks and history; Edit for planners
const { fld, pick, inp, head, put } = CRM.form;
const parse = (x) => { const t = String(x).replace(/,/g, '').trim(); if (!t) return null; const n = Number(t); return Number.isFinite(n) && n >= 0 ? n : undefined; };
function openRow(name, editing) {
  const r = rows().find(x => x.name === name); if (!r) return;
  const dimL = TARGET_DIMS.find(d => d[0] === S.dim)[1], cq = curQ(), can = canPlan(name);
  const h = r.ach.reduce((x, y) => x + y, 0), p = r.annual ? Math.round(h / r.annual * 100) : null;
  const toCur = (usd) => usd == null ? '' : String(Math.round(usd * (FX[r.cur] || 1))); // shown in the target's own currency
  const v = { cur: r.cur, val: r.q.map(toCur), rem: [...r.rem] };
  const sub = `${dimL} · ${FYL()}${S.dim === 'salesperson' && PERSON_TEAM[name] ? ` · ${esc(PERSON_TEAM[name])}` : ''} · achieved ${money(h)} of ${r.annual ? money(r.annual) : 'no target'}${p == null ? '' : ` (${p}%)`}`;
  const parsed = () => v.val.map(parse), bad = () => parsed().map(x => x === undefined);
  const annual = () => { const l = parsed().filter(x => x != null && x !== undefined); return l.length ? l.reduce((t, x) => t + x, 0) : null; };
  const code = (i) => r.q[i] == null ? '' : `TGT-${S.fy}-${S.dim.slice(0, 3).toUpperCase()}-${String(TARGET_DIMS.findIndex(d => d[0] === S.dim) * 100 + targetRows(S.dim, S.fy).findIndex(x => x.name === name) * 4 + i + 1).padStart(4, '0')}`;
  const state = (i) => i + 1 > cq && !r.ach[i] ? 'Not started' : `${money(r.ach[i])} achieved${r.q[i] ? ` · ${Math.round(r.ach[i] / r.q[i] * 100)}%` : ''}`;
  const block = (i) => `<section class="tq" aria-label="Q${i + 1}"><div class="tq-h"><b>Q${i + 1}${i + 1 === cq ? ' · now' : ''}${code(i) ? `<small>${code(i)}</small>` : ''}</b><span>${state(i)}</span></div>
      ${editing ? `<div class="tf-2">${fld('Target value', `<div class="tg-amt">${inp('v' + i, v.val[i], `Q${i + 1} target value`)}<span>${v.cur}</span></div>`, { hint: 'Leave empty for no target.', err: bad()[i] ? 'Enter an amount of 0 or more, or leave it empty.' : '', id: 'v' + i })}
        ${fld('Remarks', `<textarea class="in" data-v="r${i}" aria-label="Q${i + 1} remarks" rows="2" ${parsed()[i] == null ? 'disabled' : ''}>${esc(v.rem[i])}</textarea>`)}</div>`
      : `<dl><div><dt>Target</dt><dd class="${r.q[i] == null ? 'no-t' : ''}">${r.q[i] == null ? 'No target' : r.cur === 'USD' ? money(r.q[i]) : `${r.cur} ${Math.round(r.q[i] * FX[r.cur]).toLocaleString('en-US')}`}</dd></div><div><dt>Remarks</dt><dd class="${r.rem[i] ? '' : 'no-t'}">${r.rem[i] ? esc(r.rem[i]) : '—'}</dd></div></dl>
        ${code(i) ? `<details><summary>Revision history</summary><ul>${EDITS[`${S.fy}|${S.dim}|${name}`] ? `<li><span>Changed by ${esc(ME)}</span><small>${CRM.date(TODAY.toISOString().slice(0, 10))}</small></li>` : ''}<li><span>Set by the planning team</span><small>${CRM.date(`20${S.fy.slice(0, 2)}-03-20`)}</small></li></ul></details>` : ''}`}</section>`;
  const foot = () => editing ? `<div class="op-r1"><span class="op-msg" role="status">${bad().some(Boolean) ? 'Fix the highlighted amounts.' : ''}</span></div><button type="button" class="btn ghost" data-x="close">Cancel</button><button type="submit" class="btn primary" ${bad().some(Boolean) ? 'disabled' : ''}>Save targets</button>`
    : `<div class="op-r1"><span class="op-msg">${can ? '' : esc(noPlan())}</span></div><button type="button" class="btn ghost" data-x="close">Close</button>${can ? '<button type="button" class="btn primary" data-x="edit">Edit</button>' : ''}`;
  const draw = () => `<form class="tf-form" novalidate>${head('Sales targets', `${editing ? 'Edit targets · ' : ''}${esc(name)}`, sub)}
    <div class="dr-body"><div class="tf-g">
      ${editing ? `<div class="tf-2">${fld('Currency for new targets', pick('cur', ['USD', 'AED', 'INR', 'OMR', 'SAR'].map(c => [c, c]), v.cur, 'Currency for new targets'), { hint: r.q.some(x => x != null) ? 'Existing targets keep their own currency.' : '' })}<div class="tg-sum" data-sum>Annual target <b>${annual() == null ? '—' : annual().toLocaleString('en-US')}</b></div></div>` : ''}
      ${[0, 1, 2, 3].map(block).join('')}
    </div></div><div class="dr-foot op-foot">${foot()}</div></form>`;
  const P = CRM.openPanel(v, draw, `Discard changes to ${name}'s targets?`);
  const live = () => { put(P.el.querySelector('[data-sum]'), `Annual target <b>${annual() == null ? '—' : annual().toLocaleString('en-US')}</b>`); put(P.el.querySelector('.op-foot'), foot());
    bad().forEach((b, i) => { const t = P.el.querySelector(`[data-f="v${i}"]`); if (!t) return; t.classList.toggle('bad', b); put(t.querySelector('.tf-e, .tf-h') || t.appendChild(document.createElement('span')), b ? 'Enter an amount of 0 or more, or leave it empty.' : 'Leave empty for no target.'); (t.querySelector('.tf-e, .tf-h')).className = b ? 'tf-e' : 'tf-h'; });
    P.el.querySelectorAll('textarea[data-v^="r"]').forEach((t, i) => { t.disabled = parsed()[i] == null; }); };
  P.el.addEventListener('input', (e) => { const k = e.target.dataset.v; if (!k) return; if (k[0] === 'v') v.val[+k[1]] = e.target.value; else if (k[0] === 'r') v.rem[+k[1]] = e.target.value; live(); });
  P.el.addEventListener('change', (e) => { if (e.target.dataset.v === 'cur') { v.cur = e.target.value; P.redraw(); } });
  P.el.addEventListener('click', (e) => { if (e.target.closest('[data-x="edit"]')) { P.close(); setTimeout(() => openRow(name, true), 320); } });
  P.el.addEventListener('submit', async () => {
    if (bad().some(Boolean)) return;
    const vals = parsed().map(x => x == null ? null : x / (FX[v.cur] || 1)); // stored in USD, shown in the target's currency
    const cleared = vals.map((x, i) => x == null && r.q[i] != null ? `Q${i + 1}` : '').filter(Boolean);
    if (cleared.length && await CRM.confirm({ title: `Delete ${cleared.join(', ')} target${cleared.length === 1 ? '' : 's'}?`, body: `<p>The cleared quarter${cleared.length === 1 ? '' : 's'} of ${esc(name)} will have no target. Bookings are not affected.</p>`,
      actions: [{ label: 'Delete and save', value: 'yes', kind: 'quiet' }, { label: 'Keep editing', value: null, kind: 'primary' }] }) !== 'yes') return;
    const changed = vals.filter((x, i) => (x == null ? null : Math.round(x)) !== (r.q[i] == null ? null : Math.round(r.q[i])) || (x != null && v.rem[i].trim() !== r.rem[i])).length;
    EDITS[`${S.fy}|${S.dim}|${name}`] = { q: vals, rem: v.rem.map(x => x.trim()), cur: v.cur };
    P.close(); render(); toast(changed ? `${name}: ${changed} target${changed === 1 ? '' : 's'} saved.` : 'No changes to save.', 'ok');
  });
}

$('#page').addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'dim') { S.dim = a.dataset.v; S.q = ''; $('#f-search').value = ''; S.page = 1; render(); }
  else if (act === 'page') { S.page = +a.dataset.v; render(); }
  else if (act === 'open') openRow(a.dataset.v, false);
});
$('#f-fy').addEventListener('change', (e) => { S.fy = e.target.value; S.page = 1; render(); });
$('#f-search').addEventListener('input', (e) => { S.q = e.target.value; S.page = 1; render(); });
$('#reset').addEventListener('click', () => { S.q = ''; $('#f-search').value = ''; render(); });
$('#page').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });

CRM.renderShell('targets');
CRM.watchSticky($('#filters'));
render();
CRM.riseIn();
</script>
</body>
</html>
