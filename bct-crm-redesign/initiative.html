  const vertical = (VERTICAL.find(([re]) => re.test(o.acc)) || [0, 'Enterprise'])[1];

}
function details(o) {
  const lotus = o.id === 'SI-2026-0024';
  const closeD = o.kind === 'open' ? null : new Date(o.close);
  const created = lotus ? new Date('2026-07-06') : o.kind === 'open' ? addDays(TODAY, -(o.open || (o.days || 10) + 12)) : addDays(closeD, -(80 + hash(o.id) % 70));
  const existing = INITS.some(x => x.acc === o.acc && x.id !== o.id && x.kind === 'won');
  const sell = selling(o);
  const geo = TEAMS[o.team].geo;
  // Line items: value = sum of items (requirement: the initiative value is the sum of its line items)
  const local = (usd) => o.cur === 'USD' ? usd : usd * FX[o.cur];
  const sym = o.cur === 'INR' ? '₹' : o.cur === 'USD' ? '$' : o.cur + ' ';
  const fmtL = (v) => v == null ? '—' : sym + Math.round(v).toLocaleString('en-US');
  const total = lotus ? 116667000 : local(o.value);
  const items = lotus
    ? [{ n: 'Implementation services', c: 'Professional Services', r: 'One-time', amt: 70000200 }, { n: 'Subscriptions and support', c: 'Subscriptions', r: 'Recurring', arr: 46666800, amt: 46666800 }]
    : o.value >= 0.3e6
      ? [{ n: `${sell.off} – implementation`, c: 'Professional Services', r: 'One-time', amt: Math.round(total * .6) }, { n: 'Managed support (12 months)', c: 'Managed Services', r: 'Recurring', arr: Math.round(total * .4), amt: total - Math.round(total * .6) }]
      : [{ n: sell.off, c: 'Professional Services', r: 'One-time', amt: total }];
  // BANT: further along = more recorded
  const ix = o.kind === 'open' ? (o.status === 'Prospect' ? 0 : o.status === 'Lead' ? 1 : { L3: 2, L2: 3, L1: 4 }[o.code]) : 4;
  const role = pick(['CIO', 'CTO', 'Head of IT', 'CFO'], o.acc);
  const bant = [['Budget', ix >= 2 ? (ix >= 4 ? 'Approved' : 'Indicative range') : null], ['Authority', ix >= 1 ? (lotus ? 'CIO' : role) : null], ['Need', ix >= 1 ? `${sell.off} requirement` : null], ['Timeline', ix >= 3 ? (o.close && fyq(o.close).fy === '2627' ? 'This FY' : 'Next FY') : null]];
  // Contacts (fictional)
  const FIRST = ['Arjun', 'Meera', 'Rahul', 'Sara', 'Khalid', 'Lina', 'Wei Ling', 'Farah', 'Nikhil', 'Huda'], LAST = ['Patel', 'Nair', 'Kapoor', 'Haddad', 'Rahman', 'Chen', 'Salem', 'Menon', 'Al-Farsi', 'Lim'];
  const nm = (k) => `${pick(FIRST, o.acc + k)} ${pick(LAST, k + o.acc)}`;
  const contacts = lotus ? [{ n: 'Arjun Patel', t: 'Head of Data', role: 'Decision Maker' }]
    : ix === 0 ? [{ n: nm('a'), t: pick(['IT Manager', 'Head of Operations'], o.acc), role: 'Influencer' }]
    : [{ n: nm('a'), t: role, role: 'Decision Maker' }, ...(ix >= 3 ? [{ n: nm('b'), t: pick(['Procurement Lead', 'Finance Controller'], o.acc), role: 'Influencer' }] : [])];
  // Stage path (entered dates). Lotus = CRMpulse history; others: created in an earlier stage, current stage from days-in-stage.
  const steps = stepsOf(o).list;
  let path;
  if (lotus) path = [['Solution development', '2026-07-06'], ['Proposal submission', '2026-09-01'], ['Commercial negotiation', '2026-10-29']];
  else {
    const curName = o.kind === 'open' ? o.sub : CLOSED_STEPS[o.kind];
    const curIx = o.kind === 'lost' ? Math.min(steps.length - 2, { L3: 2, L2: 4, L1: 5 }[o.reached] || 2) : steps.indexOf(curName);
    const curStart = o.kind === 'open' ? addDays(TODAY, -o.days) : closeD;
    const startIx = Math.max(0, curIx - 2);
    path = [[steps[startIx], iso(created)]];
    if (curIx - startIx === 2 && (curStart - created) / DAY > 30) path.push([steps[startIx + 1], iso(addDays(created, Math.round((curStart - created) / DAY / 2)))]);
    if (o.kind === 'lost') path.push([steps[curIx], iso(addDays(curStart, -20))]);
    if (curIx !== startIx || o.kind !== 'open') path.push([curName, iso(curStart)]);
  }
  // Activities (fictional, oldest last)
  const acts = lotus
    ? [{ d: '2026-11-10T17:24', t: 'Messages with Lotus Retail India – Relationship Building', type: 'Messaging', purpose: 'Relationship Building', who: [] },
       { d: '2026-07-11T16:00', t: 'Follow-up – Lotus Retail India', type: 'Event / Conference', note: 'Discussed scope, timelines and next steps.', who: ['Arjun Patel'] }]
    : [{ d: iso(addDays(path[path.length - 1][1], 3)) + 'T11:30', t: `${o.kind === 'open' ? 'Call' : 'Meeting'} with ${o.acc}`, type: o.kind === 'open' ? 'Call' : 'Meeting', purpose: 'Follow-up', note: o.next ? `Agreed next step: ${o.next.toLowerCase()}.` : 'No next step agreed yet.', who: [contacts[0].n] },

      .filter(a => new Date(a.d) <= TODAY);

}

function rail() {
  const st = stepsOf(o).list, cur = st.indexOf(o.sub), nextName = o.kind === 'open' ? st[cur + 1] : null;
  const req = REQ[o.sub] || [];
  const late = o.follow && new Date(o.follow) < TODAY;
  const others = INITS.filter(x => x.acc === o.acc && x.id !== o.id).length;
  const ns = o.kind === 'open' ? `
    <section class="card ns"><div class="ns-h"><i>${SVG.arrow}</i><b>Next steps</b></div>
      <p class="ns-to">To reach ${esc(nextName)}:</p>
      ${req.map(([t, s]) => `<div class="req"><div><b>${t}</b><small>${s}</small></div></div>`).join('')}
      <div class="kv"><span>Next step on record</span><b class="${o.next ? '' : 'none'}">${o.next ? esc(o.next) : 'None recorded'}</b></div>
      <div class="kv"><span>Next follow-up</span><b class="${late ? 'hot' : ''}">${o.follow ? dd(o.follow) + (late ? ' · overdue' : '') : '—'}</b></div>
      <button class="btn" data-act="toast" data-v="Would open Set next step & follow-up">Set next step &amp; follow-up</button>
      <button class="btn primary" data-act="toast" data-v="Would move this initiative to ${esc(nextName)}">Move to ${esc(nextName)} ${SVG.arrow}</button>
    </section>` : `
    <section class="card"><h3>Outcome</h3><div class="kv" style="border-top:0;margin-top:0;padding-top:0"><span>Result</span><b>${o.kind === 'won' ? 'Closed won' : 'Closed lost'}</b></div>
      <div class="kv" style="border-top:0;margin-top:0;padding-top:8px"><span>Closed</span><b>${dd(o.close)}</b></div>
      ${o.kind === 'lost' ? `<div class="kv" style="border-top:0;margin-top:0;padding-top:8px"><span>Loss reason</span><b>${esc(o.reason)}</b></div>` : ''}</section>`;
  return `${ns}
    <section class="card"><h3>Account</h3><div class="acc"><span class="av">${ini(o.acc)}</span><div><a href="#" data-act="acc">${esc(o.acc)}</a><small>${D.sell.vertical} · ${D.geo} · ${D.existing ? 'Customer' : 'Prospect'}</small></div></div>
      <div class="links"><button class="link" data-act="toast" data-v="Would list the other ${others} initiatives at ${esc(o.acc)}">Other initiatives${others ? ` (${others})` : ''}</button><button class="link" data-act="acc">Account 360°</button></div></section>
    <section class="card"><h3>Team</h3><div class="mem">${CRM.avatar(o.owner)}<div><b>${esc(o.owner)}</b><small>Sales owner · ${esc(o.team)}</small></div></div>
      <button class="btn" data-act="toast" data-v="Would open Add contributor">${SVG.plus}Add contributor</button></section>`;
}

function render() {
  if (!o) { $('#main').innerHTML = `<a class="back" href="initiatives.html">${SVG.back}Sales initiatives</a><div class="card" style="margin-top:20px"><div class="empty" style="padding:72px 12px"><b>Initiative not found</b>No record ${esc(id)} in this demo.</div></div>`; return; }
  const body = { overview, items: itemsTab, contacts: contactsTab, activities: activitiesTab, tasks: tasksTab, history: historyTab, files: filesTab }[T.tab] || overview;
  $('#main').innerHTML = `${header()}<div class="rec-grid"><div class="rec-main">${tabsBar()}${body()}</div><aside class="rail">${rail()}</aside></div>`;
}

$('#main').addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act !== 'tk') e.preventDefault();
  if (act === 'tab') { T.tab = a.dataset.v; history.replaceState(null, '', '#' + T.tab); render(); }
  else if (act === 'atype') { T.actType = a.dataset.v; render(); }
  else if (act === 'road') { T.road = a.dataset.v; render(); }
  else if (act === 'tk') { T.tasks[+a.dataset.v].done = a.checked; render(); }
  else if (act === 'acc') toast(`Would open the ${o.acc} account`);
  else if (act === 'toast') toast(a.dataset.v);
});
$('#main').addEventListener('submit', (e) => {
  if (e.target.id !== 'tk-form') return;
  e.preventDefault();
  const t = $('#tk-t').value.trim(), d = $('#tk-d').value, err = $('#tk-err');
  const miss = [!t && 'a title', !d && 'a due date'].filter(Boolean);
  if (miss.length) { err.textContent = `Enter ${miss.join(' and ')} first.`; err.hidden = false; return; }
  T.tasks.unshift({ t, d, a: $('#tk-a').value, done: false }); render(); toast('Task added');
});
$('#main').addEventListener('input', (e) => { if (e.target.closest('#tk-form')) { const err = $('#tk-err'); if (err) err.hidden = true; } });

if (o) { D = details(o); document.title = `${o.name} · BCT CRM`; }
CRM.renderShell('initiatives');
render();
</script>
</body>
</html>
