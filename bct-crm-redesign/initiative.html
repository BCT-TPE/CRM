<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales initiative · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">

<link rel="stylesheet" href="assets/crm.css?v=20261124k">

<style>
/* ---------- Page: one Sales initiative (the level below the Sales initiatives list) ----------
   Same content as the CRMpulse record page: header + actions, stage stepper, key facts, seven tabs,
   and a right rail with next steps, account and team. Visual language = the rest of the redesign. */
.back { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--t3); text-decoration: none; }
.back:hover { color: var(--deep); }
.back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.back b { font-weight: 500; color: var(--t2); }
.rec-head { display: flex; align-items: flex-start; gap: 24px; margin: 4px 0 20px; }
.rec-t { flex: 1; min-width: 0; }
.rec-t h1 { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; font-size: var(--text-4xl); font-weight: 400; letter-spacing: -.03em; line-height: 1.15; color: var(--ink); }
.rec-t h1 .st { transform: translateY(3px); }
.rec-t h1 .st, .rec-t h1 .pill { letter-spacing: 0; } /* don't inherit the title's tight tracking */
.rec-acts { position: relative; }
.more-pop { top: 44px; right: 0; width: 280px; padding: 6px; }
.more-pop .mi { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 9px 12px; border: 0; border-radius: var(--radius-control); background: none; text-align: left; font: inherit; font-size: var(--text-sm); color: var(--t1); cursor: pointer; }
.more-pop .mi:hover { background: var(--hover); }
.more-pop .mi small { font-size: var(--text-xs); color: var(--t3); }
.more-pop .mi[aria-disabled="true"] { color: var(--t3); cursor: not-allowed; }
.more-pop .mi[aria-disabled="true"]:hover { background: none; }
.more-pop hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line); }
.rec-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--text-sm); color: var(--t3); }
.rec-meta a { color: var(--deep); font-weight: 500; text-decoration: none; }
.rec-meta a:hover { text-decoration: underline; }
.rec-acts { display: flex; gap: 8px; flex: none; padding-top: 4px; }
.btn.icon-only { width: 36px; padding: 0; justify-content: center; }

.st { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 600; white-space: nowrap; }
.st.Prospect { background: var(--cyan-50); color: var(--cyan-text); } .st.Lead { background: var(--ice); color: var(--cyan-text); } .st.Opportunity { background: var(--info-bg); color: var(--deep); }
.st.won { background: var(--chart-pipe-soft); color: var(--ink); } .st.lost { background: var(--hover); color: var(--t3); }

/* Stage stepper */
.stepper { display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; }
.step-k { display: flex; flex-direction: column; flex: none; font-size: var(--text-xs); color: var(--t3); }
.step-k b { font-size: var(--text-xs); font-weight: 600; color: var(--deep); letter-spacing: .02em; }
.steps { flex: 1; min-width: 0; display: flex; }
.stp { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; height: 36px; padding: 0 10px 0 18px; font-size: var(--text-xs); color: var(--t3); background: var(--field);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%); white-space: nowrap; overflow: hidden; }
.stp:first-child { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); border-radius: var(--radius-md) 0 0 var(--radius-md); padding-left: 12px; }
.stp + .stp { margin-left: -6px; }
.stp span { overflow: hidden; text-overflow: ellipsis; }
.stp svg { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.stp.done { background: var(--info-bg); color: var(--deep); }
.stp.cur { flex: 0 0 auto; padding-right: 20px; /* full name of the current stage */ background: var(--deep); color: var(--on-dark); font-weight: 600; }
.stp.lost { background: var(--chart-pipe-soft); color: var(--t1); font-weight: 600; }
.sum-card { padding: 0; }
.sum-card .stepper { border-bottom: 1px solid var(--line); }
.facts { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px 24px; padding: 18px 24px 20px; } /* labels top-aligned */
.facts .f { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; } /* equal widths, fill the card */
.facts .f.val { flex-grow: 1.8; } /* value gets more room so local + USD stay on one line */
.sum-card .facts .f > b { margin-top: auto; padding-top: 4px; } /* labels on top, values on one bottom line */
.facts .f small { display: block; font-size: var(--text-xs); color: var(--t3); }
.facts .f b { display: block; margin-top: 4px; font-size: var(--text-lg); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.facts .f.val b { font-size: var(--text-3xl); font-weight: 400; letter-spacing: -.02em; line-height: 1.1; }
.facts .f.val b { white-space: nowrap; }
.facts .f.val em { display: inline; margin-top: 0; font-style: normal; margin-left: 6px; font-size: var(--text-sm); color: var(--t3); letter-spacing: 0; }
.facts .f-attn { flex-basis: 100%; margin-left: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--t3); }
.facts .hot { color: var(--danger); }

/* Body: tabs + rail */
.rec-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; margin-top: 16px; }
.rec-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.rec-tabs { display: flex; gap: 0; padding: 6px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line-2); }
.rtab { flex: 1 1 0; justify-content: center; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; white-space: nowrap; min-width: 0; border: 0; border-radius: var(--radius-control); background: none; font: inherit; font-size: var(--text-sm); color: var(--t2); cursor: pointer; }
.rtab:hover { background: var(--hover); color: var(--ink); }
.rtab.on { background: var(--deep); color: var(--on-dark); font-weight: 500; }
.rtab .tab-n { background: var(--hover); }
.rtab.on .tab-n { background: color-mix(in srgb, var(--surface) 20%, transparent); color: var(--on-dark); }
.card-h .r .btn { height: 32px; }

.dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 24px; }
.dl div { min-width: 0; }
.dl dt { font-size: var(--text-xs); color: var(--t3); }
.dl dd { margin: 4px 0 0; font-size: var(--text-sm); color: var(--ink); }
.bant { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.bt { display: flex; gap: 10px; padding: 14px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); }
.bt i { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: var(--radius-full); background: var(--ok-bg); color: var(--ok); }
.bt i svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bt.miss i { background: var(--hover); color: var(--t3); }
.bt small { display: block; font-size: var(--text-xs); color: var(--t3); }
.bt b { display: block; margin-top: 2px; font-size: var(--text-sm); font-weight: 500; color: var(--ink); }
.bt.miss b { color: var(--t3); font-weight: 400; }
.sell { display: flex; flex-wrap: wrap; gap: 10px; }
.sell div { padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); }
.sell small { display: block; font-size: var(--text-xs); color: var(--t3); }
.sell b { display: block; margin-top: 2px; font-size: var(--text-sm); font-weight: 500; color: var(--ink); }
.desc { margin: 0; font-size: var(--text-sm); color: var(--t1); }

.tbl.li col.c-i { width: 4%; } .tbl.li col.c-n { width: 30%; } .tbl.li col.c-c { width: 24%; } .tbl.li col.c-q { width: 7%; } .tbl.li col.c-u { width: 11%; } .tbl.li col.c-a { width: 12%; } .tbl.li col.c-t { width: 12%; }
.tbl.li tbody tr { cursor: default; }
.tbl.li tfoot td { padding: 14px 10px; border-top: 1px solid var(--line); font-weight: 600; color: var(--ink); }
.tbl.li tfoot td:first-child { padding-left: 24px; } .tbl.li tfoot td:last-child { padding-right: 24px; }
.tbl.li tfoot small { display: block; font-size: var(--text-xs); font-weight: 400; color: var(--t3); }

.ct { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.ct:first-of-type { border-top: 0; padding-top: 0; }
.av { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
.acc .av { background: var(--info-bg); color: var(--deep); }
.ct b { font-size: var(--text-sm); font-weight: 500; color: var(--ink); }
.ct small { display: block; font-size: var(--text-xs); color: var(--t3); margin-top: 2px; }
.role { display: inline-flex; height: 20px; align-items: center; padding: 0 7px; margin-left: 8px; border-radius: var(--radius-sm); background: var(--hover); font-size: var(--text-2xs); font-weight: 600; color: var(--t2); }
.role.dm { background: var(--info-bg); color: var(--deep); }
.ct-acts { display: flex; gap: 8px; }
.foot-note { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--text-xs); color: var(--t3); }
.foot-note a { color: var(--deep); text-decoration: none; }

.chips { display: flex; gap: 6px; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-pill); background: var(--surface); font: inherit; font-size: var(--text-sm); color: var(--t2); cursor: pointer; }
.chip.on { background: var(--midnight); border-color: var(--midnight); color: var(--on-dark); }
.chip small { font-size: var(--text-2xs); opacity: .75; }
/* Period blocks, as on the Activities page: a clear heading, a rule between blocks, the line runs dot to dot inside a block */
.tlg + .tlg { margin-top: 28px; }
.tl-g { display: flex; align-items: baseline; gap: 8px; margin: 0 0 14px; font-size: var(--text-lg); font-weight: 600; color: var(--ink); }
.tl-g small { font-size: var(--text-xs); font-weight: 500; color: var(--t3); }
.tl { display: grid; grid-template-columns: 96px 18px minmax(0, 1fr); gap: 14px; padding-bottom: 18px; }
.tl:last-child { padding-bottom: 0; }
.tl-d { text-align: left; font-size: var(--text-xs); color: var(--t3); line-height: 1.4; white-space: nowrap; }
.tl-d b { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--t1); }
.tl-d .wd { font-weight: 400; color: var(--t3); }
.tl-dot { position: relative; display: flex; justify-content: center; }
.tl-dot::before { content: ""; position: relative; z-index: 1; width: 10px; height: 10px; margin-top: 5px; border-radius: var(--radius-full); background: var(--deep); box-shadow: 0 0 0 3px var(--info-bg); }
.tl:not(:last-child) .tl-dot::after { content: ""; position: absolute; top: 10px; bottom: -28px; width: 2px; border-radius: 1px; background: var(--line-2); } /* dot centre to the next dot centre (5px + 5px half dot; 18px row gap) */
.tl-b b { font-size: var(--text-sm); font-weight: 500; color: var(--ink); }
.tl-b p { margin: 4px 0 0; font-size: var(--text-sm); color: var(--t2); }
.tl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tl-tags span { display: inline-flex; height: 20px; align-items: center; padding: 0 7px; border-radius: var(--radius-sm); background: var(--hover); font-size: var(--text-2xs); font-weight: 500; color: var(--t2); white-space: nowrap; }

.li-card { padding-bottom: 0; overflow: hidden; } /* the total row closes the card */
.li-card .tbl-wrap { margin-bottom: 0; }
.tbl.li tfoot td { border-bottom: 0; padding-bottom: 18px; }
.tk-form { display: grid; grid-template-columns: minmax(0, 1fr) 170px 200px auto; gap: 8px; align-items: center; padding: 12px; border-radius: var(--radius-lg); background: var(--field); }
.tk-form .in { min-width: 0; }
.tk-form .btn { height: 40px; } /* same inputs and custom select as the edit form */
.tk-err { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--danger); }
.tk { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.tk input { width: 16px; height: 16px; accent-color: var(--deep); margin: 0; }
.tk b { font-size: var(--text-sm); font-weight: 500; color: var(--ink); } .tk.done b { color: var(--t3); text-decoration: line-through; font-weight: 400; }
.tk small { font-size: var(--text-xs); color: var(--t3); }

.sum3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.sm3 { padding: 14px 16px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); }
.sm3 small { display: block; font-size: var(--text-xs); color: var(--t3); }
.sm3 b { display: block; margin: 4px 0 2px; font-size: var(--text-xl); font-weight: 500; letter-spacing: -.01em; color: var(--ink); }
.sm3 b.warn { color: var(--warn); }
.sm3 span { font-size: var(--text-xs); color: var(--t3); }
.road { position: relative; padding: 84px 28px 44px; border-radius: var(--radius-lg); background: var(--field); overflow-x: auto; }
.road-line { position: relative; display: flex; align-items: center; height: 12px; border-radius: var(--radius-sm); background: var(--midnight); min-width: 520px; }
.road-node { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; display: grid; place-items: center; border-radius: var(--radius-full); background: var(--deep); border: 3px solid var(--surface); color: var(--on-dark); font-size: var(--text-2xs); font-weight: 700; }
.road-node.cur { background: var(--cyan); }
.road-lab { position: absolute; bottom: 22px; transform: translateX(-50%); width: 120px; text-align: center; font-size: var(--text-xs); color: var(--t3); line-height: 1.35; }
.road-lab b { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--ink); }
.road-dur { position: absolute; top: 50%; transform: translate(-50%, -50%); height: 18px; padding: 0 6px; border-radius: var(--radius-control); background: var(--surface); font-size: var(--text-2xs); font-weight: 600; color: var(--ink); line-height: 18px; }
.road-dur.long { background: var(--warn-soft); color: var(--warn-text); }
.road-start { position: absolute; left: 28px; bottom: 14px; font-size: var(--text-2xs); font-weight: 600; letter-spacing: .04em; color: var(--t3); }
.road-lg { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: var(--text-xs); color: var(--t3); }
.road-lg span { display: inline-flex; align-items: center; gap: 6px; }
.road-lg i { width: 10px; height: 10px; border-radius: var(--radius-full); background: var(--info-bg); box-shadow: inset var(--ring-select); }
.road-lg em { font-style: normal; height: 16px; padding: 0 6px; border-radius: var(--radius-md); background: var(--warn-soft); color: var(--warn-text); font-weight: 600; font-size: var(--text-2xs); line-height: 16px; }

.drop { display: grid; place-items: center; gap: 6px; padding: 32px 16px; border: 1.5px dashed var(--line-3); border-radius: var(--radius-lg); background: var(--field); text-align: center; font-size: var(--text-sm); color: var(--t3); cursor: pointer; }
.drop:hover { border-color: var(--deep); color: var(--deep); }
.drop svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.drop b { color: var(--deep); font-weight: 500; }

/* v2: pill tabs and stepper on glass, owner avatars use the shared tints */
.v2 .rec-tabs { border-radius: var(--radius-pill); padding: 3px; border-color: var(--surface); background: var(--glass); box-shadow: var(--shadow-card); }
.v2 .rtab { border-radius: var(--radius-pill); }
.v2 .rtab.on { background: var(--midnight); }
.v2 .stp.cur { background: var(--midnight); }
.v2 .ns { background: var(--grad-tint); border-color: var(--surface); }
.v2 .ns-h i { background: var(--midnight); }
/* Next steps uses the same tinted hero style as the forecast card; boxes and secondary buttons go white on the tint */
body.v2 .card.ns .in.in-ro, body.v2 .card.ns .in:disabled { background: var(--glass-soft); border-color: var(--surface); }
body.v2 .card.ns .chk i { background: var(--glass); }
body.v2 .card.ns .chk.ok i { background: var(--ok-bg); }
.v2 .req { border-color: var(--surface); background: var(--glass); }
.v2 .bt, .v2 .sell div, .v2 .sm3 { border-color: var(--line); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.v2 .road { background: color-mix(in srgb, var(--chart-track) 60%, transparent); }

/* ---------- Edit mode (?mode=edit): every field is an input; locked fields are disabled inputs with the reason under them ---------- */
.ed-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; margin-top: 16px; }
.ed-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ed-sec .card-h { margin-bottom: 18px; }
.ed-sec .card-h .r .btn { height: 32px; }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
.fg.g3 { grid-template-columns: 1.3fr 1fr .6fr; }
.fg.g1 { grid-template-columns: 1fr; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fld > .lab { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: 500; color: var(--ink); }
.fld > .lab .rq { color: var(--danger); }
.fld > .lab .chg { width: 7px; height: 7px; border-radius: var(--radius-full); background: var(--cyan); }
.fld > .lab .lk { margin-left: auto; display: inline-flex; color: var(--t3); }
.lk svg, .in-lock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fg .fld .btn { height: 40px; } /* same height as the fields beside it */
.in { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-control); background: var(--surface); font: inherit; font-size: var(--text-sm); color: var(--ink); outline: none; }
.in:hover { border-color: var(--line-3); }
.in:focus { border-color: var(--deep); }
textarea.in { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.in:disabled, .in[readonly] { background: var(--field); color: var(--t2); border-color: var(--line); cursor: not-allowed; }
.in-wrap { position: relative; }
.in-wrap .in-lock { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--t3); display: inline-flex; }
.in-wrap .in-lock + .in { padding-left: 36px; }
.in-wrap .in-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: var(--text-sm); color: var(--t3); }
.fld .help { font-size: var(--text-xs); color: var(--t3); }
.fld .help .link { font-size: var(--text-xs); }
.fld .err { font-size: var(--text-xs); color: var(--danger); }
.fld.bad .in, .fld.bad .fsel, body.v2 .fld.bad label.select.fsel { border-color: var(--danger); } /* the v2 select rule would win otherwise */
body.v2 label.select.fsel { display: flex; width: 100%; height: 40px; border-radius: var(--radius-control); border-color: var(--line-2); background: var(--surface); box-shadow: none; }
body.v2 label.select.fsel:hover { background: var(--surface); border-color: var(--line-3); }
.fsel .sel-btn { max-width: none; width: 100%; padding-left: 12px; font-weight: 400; color: var(--ink); }
.fsel .sel-pop { max-height: 280px; }
.picks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; font-size: var(--text-xs); color: var(--t3); }
.picks button { height: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--radius-pill); background: var(--surface); font: inherit; font-size: var(--text-xs); color: var(--t1); cursor: pointer; }
.picks button:hover { border-color: var(--deep); color: var(--deep); }
.ed-note { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: var(--text-xs); color: var(--t3); }
.ed-note svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ed-sec .stepper { padding: 0; }
.fold { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.fold h2 { margin: 0; font-size: var(--text-md); font-weight: 600; color: var(--ink); }
.fold p { margin: 4px 0 0; font-size: var(--text-xs); color: var(--t3); }
.fold svg { margin-left: auto; width: 18px; height: 18px; flex: none; fill: none; stroke: var(--t3); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }

  // Activities come from the shared list (assets/crm-data.js), the same ones the Activities page shows
  const acts = ACTIVITIES.filter(a => a.si === o.id).map(a => ({ d: a.d, t: a.t, type: a.type, purpose: a.purpose, note: a.note, who: a.who }));
  return { lotus, created, existing, sell, geo, region: o.acc === 'Lotus Retail India' ? 'India North' : pick(REGION[geo], o.acc), items, total, fmtL, bant, contacts, path, acts,
    leadType: lotus ? 'Existing account new lead' : existing ? 'Existing account new lead' : 'New account new lead',
    source: lotus ? 'Event / conference' : pick(['Event / conference', 'Referral', 'Website', 'Partner', 'Outbound'], o.id),
    category: lotus ? 'New customer – new business' : existing ? 'Existing customer – new business' : 'New customer – new business',
    modified: lotus ? '2026-10-29' : path[path.length - 1][1] };
}

// ---- Render ----
const T = { tab: (location.hash || '#overview').slice(1), road: 'road', actType: 'All', tasks: [], more: false, edit: new URLSearchParams(location.search).get('mode') === 'edit' };
const TABS = [['overview', 'Overview'], ['items', 'Line items'], ['contacts', 'Contacts'], ['activities', 'Activities'], ['tasks', 'Tasks'], ['history', 'Stage history'], ['files', 'Attachments']];
let D;

// One skeleton, two states. View shows values; edit swaps the same fields, in the same places, for inputs.
const ED = () => T.edit;
const val = (k) => (ED() ? E.v : saved())[k];
function saved() {
  const b = Object.fromEntries(D.bant.map(([k, v]) => [k.toLowerCase(), v || '']));
  return { owner: o.owner, offering: D.sell.off, name: o.name, close: o.close || '', prob: String(o.prob), next: o.next || '', follow: o.follow || '',
    need: b.need, budget: b.budget, authority: b.authority, timeline: b.timeline, remarks: D.remarks || '',
    leadType: D.leadType, source: D.source, category: D.category, team: o.team, geo: D.geo, region: D.region,
    sbu: D.sell.sbu, practice: D.sell.practice, tech: D.sell.tech, vertical: D.sell.vertical, desc: D.desc || `${D.sell.off} for ${o.acc}.` };
}
// A field: same wrapper and label in both states; view = value, edit = control (or a disabled input when locked)
function F(k, view, ctl, opts = {}) {
  if (ED()) return ctl === 'lock' ? lockedF(opts.label || LABEL[k], opts.lockVal != null ? opts.lockVal : view, opts.lockHelp || '', opts) : fld(k, ctl, opts);
  const empty = view == null || view === '';
  return `<div class="fld ${opts.full ? 'full' : ''}"><span class="lab">${opts.label || LABEL[k] || k}</span><div class="in in-ro ${empty ? 'muted' : ''} ${opts.multi ? 'multi' : ''}">${empty ? (opts.empty || '—') : view}</div></div>`;
}
const lockedF = (label, v, help, opts = {}) => `<div class="fld ${opts.full ? 'full' : ''}"><span class="lab">${label}<span class="lk">${LOCK}</span></span><div class="in-wrap"><span class="in-lock">${LOCK}</span><input class="in" value="${esc(String(v).replace(/<[^>]+>/g, ''))}" disabled aria-label="${esc(label)}">${opts.suffix ? `<span class="in-suffix">${opts.suffix}</span>` : ''}</div>${help ? `<span class="help">${help}</span>` : ''}</div>`;

// Spec conditions to move forward (CRM V1 §5.4 for a lead becoming an opportunity; need, value and close date between opportunity stages)
function gate() {
  if (o.kind !== 'open') return null;
  const need = (val('need') || '').trim(), close = val('close');
  return o.status === 'Opportunity'
    ? [['Specific requirement (Need)', !!need], ['Estimated value', o.value > 0], ['Expected close date', !!close]]
    : [['Account identified', !!o.acc], ['Specific requirement (Need)', !!need], ['Estimated value', o.value > 0]];
}
function gateHtml() {
  const g = gate(); if (!g) return '';
  const st = stepsOf(o).list, nextName = st[st.indexOf(o.sub) + 1], ok = g.filter(x => x[1]).length;
  const to = o.status === 'Opportunity' ? `To reach ${esc(lc(nextName))}` : 'To convert to an opportunity'; // §5.4 conditions apply to conversion, not to prospect / lead sub-stages
  return `<p class="ns-to">${to}<span class="pill ${ok === g.length ? 'ok' : 'warn'}">${ok}/${g.length}</span></p>
    ${g.map(([t, d]) => `<div class="chk ${d ? 'ok' : ''}"><i>${d ? SVG.check : ''}</i><span>${t}</span></div>`).join('')}
    <p class="ns-foot">Checked when you use change stage.</p>`;
}

function header() {

  }).join('');

  const local = localAmount(o.value, o.cur);

    <div class="back-bar"><a class="back" href="initiatives.html">${SVG.back}Sales initiatives<span>·</span><b>${o.id}</b>${ed ? '<span>·</span>Edit' : ''}</a></div>

        <div class="rec-meta"><a href="#" data-act="acc">${esc(o.acc)}</a><span>${esc(o.owner)} · ${esc(o.team)}</span><span>${D.geo} › ${D.region}</span></div>
      </div>
      ${ed ? '' : `<div class="rec-acts">
        <button class="btn" data-act="edit">${SVG.edit}Edit</button>

        <button class="btn icon-only" aria-label="More actions" aria-haspopup="menu" aria-expanded="${T.more}" data-act="more">${SVG.more}</button>
        <div class="pop more-pop" role="menu" ${T.more ? '' : 'hidden'}>

          <button class="mi" role="menuitem" ${closed ? 'data-act="toast" data-v="Would start a follow-on initiative"' : 'aria-disabled="true"'}>Follow-on initiative<small>${closed ? 'Start the next initiative for this account' : 'Available after closing'}</small></button>
          <hr>

          <button class="mi" role="menuitem" data-act="toast" data-v="Would put this initiative on hold">Put on hold</button>

        </div>

    </header>
    <section class="card sum-card ${ed ? 'editing' : ''}" aria-label="Summary">
      <div class="steps2" style="--n:${n}" aria-label="${st.label} stages" ${ed ? 'data-tip="Use Change stage so the change is logged in stage history."' : ''}>
        <ol>${steps}</ol>

        <div class="sp-now">${o.kind === 'open' ? `Step ${cur + 1} of ${n} · <b>${esc(st.list[cur])}</b>` : o.kind === 'won' ? '<b>Closed won</b>' : `<b>Closed lost</b> · after ${esc(lostAt)}`}</div>
      </div>
      <div class="facts">
        ${ed ? `<div class="f">${lockedF('Value', local || money(o.value), `${local ? money(o.value) + ' · ' : ''}${D.items.length} line item${D.items.length === 1 ? '' : 's'} · <button class="link" data-act="toast" data-v="Would open the line item editor">Edit line items</button>`, {})}</div>`
          : `<div class="f val"><small>Value</small><b>${local || money(o.value)}${local ? `<em>${money(o.value)}</em>` : ''}</b></div>`}
        ${ed && !closed ? factEdit('prob', `<div class="in-wrap"><input class="in" type="number" min="0" max="100" data-f="prob" value="${esc(E.v.prob)}" aria-label="Probability"><span class="in-suffix">%</span></div>`, probHelp())
          : `<div class="f"><small>Probability</small><b>${o.prob}%</b></div>`}
        <div class="f"><small>Funnel code</small><b>${o.code || '—'}</b></div>
        ${ed && !closed ? factEdit('close', inp('close', 'date'), closeHelp())
          : `<div class="f"><small>${closed ? 'Closed' : 'Expected close'}</small><b class="${passed ? 'hot' : ''}">${o.close ? dd(o.close) : 'Not set'}</b></div>`}
        <div class="f"><small>Created</small><b>${dd(D.created)}</b></div>
        <div class="f"><small>${closed ? 'Took' : 'Open for'}</small><b>${openDays} days</b></div>

// Same period blocks as the Activities page: this week, last week, then by month (newest first)
function tlGroups(list) {
  const ws = new Date(TODAY.getTime() - ((TODAY.getDay() + 6) % 7) * DAY), g = [];
  list.slice().sort((x, y) => y.d.localeCompare(x.d)).forEach(a => { const d = new Date(a.d.slice(0, 10));
    const k = d >= ws ? 'This week' : d >= new Date(ws.getTime() - 7 * DAY) ? 'Last week' : d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    if (!g.length || g[g.length - 1][0] !== k) g.push([k, []]); g[g.length - 1][1].push(a); });
  return g;
}

function historyTab() {
  const end = o.kind === 'open' ? TODAY : new Date(o.close);
  const segs = D.path.map(([n, d], i) => ({ n, d, days: Math.max(0, Math.round(((i < D.path.length - 1 ? new Date(D.path[i + 1][1]) : end) - new Date(d)) / DAY)), cur: i === D.path.length - 1 && o.kind === 'open' }));
  const total = Math.round((end - D.created) / DAY);
  const done = segs.filter(s => !(s.cur));
  const longest = (done.length ? done : segs).slice().sort((a, b) => b.days - a.days)[0];
  const oppSegs = segs.filter(s => STAGES.some(x => x.name === s.n) || /Closed/.test(s.n));
  const oppDays = oppSegs.length ? Math.round((end - new Date(oppSegs[0].d)) / DAY) : 0;
  const first = D.path[0][0], skipped = STAGES.some(x => x.name === first) ? 'Prospect and lead stages were skipped: it was created as an opportunity' : PRE_STAGES.Lead.includes(first) ? 'The prospect stage was skipped: it was created as a lead' : '';
  const n = segs.length, pos = (i) => n === 1 ? 50 : 10 + i * 80 / (n - 1);
  const startAs = STAGES.some(x => x.name === first) ? 'opportunity' : PRE_STAGES.Lead.includes(first) ? 'lead' : 'prospect';
  const road = `<div class="steps2 jr" style="--n:${n}" aria-label="Stage journey"><ol>
      ${segs.map((s, i) => `<li class="sp ${s.cur ? 'cur' : 'done'}"><span class="sp-dot">${i + 1}</span><span class="sp-lab"><b>${esc(s.n)}</b>${dd(s.d)}<em class="jr-d ${s === longest ? 'long' : ''}">${s.days}d${s.cur ? ' so far' : ''}</em></span></li>`).join('')}
    </ol><div class="sp-bar"><i style="width:${o.kind === 'open' && n > 1 ? (100 * (n - 0.5) / n).toFixed(1) : 100}%"></i></div>
    <div class="jr-start">Start · created as ${startAs}</div></div>
    <div class="road-lg"><span><i></i>Stage entered</span><span><em>${longest.days}d</em>Longest stretch</span>${skipped ? `<span>${skipped}</span>` : ''}</div>`;
  const list = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Stage</th><th>Entered</th><th class="r">Days in stage</th></tr></thead>
    <tbody>${segs.map((s, i) => `<tr style="cursor:default"><td class="muted">${i + 1}</td><td class="t-main">${esc(s.n)}</td><td>${dd(s.d)}</td><td class="r num ${s === longest ? 'hot' : ''}">${s.days}${s.cur ? ' so far' : ''}</td></tr>`).join('')}</tbody></table></div>`;
  return `<section class="card"><div class="card-h"><div><h2>The journey so far</h2><p>Every stage this initiative passed through, and how long it stayed</p></div>
      <div class="r"><div class="seg">${[['road', 'Road'], ['list', 'List']].map(([k, l]) => `<button class="${T.road === k ? 'on' : ''}" data-act="road" data-v="${k}">${l}</button>`).join('')}</div></div></div>
    <div class="sum3">
      <div class="sm3"><small>${o.kind === 'open' ? 'Open for' : 'Took'}</small><b>${total} days</b><span>${dd(D.created)} → ${o.kind === 'open' ? 'today' : dd(o.close)}</span></div>
      <div class="sm3"><small>As an opportunity</small><b>${oppDays ? oppDays + ' days' : '—'}</b><span>${oppSegs.length} stage${oppSegs.length === 1 ? '' : 's'}</span></div>
      <div class="sm3"><small>Longest stage</small><b class="warn">${longest.days} days</b><span>${esc(longest.n)}</span></div>
    </div>
    ${T.road === 'road' ? road : list}</section>`;
}

function filesTab() {
  return `<section class="card"><div class="card-h"><div><h2>Attachments</h2><p>Proposals, contracts and qualification documents</p></div></div>
    <div class="drop" data-act="toast" data-v="Would open the file picker">${SVG.up}<span>Drop files here or <b>browse</b></span><small>PDF, Word, Excel, PowerPoint, CSV, text or images</small></div>
    <div class="empty" style="padding-bottom:8px">No attachments yet.</div></section>`;
}

function rail() {
  const v = ED() ? E.v : saved(), ed = ED();
  const st = stepsOf(o).list, nextName = o.kind === 'open' ? st[st.indexOf(o.sub) + 1] : null;
  const late = !ed && o.follow && new Date(o.follow) < TODAY;
  const others = INITS.filter(x => x.acc === o.acc && x.id !== o.id).length;
  const ns = o.kind === 'open' ? `
    <section class="card ns tint"><div class="ns-h"><b>Next steps</b></div>
      <div class="fg g1 ns-rec">
        ${F('next', v.next ? esc(v.next) : '', inp('next', 'text', 'What happens next?'), { label: 'Next step on record', empty: '<span class="none">None recorded</span>' })}
        ${ed && REQ[o.sub] ? `<div class="picks">Suggestions:${REQ[o.sub].map(([t]) => `<button type="button" data-act="pick" data-v="${esc(t)}">${t}</button>`).join('')}</div>` : ''}
        ${F('follow', v.follow ? `<span class="${late ? 'hot' : ''}">${dd(v.follow)}${late ? ' · overdue' : ''}</span>` : '', inp('follow', 'date'), { label: 'Next follow-up' })}
      </div>
      <div id="gate">${gateHtml()}</div>
      ${ed ? '' : `<button class="btn" data-act="edit" data-v="next">Set next step &amp; follow-up</button>
      <button class="btn primary" data-act="toast" data-v="Would move this initiative to ${esc(lc(nextName))}">Move to ${esc(lc(nextName))} ${SVG.arrow}</button>`}
    </section>` : `
    <section class="card"><h3>Outcome</h3><div class="kv" style="border-top: 0;margin-top:0;padding-top:0"><span>Result</span><b>${o.kind === 'won' ? 'Closed won' : 'Closed lost'}</b></div>
      <div class="kv" style="border-top: 0;margin-top:0;padding-top:8px"><span>Closed</span><b>${dd(o.close)}</b></div>
      ${o.kind === 'lost' ? `<div class="kv" style="border-top: 0;margin-top:0;padding-top:8px"><span>Loss reason</span><b>${esc(o.reason)}</b></div>` : ''}</section>`;
  const account = ed ? lockedF('Account', o.acc, o.status === 'Opportunity' ? 'Locked for opportunities · use split / duplicate to move it.' : 'Locked after the initiative is created.')
    : `<div class="fld"><span class="lab">Account</span><div class="acc"><span class="av">${ini(o.acc)}</span><div><a href="#" data-act="acc">${esc(o.acc)}</a><small>${D.sell.vertical} · ${D.geo} · ${D.existing || o.kind === 'won' ? 'Customer' : 'Prospect'}</small></div></div>
       <div class="links"><button class="link" data-act="toast" data-v="Would list the other ${others} initiatives at ${esc(o.acc)}">Other initiatives${others ? ` (${others})` : ''}</button><button class="link" data-act="acc">Account 360°</button></div></div>`;
  return `${ns}
    <section class="card"><h3>Account &amp; team</h3><div class="fg g1">
      ${account}
      ${F('owner', `<div class="mem">${CRM.avatar(v.owner)}<div><b>${esc(v.owner)}</b><small>Sales owner</small></div></div>`, sel('owner'), { req: true, help: 'Not restricted by team, geography or classification.' })}
      ${F('team', esc(v.team), sel('team'), { help: 'Automatic when the owner is in one team.' })}
      <div class="fg">${F('geo', esc(v.geo), sel('geo'))}${F('region', esc(v.region), sel('region'))}</div>
      <div class="fld"><span class="lab">Contributors <span class="muted" style="font-weight:400;font-size: var(--text-xs)">· no booking credit</span></span><div class="contrib"><button class="btn" data-act="toast" data-v="Would open add contributor">${SVG.plus}Add contributor</button></div></div>
    </div></section>`;
}

/* ---------- Edit mode ---------- */
const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
const CHEV_D = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const OPT = {
  owner: () => [...new Set(Object.values(TEAMS).flatMap(t => t.people))].sort(),
  offering: () => [...new Set(INITS.map(x => x.name.split(' – ').slice(1).join(' – ')).filter(Boolean))].sort(),
  leadType: () => ['New account new lead', 'Existing account new lead'],
  source: () => ['Event / conference', 'Referral', 'Website', 'Partner', 'Outbound'],
  category: () => ['New customer – new business', 'Existing customer – new business'],
  team: () => Object.keys(TEAMS),
  geo: () => Object.keys(REGION),
  region: (v) => REGION[v.geo] || [],
  sbu: () => ['Enterprise applications', 'Cloud & infrastructure', 'Cybersecurity', 'Data & AI'],
  practice: () => ['Application services', 'Cloud services', 'Security services', 'Data services'],
  tech: () => ['SAP', 'AWS', 'Okta', 'Azure OpenAI', 'Databricks', 'VMware', 'ServiceNow', '—'],
  vertical: () => ['Retail', 'Healthcare', 'Banking', 'Pharma', 'Manufacturing', 'Energy', 'Logistics', 'Facilities', 'Enterprise']
};
const LABEL = { owner: 'Sales owner', offering: 'Offering', name: 'Initiative name', close: 'Expected close', prob: 'Probability', next: 'Next step on record', follow: 'Next follow-up',
  need: 'Need', budget: 'Budget', authority: 'Authority', timeline: 'Timeline', remarks: 'Qualification remarks', leadType: 'Lead type', source: 'Lead source', category: 'Business category',
  team: 'Accountable sales team', geo: 'Geography', region: 'Region', sbu: 'SBU', practice: 'Practice / service line', tech: 'Technology', vertical: 'Vertical', desc: 'Description / remarks' };
const E = { init: null, v: null, err: {}, list: false };
function editStart() { E.init = saved(); E.v = { ...E.init }; E.err = {}; E.list = false; }
const changed = () => Object.keys(E.v).filter(k => E.v[k] !== E.init[k]);
function fld(k, ctl, { req, help, full, lock } = {}) {
  const ch = E.v && E.v[k] !== E.init[k];
  return `<div class="fld ${full ? 'full' : ''} ${E.err[k] ? 'bad' : ''}" data-fld="${k}"><span class="lab">${LABEL[k] || k}${req ? '<span class="rq">*</span>' : ''}${ch ? '<span class="chg" aria-label="Changed"></span>' : ''}${lock ? `<span class="lk">${LOCK}</span>` : ''}</span>${ctl}${E.err[k] ? `<span class="err">${E.err[k]}</span>` : help ? `<span class="help">${help}</span>` : ''}</div>`;
}
const inp = (k, type = 'text', ph = '', dis = false) => !E.v ? '' : `<input class="in" type="${type}" data-f="${k}" value="${esc(E.v[k])}" placeholder="${esc(ph)}" ${dis ? 'disabled' : ''} aria-label="${LABEL[k]}">`;
const txa = (k, ph = '') => !E.v ? '' : `<textarea class="in" data-f="${k}" placeholder="${esc(ph)}" aria-label="${LABEL[k]}">${esc(E.v[k])}</textarea>`;
const sel = (k) => { if (!E.v) return ''; const opts = OPT[k](E.v); if (E.v[k] && !opts.includes(E.v[k])) opts.unshift(E.v[k]);
  return `<label class="select fsel"><select data-f="${k}" aria-label="${LABEL[k]}">${opts.map(x => `<option ${x === E.v[k] ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`; };
const locked = (label, val, help, suffix = '') => `<div class="fld"><span class="lab">${label}<span class="lk">${LOCK}</span></span><div class="in-wrap"><span class="in-lock">${LOCK}</span><input class="in" value="${esc(val)}" disabled aria-label="${label}">${suffix ? `<span class="in-suffix">${suffix}</span>` : ''}</div><span class="help">${help}</span></div>`;

function editBar() {
  const ch = changed(), n = ch.length;
  const show = (k, x) => k === 'close' || k === 'follow' ? (x ? dd(x) : '—') : k === 'prob' ? x + '%' : x || '—';
  return `<span class="dot"></span>
    ${n ? `<button class="chg-btn" data-act="chgs" aria-expanded="${!!E.list}"><b>${n} unsaved change${n === 1 ? '' : 's'}</b>${CHEV_D}</button>` : '<b>No changes</b>'}
    <span>${n ? 'Changed fields are marked with a dot' : 'The last saved version is shown.'}</span><span class="sp"></span>
    <button class="btn ghost" data-act="cancel">Cancel</button>
    <button class="btn" data-act="discard" ${n ? '' : 'disabled'}>Discard changes</button>
    <button class="btn primary" data-act="save" ${n ? '' : 'disabled'}>Save changes</button>
    ${n && E.list ? `<div class="pop chg-pop" role="dialog" aria-label="What you changed"><h4>What you changed</h4><ul class="chg-list">${ch.map(k => `<li><b>${LABEL[k]}</b><s>${esc(show(k, E.init[k]))}</s> → ${esc(show(k, E.v[k]))}</li>`).join('')}</ul></div>` : ''}`;
}
function refreshEdit() { // keep focus while typing: only the bar, the readiness checks, BANT count and changed dots are redrawn
  if (!changed().length) E.list = false;
  const bar = $('#ed-bar'); bar.innerHTML = editBar(); bar.classList.toggle('dirty', changed().length > 0);
  const g = $('#gate'); if (g) g.innerHTML = gateHtml();
  const bn = $('#bant-n'); if (bn) { const r = ['budget', 'authority', 'need', 'timeline'].filter(k => (E.v[k] || '').trim()).length; bn.textContent = `${r} of 4 recorded`; bn.className = `pill ${r === 4 ? 'ok' : ''}`; }
  document.querySelectorAll('[data-fld]').forEach(f => { const k = f.dataset.fld, lab = f.querySelector('.lab'), dot = lab.querySelector('.chg');
    if (E.v[k] !== E.init[k] && !dot) lab.insertAdjacentHTML('beforeend', '<span class="chg" aria-label="Changed"></span>'); else if (E.v[k] === E.init[k] && dot) dot.remove(); });
}
function editSave() {
  const isOpp = o.status === 'Opportunity', closed = o.kind !== 'open';
  E.err = {};
  if (!E.v.owner) E.err.owner = 'Choose a sales owner.';
  if (!E.v.name.trim()) E.err.name = 'Enter the initiative name.';
  if (isOpp && !closed && !E.v.close) E.err.close = 'Opportunities need an expected close date.';
  if (isOpp && !E.v.need.trim()) E.err.need = 'Describe the requirement · needed for an opportunity.';
  const p = +E.v.prob; if (E.v.prob === '' || isNaN(p) || p < 0 || p > 100) E.err.prob = 'Enter 0 to 100.';
  if (!E.v.sbu) E.err.sbu = 'Choose an SBU.';
  if (Object.keys(E.err).length) { render(); toast('Check the highlighted fields', 'warn'); const bad = document.querySelector('.fld.bad'); if (bad) bad.scrollIntoView({ block: 'center' }); return; }
  const v = E.v;
  Object.assign(o, { owner: v.owner, name: v.name.trim(), close: v.close || null, prob: +v.prob, next: v.next.trim(), follow: v.follow || null, team: v.team });
  o.w = o.value * o.prob / 100;
  Object.assign(D, { leadType: v.leadType, source: v.source, category: v.category, geo: v.geo, region: v.region, remarks: v.remarks, desc: v.desc, modified: iso(TODAY) });
  Object.assign(D.sell, { off: v.offering, sbu: v.sbu, practice: v.practice, tech: v.tech, vertical: v.vertical });
  D.bant = [['Budget', v.budget || null], ['Authority', v.authority || null], ['Need', v.need || null], ['Timeline', v.timeline || null]];
  T.edit = false; history.replaceState(null, '', `?id=${encodeURIComponent(o.id)}`); document.title = `${o.name} · BCT CRM`;
  render(); scrollTo(0, 0); toast(`Changes to ${o.id} saved`, 'ok');
}
// Leaving edit mode with unsaved changes asks first: Cancel, the back link, the sidebar, the browser's back button
// (Candace, 2026-11-18). then() runs after the user discards, or after a save that passed validation.
function exitEdit() { T.edit = false; history.replaceState(null, '', `?id=${encodeURIComponent(o.id)}`); render(); scrollTo(0, 0); }
const editDirty = () => T.edit && !!E.v && changed().length > 0;
async function askUnsaved(then) {
  E.list = false; refreshEdit();
  // general wording, no field list (Candace, 2026-11-18)
  const v = await CRM.confirm({
    title: 'Save changes?',
    body: '<p>Your changes will be lost if you leave without saving.</p>',
    actions: [{ label: 'Discard', value: 'discard', kind: 'quiet' }, { label: 'Keep editing', value: null }, { label: 'Save', value: 'save', kind: 'primary' }]
  });
  if (v === 'discard') { E.v = { ...E.init }; E.err = {}; then(); toast('Changes discarded'); }
  else if (v === 'save') { editSave(); if (!T.edit) then(); }
}
CRM.guardLeave(editDirty, (url) => askUnsaved(() => CRM.leave(url)));
const STAGE_BY_NAME = Object.fromEntries(STAGES.map(x => [x.name, x]));
function closeHelp() { if (o.kind !== 'open') return 'Set when the initiative closed.'; if (!E.v.close) return 'Not set · it stays out of every quarter.'; const q = fyq(E.v.close); return `Forecast in Q${q.q} FY${q.fy.slice(0, 2)}-${q.fy.slice(2)}.`; }
function probHelp() { const st = STAGE_BY_NAME[o.sub], w = `Weighted ${money(o.value * (+E.v.prob || 0) / 100)}`; if (!st) return w; return +E.v.prob === st.prob ? `${w} · stage default` : `${w} · default ${st.prob}%`; }

function render() {
  if (!o) { $('#main').innerHTML = `<div class="back-bar"><a class="back" href="initiatives.html">${SVG.back}Sales initiatives</a></div><div class="card" style="margin-top:20px"><div class="empty" style="padding:72px 12px"><b>Initiative not found</b>No record ${esc(id)} in this demo.</div></div>`; return; }
  const body = ED() ? overview : ({ overview, items: itemsTab, contacts: contactsTab, activities: activitiesTab, tasks: tasksTab, history: historyTab, files: filesTab }[T.tab] || overview);
  const tabsX = document.querySelector('.rec-tabs')?.scrollLeft || 0;
  $('#main').innerHTML = `${header()}<div class="rec-grid ${ED() ? 'editing' : ''}"><div class="rec-main">${tabsBar()}${body()}</div><aside class="rail">${rail()}</aside></div>${ED() ? `<div class="ed-bar ${changed().length ? 'dirty' : ''}" id="ed-bar">${editBar()}</div>` : ''}`;
  CRM.enhanceSelects($('#main')); // every select on the page (edit form, task assignee) uses the custom menu
  const row = document.querySelector('.rec-tabs');
  if (row) { // scroll the row itself, never the page
    row.scrollLeft = tabsX;
    const on = row.querySelector('.rtab.on'), pad = 8;
    if (on) { const l = on.getBoundingClientRect().left - row.getBoundingClientRect().left + row.scrollLeft, r = l + on.offsetWidth; if (l < row.scrollLeft + pad) row.scrollLeft = l - pad; else if (r > row.scrollLeft + row.clientWidth - pad) row.scrollLeft = r - row.clientWidth + pad; }
  }
}

$('#main').addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (T.more && !e.target.closest('.more-pop')) { T.more = false; render(); } if (E.list && !e.target.closest('.chg-pop')) { E.list = false; refreshEdit(); } return; }
  const act = a.dataset.act;
  if (act !== 'tk') e.preventDefault();
  if (act !== 'more') T.more = false;
  if (act === 'more') { T.more = !T.more; render(); }
  else if (act === 'edit') { editStart(); T.edit = true; history.pushState(null, '', `?id=${encodeURIComponent(o.id)}&mode=edit`); render(); if (a.dataset.v) { const f = document.querySelector(`[data-f="${a.dataset.v}"]`); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); } } else scrollTo(0, 0); }
  else if (act === 'chgs') { E.list = !E.list; refreshEdit(); }
  else if (act === 'cancel') { if (changed().length) askUnsaved(exitEdit); else exitEdit(); }
  else if (act === 'discard') { E.v = { ...E.init }; E.err = {}; render(); toast('Changes discarded'); }
  else if (act === 'save') editSave();
  else if (act === 'pick') { E.v.next = a.dataset.v; const i = document.querySelector('[data-f="next"]'); if (i) i.value = a.dataset.v; refreshEdit(); }
  else if (act === 'tab') { T.tab = a.dataset.v; history.replaceState(null, '', '#' + T.tab); render(); }
  else if (act === 'atype') { T.actType = a.dataset.v; render(); }
  else if (act === 'road') { T.road = a.dataset.v; render(); }
  else if (act === 'tk') { T.tasks[+a.dataset.v].done = a.checked; render(); }
  else if (act === 'acc') toast(`Would open the ${o.acc} account`);
  else if (act === 'toast') toast(a.dataset.v);
});
$('#main').addEventListener('submit', (e) => {
  if (e.target.id !== 'tk-form') return;
  e.preventDefault();
  const t = $('#tk-t').value.trim(), d = $('#tk-d').value, err = $('#tk-err');
  const miss = [!t && 'a title', !d && 'a due date'].filter(Boolean);
  if (miss.length) { err.textContent = `Enter ${miss.join(' and ')} first.`; err.hidden = false; return; }
  T.tasks.unshift({ t, d, a: $('#tk-a').value, done: false }); render(); toast('Task added', 'ok');
});
const onField = (e) => {
  const f = e.target.dataset && e.target.dataset.f; if (!f || !T.edit) return;
  E.v[f] = e.target.value; delete E.err[f];
  const box = e.target.closest('.fld'); if (box) { box.classList.remove('bad'); const er = box.querySelector('.err'); if (er) er.remove(); }
  if (f === 'geo') E.v.region = (REGION[E.v.geo] || [''])[0];
  if (f === 'offering') { E.v.name = `${o.name.split(' – ')[0]} – ${E.v.offering}`; const n = document.querySelector('[data-f="name"]'); if (n) n.value = E.v.name; }
  if (f === 'owner' && PERSON_TEAM[E.v.owner]) { E.v.team = PERSON_TEAM[E.v.owner]; }
  if (f === 'prob' || f === 'close') { const h = box && box.querySelector('.help'); if (h) h.textContent = f === 'prob' ? probHelp() : closeHelp(); }
  if (e.target.tagName === 'SELECT') { render(); return; }
  // text fields already refreshed on input; redrawing the bar again on blur would swallow the click on Cancel / Save
  if (e.type === 'change') return;
  refreshEdit();
};
$('#main').addEventListener('input', onField);
$('#main').addEventListener('change', onField);
$('#main').addEventListener('input', (e) => { if (e.target.closest('#tk-form')) { const err = $('#tk-err'); if (err) err.hidden = true; } });

document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (T.more) { T.more = false; render(); } if (E.list) { E.list = false; refreshEdit(); } });
window.addEventListener('popstate', () => {
  const toEdit = new URLSearchParams(location.search).get('mode') === 'edit';
  // browser back out of edit mode with unsaved changes: stay in edit mode and ask
  if (!toEdit && editDirty()) { history.pushState(null, '', `?id=${encodeURIComponent(o.id)}&mode=edit`); askUnsaved(exitEdit); return; }
  T.edit = toEdit; if (T.edit && !E.v) editStart(); render(); });
if (o) { D = details(o); document.title = `${o.name} · BCT CRM`;
  // tasks come from the shared task list (assets/crm-data.js), the same rows the Tasks page shows; cancelled ones stay off this tab
  T.tasks = TASKS.filter(t => t.si === o.id && t.status !== 'cxl').map(t => ({ t: t.title, d: t.due, a: t.to, done: t.status === 'done' })); }
CRM.renderShell('initiatives');
if (o && T.edit) editStart();
render();
CRM.riseIn();
</script>
</body>
