<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts · BCT CRM</title>
<link rel="icon" type="image/svg+xml" href="assets/fav.svg">
<link rel="stylesheet" href="design-system/tokens.css?v=20261123a">
<link rel="stylesheet" href="assets/crm.css?v=20261125g">
<link rel="stylesheet" href="assets/dashboard.css?v=20261124b">
<link rel="stylesheet" href="assets/theme-v2.css?v=20261124b">
<link rel="stylesheet" href="assets/responsive.css?v=20261125c">
<style>
/* ---------- Page: Contacts ----------
   Same IA as CRMpulse /contacts: search / role / status filters, By account or List view, a toggle for accounts
   without an active decision maker, and a detail panel for the selected contact. Visual language = Sales initiatives. */
.ct-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.ct-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* By account: one card per account */
.grp-card { padding: 0; overflow: hidden; }
.grp-card .grp-h { display: flex; align-items: center; gap: 8px; min-height: 48px; margin: 0; padding: 12px var(--pad-card); } /* even top and bottom; same 20px inset as the rows */
.grp-h b, .grp-h small { line-height: 1.2; }
.grp-h b { font-size: var(--text-md); font-weight: 600; color: var(--ink); }
.grp-h small { font-size: var(--text-xs); color: var(--t3); }
.grp-h .sp { flex: 1; }
.ok-tag, .need-tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--radius-pill); font-size: var(--text-2xs); font-weight: 600; white-space: nowrap; }
.ok-tag { background: var(--ok-bg); color: var(--ok-text); }
.need-tag { background: var(--warn-bg); color: var(--warn-text); }
.ok-tag svg, .need-tag svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.cr { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr) minmax(0, 1.3fr) auto; gap: 16px; align-items: center; width: 100%; min-height: 64px; padding: 10px var(--pad-card); border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.cr:hover { background: var(--surface-faint); }
.cr.on { background: var(--hover); } /* selected: soft fill only, like the other selected rows */
.cr > .chip { justify-self: end; }
.cr .ell, .grp-card .ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr .t-main { font-weight: 500; color: var(--ink); }
.cr .t-sub { font-size: var(--text-xs); color: var(--t3); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--radius-sm); font-size: var(--text-2xs); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.chip.role { background: var(--hover); color: var(--t2); }
.chip.role.dm { background: var(--info-bg); color: var(--deep); }
.chip.Active { background: var(--ok-bg); color: var(--ok-text); }
.chip.Inactive { background: var(--field); color: var(--t3); }
.mail { font-size: var(--text-sm); color: var(--t2); }

/* List view */
.tbl.ct { table-layout: fixed; }
.tbl.ct col.c-n { width: 28%; } .tbl.ct col.c-a { width: 22%; } .tbl.ct col.c-r { width: 16%; } .tbl.ct col.c-e { width: 24%; } .tbl.ct col.c-s { width: 10%; }
.tbl.ct td { height: 64px; padding-top: 10px; padding-bottom: 10px; }
.tbl.ct tr.on td { background: var(--hover); }

/* Detail panel */
.cp { position: sticky; top: 72px; } /* below the stuck filter bar */
.cp-h { display: flex; gap: 14px; align-items: flex-start; }
.cp-h .av { width: 48px; height: 48px; font-size: var(--text-md); flex: none; }
.cp-h h2 { margin: 0; font-size: var(--text-md); font-weight: 600; color: var(--ink); } /* card title */
.cp-h p { margin: 2px 0 0; font-size: var(--text-xs); color: var(--t3); }
.cp-h > div { flex: 1; min-width: 0; }
.cp-h .btn { flex: none; }
.acc-l { color: inherit; font-size: inherit; font-weight: inherit; text-decoration: none; }
.cp-h p .acc-l { color: var(--deep); }
body.v2 .grp-h a.acc-l { color: var(--ink); } @media (hover: hover) { body.v2 .grp-h a.acc-l:hover { color: var(--deep); } .rc button:not(.on):hover { border-color: var(--line-3); } }
.cp-h svg, .cp-acts svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cp-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; }
.cp-tags small { font-size: var(--text-xs); color: var(--t3); font-variant-numeric: tabular-nums; }
.cp-acts { display: grid; grid-template-columns: auto auto auto; gap: 8px; margin-bottom: 18px; }
.cp-acts .btn { justify-content: center; gap: 6px; height: 36px; padding: 0 6px; white-space: nowrap; }
.cp-acts .btn svg, .cp-h .btn svg { flex: none; }
.cp-f { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.cp-f div.full { grid-column: 1 / -1; }
.cp-f small { display: block; font-size: var(--text-xs); color: var(--t3); }
.cp-f b { display: block; margin-top: 2px; font-size: var(--text-sm); font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.cp-f b.none { color: var(--t3); font-weight: 400; }
.cp-note { display: flex; flex-direction: column; gap: 4px; margin: 16px 0 0; padding: 10px 12px; border-radius: var(--radius-md); background: var(--warn-bg); font-size: var(--text-xs); color: var(--warn-text); }
.cp-sec { margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--text-xs); font-weight: 600; color: var(--t2); }
.cp-in { padding: 8px 0; font-size: var(--text-sm); } /* tags on their own line under the name, as on Home (design review 3, D2) */
.cp-in + .cp-in { border-top: 1px solid var(--line); }
.cp-in a { display: block; color: var(--ink); text-decoration: none; }
.cp-in a:hover { color: var(--deep); text-decoration: underline; }
.st { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--radius-sm); font-size: var(--text-2xs); font-weight: 600; white-space: nowrap; flex: none; }
.st.Prospect { background: var(--cyan-50); color: var(--cyan-text); } .st.Lead { background: var(--ice); color: var(--cyan-text); } .st.Opportunity { background: var(--info-bg); color: var(--deep); }
.st.won { background: var(--ok-bg); color: var(--ok-text); } .st.lost { background: var(--danger-bg); color: var(--danger); }
.st.sub { background: var(--hover); color: var(--t2); }
.cp-in .sts { display: flex; flex-wrap: wrap; gap: 4px; }
.cp-in > span { margin-top: 4px; }
.cp-li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; font-size: var(--text-sm); }
.cp-li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t2); }
.cp-li span b { font-weight: 600; color: var(--ink); }
.cp-li small { flex: none; font-size: var(--text-xs); color: var(--t3); font-variant-numeric: tabular-nums; }
.cp-empty { margin: 0; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--t3); }

@media (max-width: 1100px) {
  .ct-grid { grid-template-columns: minmax(0, 1fr); }
  .ct-grid > .cp { display: none; } /* shown in the side panel instead */
  body:not(.drill-open) .cr.on { background: none; } body:not(.drill-open) .tbl.ct tr.on td { background: none; } /* nothing is open: no row looks selected */
}
.rc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.rc button { display: grid; align-content: center; gap: 2px; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--radius-control); background: var(--surface); font: inherit; color: inherit; text-align: left; cursor: pointer; }
.rc button.on { border-color: var(--deep); background: var(--info-bg); }
.rc b { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: 500; color: var(--ink); } .rc small { font-size: var(--text-xs); color: var(--t3); }
.cp-panel .dr-body { padding: 24px; }
@media (max-width: 768px) { .cp-panel .dr-body { padding: 20px 16px 24px; } .cp-acts .btn { font-size: var(--text-xs); gap: 4px; } }
@media (hover: none) { .cr:hover:not(.on) { background: none; } .cp-in a:hover { text-decoration: none; } }
@media (max-width: 768px) {
  /* person rows: name and status, then the role and email under the name */
  .cr { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .cr > .chip { grid-column: 2; grid-row: 1; }
  .cr .rl, .cr .mail { grid-column: 1 / -1; padding-left: 40px; }
  .cr .mail { font-size: var(--text-xs); }
  .cp-h p .acc-l { position: relative; white-space: nowrap; } .cp-h p .acc-l::after { content: ""; position: absolute; inset: -12px 0; } /* 40px tap height without pushing the line down */
  .grp-h .acc-l, .cp-in a { display: inline-flex; align-items: center; min-height: 40px; }
  .cp-in a { display: flex; } .cp-in { padding: 4px 0 10px; } .cp-in > span { margin-top: 0; }
  .grp-card .grp-h { flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
}
</style>
</head>
<body class="v2">
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>

  <main class="main">
    <header class="v2-head">
      <div class="v2-hello">
        <h1>Contacts</h1>
        <p>People at customer and prospect accounts. Each contact belongs to exactly one account.</p>
      </div>
      <div class="acts" style="display:flex;gap:8px">
        <button class="btn primary" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New contact</button>
      </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="f-search" type="search" placeholder="Name, email, title or account" aria-label="Search contacts"></label>
      <label class="select"><span class="lbl">Role</span><select id="f-role" aria-label="Role"></select></label>
      <label class="select"><span class="lbl">Status</span><select id="f-status" aria-label="Status"></select></label>
      <button class="ftog" id="f-nodm" aria-pressed="false"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Show only no active decision maker</button><!-- same toggle as Tasks' Show completed and cancelled -->
      <button class="btn ghost" id="reset" hidden>Reset</button>
      <span class="sp"></span>
      <div class="seg" id="f-view" role="radiogroup" aria-label="View">
        <button data-v="acc" class="on" role="radio" aria-checked="true">By account</button>
        <button data-v="list" role="radio" aria-checked="false">List</button>
      </div>
    </div>

    <div id="page"></div>
  </main>
</div>

<script src="assets/crm.js?v=20261125h"></script>
<script src="assets/crm-data.js?v=20261125b"></script>
<script>
/* Contacts — people at the accounts. A decision maker is an active contact in the decision-maker role;
   accounts without one are flagged (they can't move an opportunity's authority question forward). */
const { toast } = CRM;
const $ = (s) => document.querySelector(s);
const IC = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  mail: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>',
  meet: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
};
const ROLE_ALL = [...ROLES, 'Primary contact', 'Other'];
const PER_PAGE = 20;
const S = { q: '', role: '', status: '', view: 'acc', noDM: false, sel: CONTACTS[0].id, page: 1, sort: 'name' };
const noDMAccounts = () => ACCOUNTS.filter(a => !hasDM(a.name)).map(a => a.name);
const anyFilter = () => S.q || S.role || S.status || S.noDM;
// old CRMpulse contact-hints.ts: the title points at another department than the recorded one (first matching rule)
const TITLE_DEPTS = [['Finance', /\b(cfo|finance|financial|accountant|accounts|accounting|treasur\w*|controller|risk)\b/i],
  ['Procurement', /\b(procurement|purchas\w*|sourcing|buyer)\b/i], ['IT', /\b(cio|cto|ciso|it|information|infrastructure|security|technology)\b/i]];
const deptNote = (c) => { const r = c.dept === 'Other' ? null : TITLE_DEPTS.find(([, re]) => re.test(c.title));
  return r && r[0] !== c.dept ? `The title ${c.title} usually sits in ${r[0]}, not ${c.dept}. Check the department.` : ''; };
const accLink = (acc) => `<a class="link acc-l" href="accounts.html?q=${encodeURIComponent(acc)}">${esc(acc)}</a>`;

function rows() {
  const q = S.q.trim().toLowerCase(), gaps = noDMAccounts();
  return CONTACTS.filter(c => (!S.role || c.role === S.role) && (!S.status || c.status === S.status) && (!S.noDM || gaps.includes(c.acc))
    && (!q || [c.n, c.email, c.title, c.acc].some(v => v.toLowerCase().includes(q))))
    .sort((a, b) => a.acc.localeCompare(b.acc) || ROLE_ALL.indexOf(a.role || 'Other') - ROLE_ALL.indexOf(b.role || 'Other') || a.n.localeCompare(b.n));
}
const ell = (html, cls = '') => `<div class="ell ${cls}">${html}</div>`;
const roleChip = (c) => c.role ? `<span class="chip role ${c.role === 'Decision maker' ? 'dm' : ''}">${c.role}</span>` : '<span class="t-sub">No role</span>';
const jobOf = (c) => esc([c.title, c.dept].filter(Boolean).join(' · ') || '—');
function byAccount(list) {
  const accs = [...new Set(list.map(c => c.acc))];
  return accs.map(acc => {
    const cs = list.filter(c => c.acc === acc), all = CONTACTS.filter(c => c.acc === acc).length;
    return `<section class="card grp-card" aria-label="${esc(acc)}">
      <div class="grp-h"><b>${accLink(acc)}</b><small>${cs.length === all ? `${all} contact${all === 1 ? '' : 's'}` : `${cs.length} of ${all} on this page`}</small><span class="sp"></span>
        ${hasDM(acc) ? `<span class="ok-tag">${IC.check}Decision maker</span>` : `<span class="need-tag">${IC.plus}Needs a decision maker</span>`}</div>
      ${cs.map(c => `<button class="cr ${S.sel === c.id ? 'on' : ''}" data-act="sel" data-v="${c.id}" aria-pressed="${S.sel === c.id}">
        <div class="own">${CRM.avatar(c.n, c.id)}<div class="own-t">${ell(esc(c.n), 't-main')}${ell(`${jobOf(c)}`, 't-sub')}</div></div>
        <span class="rl">${roleChip(c)}</span>${ell(esc(c.email), 'mail')}<span class="chip ${c.status}">${c.status}</span></button>`).join('')}
    </section>`;
  }).join('');
}
function listView(list) {
  const sorted = list;
  const th = (k, l) => `<th aria-sort="${S.sort === k ? 'ascending' : 'none'}"><button class="th-sort ${S.sort === k ? 'on' : ''}" data-act="sort" data-v="${k}">${l}<span class="arr" aria-hidden="true">↑</span></button></th>`;
  return `<section class="card"><div class="tbl-wrap"><table class="tbl ct">
    <colgroup><col class="c-n"><col class="c-a"><col class="c-r"><col class="c-e"><col class="c-s"></colgroup>
    <thead><tr>${th('name', 'Contact')}${th('acc', 'Account')}<th>Role</th><th>Email</th><th>Status</th></tr></thead>
    <tbody>${sorted.map(c => `<tr class="${S.sel === c.id ? 'on' : ''}" data-act="sel" data-v="${c.id}" tabindex="0">
      <td><div class="own">${CRM.avatar(c.n, c.id)}<div class="own-t">${ell(esc(c.n), 't-main')}${ell(`${jobOf(c)}`, 't-sub')}</div></div></td>
      <td>${ell(esc(c.acc))}${ell(c.accId, 't-sub')}</td><td>${roleChip(c)}</td><td>${ell(esc(c.email), 'mail')}</td><td><span class="chip ${c.status}">${c.status}</span></td></tr>`).join('')}</tbody>
  </table></div></section>`;
}
function panel(drill) { // beside the list above 1100px; a side panel (drill) below
  const c = CONTACTS.find(x => x.id === S.sel); if (!c) return '';
  const its = INITS.filter(o => o.acc === c.acc).slice(0, 5);
  // same checks as CRMpulse: title vs department, and a decision maker who has left
  const notes = [deptNote(c), c.status === 'Inactive' && !hasDM(c.acc) ? 'Inactive key-role contact. The account needs a new one.' : ''].filter(Boolean);
  const last = ACTIVITIES.filter(a => a.acc === c.acc && a.who.includes(c.n)).slice(0, 3);
  // only active contacts can be logged against
  const logOff = c.status === 'Inactive' ? ' aria-disabled="true" data-tip="Inactive contacts are not offered in new activities"' : '';
  const mailOff = c.email ? '' : ' aria-disabled="true" data-tip="No business email recorded"';
  const pill = (o) => o.kind === 'open' ? `<span class="sts"><span class="st ${o.status}">${o.status}</span><span class="st sub">${esc(o.sub)}</span></span>` : `<span class="st ${o.kind}">${o.kind === 'won' ? 'Closed won' : 'Closed lost'}</span>`;
  const dt = (d) => { const x = new Date(d); return `${x.getDate()} ${'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[x.getMonth()]} ${x.getFullYear()}`; };
  const f = (k, v, full) => `<div class="${full ? 'full' : ''}"><small>${k}</small><b class="${v ? '' : 'none'}">${v ? esc(v) : 'Not recorded'}</b></div>`;
  const body = `
    <div class="cp-h">${CRM.avatar(c.n, c.id)}<div><h2 ${drill ? 'id="cp-t"' : ''}>${esc(c.n)}</h2><p>${esc(c.title || 'No designation')} · ${accLink(c.acc)}</p></div><button class="btn" data-act="edit" aria-label="Edit ${esc(c.n)}">${IC.edit}Edit</button>${drill ? `<button type="button" class="icon-btn" data-x="close" aria-label="Close panel">${CRM.icon('x')}</button>` : ''}</div>
    <div class="cp-tags">${roleChip(c)}<span class="chip ${c.status}">${c.status}</span><small>${c.id}</small></div>
    <div class="cp-acts"><button class="btn" data-act="email"${mailOff}>${IC.mail}Email</button><button class="btn" data-act="call" ${logOff}>${IC.phone}Log call</button><button class="btn" data-act="meet" ${logOff}>${IC.meet}Log meeting</button></div>
    <div class="cp-f">${f('Business email', c.email, true)}${f('Mobile', c.mobile)}${f('Office phone', c.office)}${f('Department', c.dept)}${f('Account role', c.role)}</div>
    ${notes.length ? `<p class="cp-note">${notes.map(n => `<span>${esc(n)}</span>`).join('')}</p>` : ''}
    <div class="cp-sec">Initiatives at this account</div>
    ${its.length ? its.map(o => `<div class="cp-in"><a href="initiative.html?id=${encodeURIComponent(o.id)}#contacts">${esc(o.name)}</a>${pill(o)}</div>`).join('') : '<p class="muted" style="margin:0;font-size:var(--text-sm)">No initiatives yet</p>'}
    <div class="cp-sec">Last interactions</div>
    ${last.length ? last.map(a => `<div class="cp-li"><span><b>${a.type}</b> · ${esc(a.t)}</span><small>${dt(a.d)}</small></div>`).join('') : `<p class="cp-empty">No activities recorded with this person yet.${logOff ? '' : ' Use Log call or Log meeting above.'}</p>`}`;
  return drill ? body : `<section class="card cp" aria-label="Contact details">${body}</section>`;
}
function render() {
  const list = rows();
  if (list.length && !list.some(c => c.id === S.sel)) S.sel = list[0].id;
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE)); S.page = Math.min(S.page, pages);
  const ordered = S.view === 'acc' ? list : list.slice().sort(S.sort === 'acc' ? (a, b) => a.acc.localeCompare(b.acc) || a.n.localeCompare(b.n) : (a, b) => a.n.localeCompare(b.n));
  const shown = ordered.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  const pager = pages > 1 ? `<div class="pager" style="border-top:0;padding-top:0"><span>Showing ${(S.page - 1) * PER_PAGE + 1}–${Math.min(S.page * PER_PAGE, list.length)} of ${list.length} contacts</span><span class="sp"></span>
    <button data-act="page" data-v="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
    ${Array.from({ length: pages }, (_, i) => `<button data-act="page" data-v="${i + 1}" class="${S.page === i + 1 ? 'on' : ''}" aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}
    <button data-act="page" data-v="${S.page + 1}" ${S.page === pages ? 'disabled' : ''} aria-label="Next page">›</button></div>` : '';
  $('#page').innerHTML = (list.length
    ? `<div class="ct-grid"><div class="ct-main">${S.view === 'acc' ? byAccount(shown) : listView(shown)}${pager}</div>${panel()}</div>`
    : `<section class="card"><div class="empty" style="padding:48px 12px"><b>No contacts here</b>Nothing matches these filters.<br><button class="link" data-act="reset">Clear filters</button></div></section>`);
  $('#f-nodm').setAttribute('aria-pressed', String(S.noDM));
  $('#reset').hidden = !(S.q || S.role || S.status); // the toggle clears itself with one click, so it does not bring up Reset (as on Tasks)
}

// ≤1100px there is no room beside the list: the details slide in from the right, as on Tasks, and the list keeps its place
const narrow = matchMedia('(max-width: 1100px)');
let dr = null, drPrev = null;
function closeDrill(now) {
  if (!dr) return; const el = dr; dr = null;
  document.removeEventListener('keydown', drKey, true); document.body.classList.remove('drill-open');
  if (now) el.remove(); else setTimeout(() => el.remove(), 300);
  (document.querySelector(`#page [data-act="sel"][data-v="${S.sel}"]`) || drPrev)?.focus({ preventScroll: true });
}
const drKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeDrill(); } };
function openDrill() {
  closeDrill(true); drPrev = document.activeElement;
  dr = document.createElement('aside'); dr.className = 'drill cp-panel'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-labelledby', 'cp-t');
  dr.innerHTML = `<div class="dr-body">${panel(true)}</div>`;
  document.body.appendChild(dr); document.addEventListener('keydown', drKey, true);
  dr.addEventListener('click', (e) => { if (e.target.closest('[data-x="close"]')) closeDrill(); else onAct(e); });
  requestAnimationFrame(() => { document.body.classList.add('drill-open'); setTimeout(() => dr?.querySelector('[data-x="close"]')?.focus(), 280); });
}
narrow.addEventListener('change', () => { if (!narrow.matches) closeDrill(true); });
document.addEventListener('click', (e) => { if (dr && !e.target.closest('.drill, [data-act="sel"], .toast')) closeDrill(); });
// Log call / Log meeting: the Log activity panel with the account, the person and the type filled in (old ContactPreviewPanel)
const logUrl = (c, type) => `activities.html?log=${encodeURIComponent(c.acc)}&who=${encodeURIComponent(c.n)}&type=${encodeURIComponent(type)}`;

const page = $('#page');
page.addEventListener('click', onAct);
function onAct(e) {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, c = CONTACTS.find(x => x.id === S.sel);
  if (a.getAttribute('aria-disabled') === 'true') { toast(a.dataset.tip, 'warn'); return; } // a tap shows no tooltip: say why here
  if (act === 'sel') { S.sel = a.dataset.v; render(); if (narrow.matches) openDrill(); }
  else if (act === 'sort') { S.sort = a.dataset.v; S.page = 1; render(); }
  else if (act === 'page') { S.page = +a.dataset.v; render(); scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (act === 'email') toast(`Would open a new email to ${c.email}`);
  else if (act === 'call') location.href = logUrl(c, 'Phone call');
  else if (act === 'meet') location.href = logUrl(c, 'Virtual meeting');
  else if (act === 'edit') { closeDrill(true); openForm(c); }
  else if (act === 'reset') resetAll();
}
page.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });
function fill(sel, opts) { sel.innerHTML = opts.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join(''); }
fill($('#f-role'), [['', 'All'], ...ROLES, 'Primary contact', 'Other'].map(r => Array.isArray(r) ? r : [r, r]));
fill($('#f-status'), [['', 'All'], ['Active', 'Active'], ['Inactive', 'Inactive']]);
$('#f-search').addEventListener('input', (e) => { S.q = e.target.value; S.page = 1; render(); });
$('#f-role').addEventListener('change', (e) => { S.role = e.target.value; S.page = 1; render(); });
$('#f-status').addEventListener('change', (e) => { S.status = e.target.value; S.page = 1; render(); });
$('#f-nodm').addEventListener('click', () => { S.noDM = !S.noDM; S.page = 1; render(); });
$('#f-view').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.view = b.dataset.v;
  $('#f-view').querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); }); S.page = 1; render(); });
function resetAll() { S.q = S.role = S.status = ''; S.noDM = false; $('#f-search').value = ''; $('#f-role').value = ''; $('#f-status').value = ''; S.page = 1; render(); }
$('#reset').addEventListener('click', () => { const on = S.noDM; resetAll(); S.noDM = on; render(); }); // Reset leaves the toggle alone, as on Tasks
// New / edit contact (old ContactFormDrawer): account first with the people already there, title and email checks, who holds each role
const { fld, pick, inp, head, put } = CRM.form, DEPTS = ['IT', 'Business', 'Finance', 'Procurement', 'Operations', 'Other'];
const ACC_ALL = [...ACCOUNTS, ...FRESH_ACCOUNTS];
const siteOf = (acc) => acc ? acc.replace(/^Al /, '').split(' ')[0].toLowerCase() + '.example' : ''; // the account's website domain, as in the demo emails
function openForm(c) {
  const [first, ...rest] = c ? c.n.split(' ') : [''];
  const blank = (acc) => ({ acc, first: '', last: '', title: '', dept: '', email: '', mobile: '', office: '', role: '', active: true, remarks: '' });
  const v = c ? { acc: c.acc, first, last: rest.join(' '), title: c.title, dept: c.dept, email: c.email, mobile: c.mobile, office: c.office, role: c.role, active: c.status === 'Active', remarks: c.remarks || '' } : blank('');
  let dups = [];
  const people = () => CONTACTS.filter(p => p.acc === v.acc && p !== c);
  const mailOwner = () => { const m = v.email.trim().toLowerCase(); return m && CONTACTS.find(p => p !== c && p.email.toLowerCase() === m); };
  const foreign = () => { const d = v.email.includes('@') ? v.email.split('@').pop().trim().toLowerCase() : '', s = siteOf(v.acc); return d && d.includes('.') && s && d !== s && !d.endsWith('.' + s) ? d : ''; };
  const ready = () => v.acc && v.first.trim() && v.last.trim() && !mailOwner();
  const hint = () => mailOwner() ? 'Fix the duplicate email first' : !v.acc ? 'Choose the account first' : 'Account, first and last name are required';
  const exist = () => { if (!v.acc) return ''; const l = people(); return `<span class="tf-h">${l.length ? `<b>${l.length} ${l.length === 1 ? 'contact' : 'contacts'} already:</b> ${l.map(p => esc(p.n) + (p.role ? ` (${p.role})` : '') + (p.status === 'Inactive' ? ' · inactive' : '')).join(', ')}` : 'No contacts at this account yet.'}</span>`; };
  const titleNote = () => { const n = v.title.trim() && v.dept ? deptNote({ title: v.title.trim(), dept: v.dept }) : ''; return n ? `<span class="tf-warn">${esc(n)}</span>` : ''; };
  const mailNote = () => { const o = mailOwner(), f = foreign(); return o ? `<span class="tf-e">This email already belongs to another contact: ${esc(o.n)} (${esc(o.acc)}).</span>` : f ? `<span class="tf-warn">The domain ${esc(f)} isn't the account website's. That's fine for personal or partner emails; otherwise check it.</span>` : '<span class="tf-h">Unique across contacts.</span>'; };
  const dupBox = () => dups.length ? `<div class="op-why" role="status"><p><b>Possible duplicates. Review before saving:</b></p><ul>${dups.map(p => `<li>${esc(p.n)} <small>· ${p.id} · ${esc(p.acc)}</small></li>`).join('')}</ul><p>Save again to create the record anyway.</p></div>` : '';
  const foot = () => `<div class="op-r1"><span class="op-msg" role="status">${ready() ? '' : hint()}</span></div><button type="button" class="btn ghost" data-x="close">Cancel</button>${c ? '' : `<button type="button" class="btn" data-x="another" ${ready() ? '' : 'disabled'}>Save &amp; add another</button>`}<button type="submit" class="btn primary" ${ready() ? '' : 'disabled'}>${c ? 'Save changes' : dups.length ? 'Create anyway' : 'Add contact'}</button>`;
  const draw = () => `<form class="tf-form" novalidate>${head('Contacts', c ? `Edit ${esc(c.n)}` : 'New contact', c ? `${c.id} · ${esc(c.acc)}` : 'A contact belongs to exactly one account. Someone who moves to another organization gets a new contact there.')}
    <div class="dr-body"><div class="tf-g">
      <div data-dup>${dupBox()}</div>
      <h3 class="op-h" style="margin:0">Account</h3>
      ${fld('Account', pick('acc', [['', 'Select account…'], ...ACC_ALL.map(a => [a.name, a.name])], v.acc, 'Account', !!c), { req: true, hint: c ? 'The account cannot change.' : '' })}
      ${exist()}
      <h3 class="op-h">Person</h3>
      <div class="tf-2">${fld('First Name', inp('first', v.first, 'First Name'), { req: true })}${fld('Last Name', inp('last', v.last, 'Last Name'), { req: true })}</div>
      ${fld('Designation / Job Title', inp('title', v.title, 'Designation / Job Title', { ph: 'e.g. Head of Digital' }))}
      <div class="tf"><span class="tf-l">Department</span>${pick('dept', [['', 'Not set'], ...DEPTS.map(d => [d, d])], v.dept, 'Department')}<span data-title>${titleNote()}</span></div>
      <h3 class="op-h">How to reach them</h3>
      <div class="tf" data-mail><span class="tf-l">Business Email</span>${inp('email', v.email, 'Business Email', { type: 'email', ph: `name@${siteOf(v.acc) || 'company.com'}` })}<span data-note>${mailNote()}</span></div>
      <div class="tf-2">${fld('Mobile Number', inp('mobile', v.mobile, 'Mobile Number', { type: 'tel' }), { hint: 'Include the country code.' })}${fld('Office Phone', inp('office', v.office, 'Office Phone', { type: 'tel' }), { hint: 'Include the country code.' })}</div>
      <h3 class="op-h">Role at the account</h3><span class="tf-h">Roles on a specific deal are set inside each initiative's Contacts tab.</span>
      <div class="rc" role="radiogroup" aria-label="Account-level role">${ROLE_ALL.map(r => { const h = people().filter(p => p.status === 'Active' && p.role === r); return `<button type="button" role="radio" aria-checked="${v.role === r}" class="${v.role === r ? 'on' : ''}" data-role="${r}"><b>${r}${r === 'Decision maker' ? '<span class="chip role dm">Key</span>' : ''}</b>${h.length ? `<small>Already: ${h.map(p => esc(p.n)).join(', ')}</small>` : ''}</button>`; }).join('')}</div>
      ${c ? `<label class="tf-chk"><input type="checkbox" data-c="active" ${v.active ? 'checked' : ''}><span>Active <small>Untick when they leave the company. Their history stays.</small></span></label>` : ''}
      <h3 class="op-h">Notes</h3>
      ${fld('Remarks', `<textarea class="in" data-v="remarks" aria-label="Remarks" placeholder="e.g. Prefers WhatsApp, met at GITEX">${esc(v.remarks)}</textarea>`)}
    </div></div><div class="dr-foot op-foot">${foot()}</div></form>`;
  const P = CRM.openPanel(v, draw, c ? 'Discard changes to this contact?' : 'Discard this contact?');
  const q = (s) => P.el.querySelector(s);
  const live = () => { put(q('[data-dup]'), dupBox()); put(q('[data-title]'), titleNote()); put(q('[data-note]'), mailNote()); q('[data-mail]').classList.toggle('bad', !!mailOwner()); put(q('.op-foot'), foot()); };
  P.el.addEventListener('input', (e) => { const k = e.target.dataset.v; if (!k) return; v[k] = e.target.value; if (k === 'first' || k === 'last') dups = []; live(); });
  P.el.addEventListener('change', (e) => { if (e.target.dataset.c) { v.active = e.target.checked; return; } const k = e.target.dataset.v; if (!k) return; v[k] = e.target.value; if (k === 'acc') { v.role = ''; dups = []; P.redraw(); } else live(); });
  P.el.addEventListener('click', (e) => { const b = e.target.closest('[data-role]');
    if (b) { v.role = v.role === b.dataset.role ? '' : b.dataset.role; P.el.querySelectorAll('[data-role]').forEach(x => { const on = x.dataset.role === v.role; x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on)); }); } // a second click clears it: the role is optional
    else if (e.target.closest('[data-x="another"]')) save(true); });
  P.el.addEventListener('submit', () => save(false));
  function save(again) {
    if (!ready()) return;
    const n = `${v.first.trim()} ${v.last.trim()}`, body = { n, title: v.title.trim(), dept: v.dept, role: v.role, email: v.email.trim(), mobile: v.mobile.trim(), office: v.office.trim(), remarks: v.remarks };
    if (c) { Object.assign(c, body, { status: v.active ? 'Active' : 'Inactive' }); P.close(); render(); toast('Contact updated.', 'ok'); return; }
    if (!dups.length) { dups = people().filter(p => p.n.toLowerCase() === n.toLowerCase()); if (dups.length) { live(); q('.dr-body').scrollTop = 0; toast('Potential duplicate contacts found. Review them, then save again to create anyway.', 'warn'); return; } }
    const x = { id: 'CON-2026-' + String(Math.max(...CONTACTS.map(p => +p.id.slice(-4))) + 1).padStart(4, '0'), acc: v.acc, accId: ACC_ALL.find(a => a.name === v.acc).id, status: 'Active', ...body };
    CONTACTS.push(x); resetAll(); S.sel = x.id; const l = rows(); S.page = Math.floor(l.indexOf(x) / PER_PAGE) + 1; render(); toast(`${n} added.`, 'ok');
    if (!again) return P.close();
    Object.assign(v, blank(v.acc)); dups = []; P.clean(); P.redraw(); q('.dr-body').scrollTop = 0; q('[data-v="first"]').focus({ preventScroll: true }); // same account, a clean slate for the next person
  }
}
$('#new').addEventListener('click', () => openForm(null));

CRM.renderShell('contacts');
CRM.watchSticky($('#filters'));
render();
CRM.riseIn();
</script>
</body>
</html>
