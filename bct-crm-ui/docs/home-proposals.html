<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首頁提案</title>
<link rel="icon" type="image/svg+xml" href="../assets/fav.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Proposal page only — not part of the prototype. Three ways to lighten the home page (2026-10-28):
   A today first, B numbers first, C minimal. Same data, same tokens as the prototype. */
:root{
  --mid:#052870; --deep:#0042B7; --cyan:#00A0E4; --ink:#10182a;
  --canvas:#f6f8fb; --surface:#fff; --field:#f4f6f9; --line:#e1e6ef; --line2:#e9edf4;
  --tx:#172033; --tx2:#344258; --tx3:#56657a; --tick:#cfd6e0;
  --red-bg:#fde8e3; --red:#a33a00; --ok-bg:#e3f3e8; --ok:#1f6b3a; --new-bg:#e0f3fb; --new:#0a6a98;
  --tint:#e8effb;
}
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;color:var(--tx);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.nb{display:inline-block}

/* ---------- Proposal chrome (same as the other proposal pages) ---------- */
.pp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;max-width:1360px;margin:0 auto;padding:28px 24px 16px}
.pp-top h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.pp-top p{margin:6px 0 0;font-size:14px;color:var(--tx3)}
.pp-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.seg button{height:36px;padding:0 16px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:500;color:var(--tx2);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--mid);color:#fff}
.replay{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;cursor:pointer}
.replay:hover{border-color:#aeb9c8}
.note{max-width:1360px;margin:0 auto 18px;padding:0 24px}
.note-card{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding:16px 20px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.note-card h3{grid-column:1/-1;margin:0;font-size:16px;font-weight:600}
.note-card h3 small{margin-left:8px;font-size:13px;font-weight:500;color:var(--tx3)}
.note-card dt{font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:.04em}
.note-card dd{margin:4px 0 0;font-size:13.5px;line-height:1.65;color:var(--tx2)}
.frame-wrap{padding:0 24px 48px;overflow-x:auto}
.frame{display:grid;grid-template-columns:220px minmax(0,1fr);min-width:1140px;max-width:1312px;height:900px;margin:0 auto;background:var(--canvas);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgb(23 32 51/10%)}

/* Sidebar stub: same as the prototype */
.sb{background:#fff;border-right:1px solid var(--line2);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 16px}
.brand img{height:20px}
.brand span{padding-left:8px;border-left:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--tx3)}
.sb-new{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--tx2);margin-bottom:6px}
.sb-new i{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--tint);color:var(--deep)}
.sb-lbl{padding:10px 10px 4px;font-size:12px;color:var(--tx3)}
.sb-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--tx2)}
.sb-item i{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--field);color:var(--tx3);flex:0 0 auto}
.sb-item svg,.sb-new svg{width:14px;height:14px}
.sb-hist{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;font-size:12.5px;color:var(--tx2)}
.sb-hist i{color:var(--tx3);display:grid}
.sb-hist svg{width:13px;height:13px}
.sb-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.sb-user img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#dfe6f1}
.sb-user small{display:block;color:var(--tx3);font-size:11.5px}

/* ---------- Home canvas ---------- */
.mn{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow:auto;padding:48px 32px 24px}
.col{max-width:720px;margin:0 auto}
.composer{margin:0 auto 22px;width:calc(100% - 64px);max-width:900px;padding:14px 16px 10px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 6px 18px rgb(23 32 51/6%)}
.composer .ph{font-size:14.5px;color:#8a96a8;padding:2px 2px 18px}
.composer .bar{display:flex;justify-content:flex-end;gap:8px}
.composer .bar i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--tx3)}
.composer .bar i.send{background:var(--field)}
.composer .bar svg{width:16px;height:16px}

.greet{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.greet img{width:84px;height:84px;flex:0 0 auto;filter:drop-shadow(0 12px 22px rgb(0 66 183/26%))}
.greet h2{margin:0;font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.25;color:var(--mid)}
.greet h2 .ask{display:block}
.greet h2 .grad{color:var(--deep)}
.brief{margin:6px 0 0;font-size:16.5px;line-height:1.6;color:var(--tx2)}
.brief b{color:var(--mid);font-weight:600}

.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.flag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.flag.red{background:var(--red-bg);color:var(--red)}
.flag.new{background:var(--new-bg);color:var(--new)}
.src{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:0;border-radius:7px;background:var(--tint);color:var(--deep);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.src svg{width:12px;height:12px}
.mini-btn{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;white-space:nowrap}

/* Today list */
.today .hd{display:flex;align-items:baseline;gap:8px;padding:14px 18px 8px}
.today .hd b{font-size:14.5px;font-weight:600}
.today .hd small{font-size:12.5px;color:var(--tx3)}
.today .hd .wk{margin-left:auto;border:0;background:none;padding:0;color:var(--deep);font-size:12.5px;cursor:pointer}
.task{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line2);font-size:13.5px}
.task .box{width:20px;height:20px;flex:0 0 auto;border:1.5px solid #aeb9c8;border-radius:6px;background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.task .box svg{width:12px;height:12px;display:none}
.task.done .box{background:#2f6b0a;border-color:#2f6b0a}
.task.done .box svg{display:block}
.task.done .t{color:var(--tx3);text-decoration:line-through}
.task .tx{flex:1;min-width:0}
.task .t{color:var(--tx)}
.task .m{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12px;color:var(--tx3)}
.task .end{display:flex;align-items:center;gap:8px}
.task.lead .box{border-style:dashed}
.more{padding:10px 18px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--deep);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}

/* Suggestion chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;color:var(--tx2);cursor:pointer;transition:border-color .15s, box-shadow .15s}
.chip:hover{border-color:#c4d4ee;box-shadow:0 6px 14px -8px rgb(0 66 183/30%)}
.chip svg{width:14px;height:14px;color:var(--deep)}
.chips-lbl{font-size:12px;color:var(--tx3);margin:0 0 8px 2px}

/* Snapshot: big (B) and strip (A) */
.big{font-weight:300;letter-spacing:-.035em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.big sup{font-size:.4em;font-weight:500;letter-spacing:0;vertical-align:.9em;margin-left:2px;color:var(--tx3)}
.delta{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:11.5px;font-weight:600}
.snap{border-radius:20px;overflow:hidden}
.snap-g{display:grid;grid-template-columns:1fr 1fr}
.snap-t{padding:20px 22px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.snap-t:nth-child(2n){border-right:0}
.snap-t .big{font-size:44px}
.snap-t .l{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--tx3)}
.snap-t .c{margin-top:6px;font-size:12.5px;color:var(--tx3)}
.snap-f{display:flex;align-items:center;gap:10px;padding:12px 22px;font-size:12.5px;color:var(--tx3)}
.snap-f b{color:var(--tx);font-weight:600;font-size:13.5px;margin-right:6px}
.snap-f .go{margin-left:auto}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--tx3);cursor:pointer}
.ib.on{background:var(--tint);border-color:var(--tint);color:var(--deep)}
.ib svg{width:15px;height:15px}
.strip{display:flex;align-items:center;gap:16px;padding:12px 14px 12px 18px;border-radius:14px;cursor:pointer;transition:border-color .15s}
.strip:hover{border-color:#c4d4ee}
.strip .lbl{font-size:12px;font-weight:600;color:var(--tx3);white-space:nowrap}
.strip .n{display:flex;align-items:baseline;gap:6px;white-space:nowrap;font-size:12px;color:var(--tx3)}
.strip .n .big{font-size:20px}
.strip .go{margin-left:auto;display:flex;gap:6px}
.strip .ib{width:30px;height:30px}

/* C: composer in the middle */
.c-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center}
.c-wrap .greet{flex-direction:column;gap:14px}
.c-wrap .greet h2{font-size:32px}
.c-wrap .composer{width:100%;max-width:680px;margin:6px 0 18px;text-align:left}
.c-wrap .chips{justify-content:center}
.c-hint{margin-top:22px;font-size:12.5px;color:var(--tx3)}
.c-hint a{color:var(--deep);text-decoration:none;cursor:pointer}

.gap{height:16px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (max-width:760px){ .note-card{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<header class="pp-top">
  <div>
    <h1>首頁提案</h1>
    <p>同一組資料，三種份量分配。都假設 Q4 snapshot 已經釘選，四張情境卡都還點得到。</p>
  </div>
  <div class="pp-ctrl">
    <div class="seg" role="tablist" aria-label="提案">
      <button role="tab" data-opt="A" aria-selected="true">A 今天優先</button>
      <button role="tab" data-opt="B" aria-selected="false">B 數字優先</button>
      <button role="tab" data-opt="C" aria-selected="false">C 極簡</button>
    </div>
    <button class="replay" id="replay" type="button">重播動態</button>
  </div>
</header>

<section class="note" aria-live="polite"><div class="note-card" id="note"></div></section>

<div class="frame-wrap">
  <div class="frame">
    <aside class="sb" aria-label="Sidebar">
      <div class="brand"><img src="../assets/bct-logo.svg" alt="BCT" /><span>CRM</span></div>
      <div class="sb-new"><i data-ic="plus"></i>New chat</div>
      <div class="sb-lbl">Workspace</div>
      <div class="sb-item"><i data-ic="chart"></i>Pipeline</div>
      <div class="sb-item"><i data-ic="users"></i>Accounts</div>
      <div class="sb-item"><i data-ic="list"></i>Reports</div>
      <div class="sb-lbl">Recents</div>
      <div class="sb-hist"><i data-ic="msg"></i>Q4 at a glance</div>
      <div class="sb-hist"><i data-ic="msg"></i>Qamar Energy pipeline</div>
      <div class="sb-hist"><i data-ic="msg"></i>Meeting notes — Qamar</div>
      <div class="sb-user"><img src="../assets/gen/avatar-sheldon.webp" alt=""><span><b>Sheldon Cooper</b><small>Sales · Middle East</small></span></div>
    </aside>
    <main class="mn" id="mn"></main>
  </div>
</div>

<script>
const IC = {
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  chart:'<path d="M4 20h16"/><path d="M8 16v-4"/><path d="M12 16V7"/><path d="M16 16v-6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  list:'<rect width="18" height="16" x="3" y="4" rx="2"/><path d="M7 9h.01"/><path d="M7 15h.01"/><path d="M11 9h6"/><path d="M11 15h6"/>',
  msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  arrow:'<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
  pin:'<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>'
};
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = svg(el.dataset.ic));
const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FACE = '../assets/ai/ai-face.webp';

/* Same fictional data as the prototype. The new website lead joins today's list in A. */
const TODAY = [
  { id:'t2', t:'Send revised pricing to Omar Haddad', m:'Gulf Harbor Logistics · overdue by 1 day', flag:['red','Overdue'], src:'OPP-1031' },
  { id:'t1', t:'Call Rajesh Kulkarni about security review scope', m:'Sahyadri Bank · 11:00', src:'OPP-1058' },
  { id:'l1', t:'Reply to Faisal Al-Mazrouei', m:'Al Dhafra Facilities · website lead 02:14', flag:['new','New lead'], act:'Draft reply', lead:true },
  { id:'t3', t:'Prepare Field Ops demo for Qamar', m:'Qamar Energy · 16:00', src:'OPP-1017' }
];
const done = {};
const taskRow = x => `<div class="task ${x.lead?'lead':''} ${done[x.id]?'done':''}" data-task="${x.id}">
  <button class="box" role="checkbox" aria-checked="${!!done[x.id]}" aria-label="${x.t}">${svg('check')}</button>
  <div class="tx"><div class="t">${x.t}</div><div class="m"><span>${x.m}</span>${x.flag&&!done[x.id]?`<span class="flag ${x.flag[0]}">${x.flag[1]}</span>`:''}</div></div>
  <div class="end">${x.act?`<button class="mini-btn" data-toast="開一則對話，起草給 Faisal 的回覆">${x.act}</button>`:''}${x.src?`<button class="src" data-toast="開 ${x.src} 的紀錄面板">${svg('link')}${x.src}</button>`:''}</div></div>`;
const left = () => TODAY.filter(x=>!done[x.id]);
const todayCard = (rows, label='Today') => `<section class="card today" id="today">
  <div class="hd"><b>${label}</b><small id="t-count">${left().length} to do · 1 overdue</small><button class="wk" data-toast="開一則對話，列出這週的待辦">Show my week</button></div>
  <div id="t-rows">${rows.map(taskRow).join('')}</div>${rows.length<TODAY.length?`<button class="more" data-more>${TODAY.length-rows.length} more</button>`:''}</section>`;
const CHIPS = [['msg','Log a meeting'],['gauge',"How's my quarter?"],['chart','Qamar Energy pipeline'],['mail','Draft a follow-up']];
const chips = (list=CHIPS) => `<div class="chips">${list.map(c=>`<button class="chip" data-toast="開對話：${c[1]}">${svg(c[0])}${c[1]}</button>`).join('')}</div>`;
const composer = () => `<div class="composer"><div class="ph">Ask about a deal, or tell me what happened…</div><div class="bar"><i>${svg('mic')}</i><i class="send">${svg('up')}</i></div></div>`;
const num = (pre,v,unit,dec) => `<span class="big"><span data-count="${v}" data-dec="${dec}" data-pre="${pre}">${pre}${v.toFixed(dec)}</span>${unit?`<sup>${unit}</sup>`:''}</span>`;
const brief = `<p class="brief">Three things today: <b>Gulf Harbor’s pricing</b> is a day overdue, you call <b class="nb">Rajesh at 11:00</b>, and <b class="nb">Faisal’s new lead</b> hasn’t had <span class="nb">a reply.</span></p>`;

/* ---------- A. Today first ---------- */
function viewA(){
  return `<div class="scroll"><div class="col">
    <div class="greet"><img src="${FACE}" alt=""><div><h2>Good morning, Sheldon</h2>${brief}</div></div>
    ${todayCard(TODAY)}
    <div class="gap"></div>
    <div class="chips-lbl">Or start with</div>${chips()}
    <div class="gap"></div><div class="gap"></div>
    <div class="card strip" data-toast="開 Reports" title="Open in Reports">
      <span class="lbl">Q4</span>
      <span class="n">${num('$',2.55,'M',2)}open <span class="delta">+12%</span></span>
      <span class="n">${num('$',1.10,'M',2)}forecast · 73%</span>
      <span class="n">${num('$',1.07,'M',2)}won</span>
      <span class="n">${num('',2,'',0)}new leads</span>
      <span class="go"><span class="ib on" data-toast="取消釘選" title="Unpin">${svg('pin')}</span><span class="ib">${svg('arrow')}</span></span>
    </div>
  </div></div>${composer()}`;
}

/* ---------- B. Numbers first ---------- */
function viewB(){
  return `<div class="scroll"><div class="col">
    <div class="greet"><img src="${FACE}" alt=""><h2>Good morning, Sheldon<span class="ask">What can we get done <span class="grad">today?</span></span></h2></div>
    <section class="card snap">
      <div class="snap-g">
        <div class="snap-t">${num('$',2.55,'M',2)}<div class="l">Open pipeline <span class="delta">+12%</span></div><div class="c">6 deals · 1 closing this month</div></div>
        <div class="snap-t">${num('$',1.10,'M',2)}<div class="l">Q4 forecast · 73% of target</div><div class="c">Target $1.5M · gap $400K</div></div>
        <div class="snap-t">${num('$',1.07,'M',2)}<div class="l">Won, last 90 days</div><div class="c">3 won · 2 lost · 60% win rate</div></div>
        <div class="snap-t">${num('',2,'',0)}<div class="l">New leads this week</div><div class="c">1 matches an account</div></div>
      </div>
      <div class="snap-f"><b>Q4 snapshot</b>Updated today 06:00<span class="go"></span><span class="ib on">${svg('pin')}</span><span class="ib" data-toast="開 Reports">${svg('arrow')}</span></div>
    </section>
    <div class="gap"></div>
    ${todayCard(TODAY.slice(0,2))}
    <div class="gap"></div>
    ${chips(CHIPS.slice(0,3))}
  </div></div>${composer()}`;
}

/* ---------- C. Minimal ---------- */
function viewC(){
  return `<div class="scroll"><div class="c-wrap">
    <div class="greet"><img src="${FACE}" alt=""><h2>Good morning, Sheldon<span class="ask">What can we get done <span class="grad">today?</span></span></h2></div>
    ${composer()}
    ${chips([['gauge','What should I focus on?'],...CHIPS])}
    <p class="c-hint">Your numbers are in <a data-toast="開 Reports">Reports</a> · deals and leads in <a data-toast="開 Pipeline">Pipeline</a></p>
  </div></div>`;
}

/* ---------- Motion ---------- */
function countUp(root){
  root.querySelectorAll('[data-count]').forEach(n=>{
    const t=+n.dataset.count, dec=+n.dataset.dec, pre=n.dataset.pre||'', f=v=>pre+v.toFixed(dec);
    if(REDUCED){ n.textContent=f(t); return; }
    const from=t*.62, t0=performance.now()+260, d=900; n.textContent=f(from);
    const step=now=>{ const k=Math.max(0,Math.min(1,(now-t0)/d)), e=1-Math.pow(1-k,3); n.textContent=k<1?f(from+(t-from)*e):f(t); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function enter(){
  const mn=$('#mn'); countUp(mn); if(REDUCED) return;
  const ease='cubic-bezier(.2,.7,.2,1)';
  const img=mn.querySelector('.greet img'); if(img) img.animate([{opacity:0,transform:'translateY(-14px) scale(.9)'},{opacity:1,transform:'none'}],{duration:600,easing:ease,fill:'backwards'});
  [...mn.querySelectorAll('.greet h2, .brief, .today, .snap, .chips-lbl, .chip, .strip, .composer, .c-hint')].forEach((el,i)=>
    el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:320,delay:120+Math.min(i,10)*60,easing:ease,fill:'backwards'}));
}

/* ---------- Notes ---------- */
const NOTES = {
  A:{t:'A · 今天優先', s:'推薦',
     how:'問候語下面是 AI 的一句今日簡報。接著是 Today 清單，待辦和新 lead 放一起、可以勾選。情境卡縮成一排建議問題，釘選的 Q4 數字縮成最下面<span class="nb">一條細列，</span>點了進 Reports。',
     focus:'「今天先做什麼」。打開就知道三件事，<span class="nb">不用再問。</span>',
     fit:'業務每天早上用。和 Reports 分工清楚：<span class="nb">首頁看今天，</span><span class="nb">Reports 看數字。</span>',
     cost:'AI 簡報要每天產生，工程要多一個「今日摘要」的服務。數字變小，主管第一眼<span class="nb">看不到大數字。</span>'},
  B:{t:'B · 數字優先', s:'維持現在的大卡',
     how:'Q4 snapshot 保持 2×2 大卡。Today <span class="nb">只顯示前兩件，</span><span class="nb">其餘收合。</span>情境卡縮成一排<span class="nb">建議問題。</span>',
     focus:'「這一季狀況如何」。數字一眼看到，<span class="nb">待辦退到第二位。</span>',
     fit:'主管或每週看一次的人。<span class="nb">改動最少。</span>',
     cost:'和 Reports 頂部重複，對業務來說每天最需要的待辦被<span class="nb">往下推。</span>'},
  C:{t:'C · 極簡', s:'只留對話入口',
     how:'輸入框移到畫面中間，下面一排建議問題。數字和待辦都不放，最下方一行字提示去 Reports 和 <span class="nb">Pipeline 看。</span>',
     focus:'「直接跟 AI 說」。最像純 AI 產品，<span class="nb">畫面最乾淨。</span>',
     fit:'已經習慣用對話的人，或要強調 <span class="nb">AI-native</span> 的<span class="nb">展示場合。</span>',
     cost:'打開時沒有東西可以馬上看，要多點一次才<span class="nb">知道今天的事。</span>釘選 Q4 數字的功能<span class="nb">沒有地方放。</span>'}
};
function renderNote(o){
  const n=NOTES[o];
  $('#note').innerHTML=`<h3>${n.t}<small>${n.s}</small></h3>
    <div><dt>做法</dt><dd>${n.how}</dd></div><div><dt>重點</dt><dd>${n.focus}</dd></div><div><dt>適合</dt><dd>${n.fit}</dd></div><div><dt>代價</dt><dd>${n.cost}</dd></div>`;
}

/* ---------- Switching and clicks ---------- */
let current='A';
function show(o){
  current=o;
  document.querySelectorAll('.seg button[data-opt]').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.opt===o)));
  renderNote(o);
  $('#mn').innerHTML = o==='A'?viewA():o==='B'?viewB():viewC();
  enter();
  try{ localStorage.setItem('home-proposal', o); }catch(e){}
}
document.querySelectorAll('.seg button[data-opt]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.opt)));
$('#replay').addEventListener('click',()=>show(current));
$('#mn').addEventListener('click', e=>{
  const box=e.target.closest('.box');
  if(box){ const id=box.closest('.task').dataset.task; done[id]=!done[id];
    const rows=$('#t-rows'); const shown=[...rows.querySelectorAll('.task')].map(r=>r.dataset.task);
    rows.innerHTML=TODAY.filter(x=>shown.includes(x.id)).map(taskRow).join('');
    const over=TODAY.some(x=>x.flag&&x.flag[0]==='red'&&!done[x.id]);
    $('#t-count').textContent = left().length ? `${left().length} to do${over?' · 1 overdue':''}` : 'All done for today'; return; }
  if(e.target.closest('[data-more]')){ const rows=$('#t-rows'); rows.innerHTML=TODAY.map(taskRow).join(''); e.target.closest('[data-more]').remove(); return; }
  const t=e.target.closest('[data-toast]'); if(t){ e.stopPropagation(); toast(t.dataset.toast); }
});
let tt; function toast(m){ let t=$('#pp-toast'); if(!t){ t=document.createElement('div'); t.id='pp-toast'; t.setAttribute('role','status');
  t.style.cssText='position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:8px;background:#052870;color:#fff;font-size:13px;z-index:9;transition:opacity .2s'; document.body.appendChild(t); }
  t.textContent=m; t.style.opacity=1; clearTimeout(tt); tt=setTimeout(()=>t.style.opacity=0,1800); }

let start='A'; try{ start=localStorage.getItem('home-proposal')||'A'; }catch(e){}
show(start);
</script>
