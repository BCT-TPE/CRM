<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workspace AI 提案</title>
<link rel="icon" type="image/svg+xml" href="../assets/fav.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Proposal page only — not part of the prototype. How the assistant shows up on Workspace pages (2026-10-28):
   Now / A one component, one note per page / C same places, details aligned.
   The frame is the real prototype; the variant is patched in after each page renders. */
:root{ --mid:#052870; --deep:#0042B7; --line:#e1e6ef; --tx:#172033; --tx2:#344258; --tx3:#56657a; }
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;color:var(--tx);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.nb{display:inline-block}

.pp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;max-width:1360px;margin:0 auto;padding:28px 24px 16px}
.pp-top h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.pp-top p{margin:6px 0 0;font-size:14px;color:var(--tx3)}
.pp-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.seg button{height:36px;padding:0 16px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:500;color:var(--tx2);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--mid);color:#fff}

.note{max-width:1360px;margin:0 auto 18px;padding:0 24px}
.note-card{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding:16px 20px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.note-card h3{grid-column:1/-1;margin:0;font-size:16px;font-weight:600}
.note-card h3 small{margin-left:8px;font-size:13px;font-weight:500;color:var(--tx3)}
.note-card dt{font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:.04em}
.note-card dd{margin:4px 0 0;font-size:13.5px;line-height:1.65;color:var(--tx2)}
.note-card div.on dt{color:var(--deep)}

.frame-wrap{max-width:1360px;margin:0 auto;padding:0 24px 48px}
.frame{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#f6f8fb;box-shadow:0 24px 60px rgb(23 32 51/10%)}
.frame iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}

@media (max-width:900px){ .note-card{grid-template-columns:1fr 1fr} }
@media (max-width:560px){ .note-card{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="pp-top">
  <div>
    <h1>Workspace 裡的 AI</h1>
    <p>框裡是實際的 prototype，可以直接點。切換提案和頁面看差別。</p>
  </div>
  <div class="pp-ctrl">
    <div class="seg" role="tablist" aria-label="提案" id="seg-v">
      <button role="tab" data-v="now" aria-selected="false">現在</button>
      <button role="tab" data-v="A" aria-selected="true">A 一個元件</button>
      <button role="tab" data-v="C" aria-selected="false">C 只對齊細節</button>
    </div>
    <div class="seg" role="tablist" aria-label="頁面" id="seg-p">
      <button role="tab" data-p="pipeline" aria-selected="true">Pipeline</button>
      <button role="tab" data-p="accounts" aria-selected="false">Accounts</button>
      <button role="tab" data-p="reports" aria-selected="false">Reports</button>
    </div>
  </div>
</header>

<section class="note"><dl class="note-card" id="note"></dl></section>
<div class="frame-wrap"><div class="frame" id="frame"><iframe id="proto" src="../index.html" title="BCT CRM prototype"></iframe></div></div>

<script>
const NOTES = {
  now: { t:'現在', s:'四種長相',
    rule:'Pipeline 是大顆 orb 加打招呼，Accounts 是長條，Reports 是格子裡的卡片，右上角還有 Ask about this page。按鈕有藍字、黑底、小按鈕<span class="nb">三種。</span>',
    pipeline:'右側大顆 orb 和「Hi Sheldon, I’m your deal assistant」，下面是簡報和建議<span class="nb">問題。</span>',
    accounts:'數字下方一條藍色長條，小頭像，右邊藍字「Show them」。',
    reports:'格子裡一張 Insight 卡，講的是 Pipeline 的事，黑底按鈕「Show me」會跳到<span class="nb">別頁。</span>' },
  A: { t:'A 一個元件，每頁一則', s:'建議',
    rule:'一頁最多一則提示，固定放在數字下方，只講這一頁的事。長相都跟 Accounts 的長條一樣，動作一律是右邊<span class="nb">藍字。</span>',
    pipeline:'拿掉打招呼和大 orb。「3 件事要處理」變成數字下方的長條；右側改成單純的 Brief，點卡片才有<span class="nb">內容。</span>',
    accounts:'不變，這就是標準<span class="nb">樣式。</span>',
    reports:'Insight 卡改成數字下方的長條，內容改講目標還差多少；格子重新排過，不留<span class="nb">空位。</span>' },
  C: { t:'C 位置不動，只對齊細節', s:'改動最小',
    rule:'每頁的提示留在原位，只統一三件事：頭像同一個大小、動作都用藍字、不再<span class="nb">打招呼。</span>',
    pipeline:'拿掉打招呼和大 orb，右側加上小頭像標題「Brief」，內容<span class="nb">不變。</span>',
    accounts:'不變。',
    reports:'卡片留在格子裡；頭像改成同一個大小，黑底按鈕改成<span class="nb">藍字。</span>' }
};
const PAGE_NAME = { pipeline:'Pipeline', accounts:'Accounts', reports:'Reports' };

let v = 'A', page = 'pipeline';
try { const s = JSON.parse(localStorage.getItem('ws-ai-proposal')||'{}'); if(NOTES[s.v]) v=s.v; if(PAGE_NAME[s.p]) page=s.p; } catch(e){}

function renderNote(){
  const n = NOTES[v];
  document.getElementById('note').innerHTML = `<h3>${n.t}<small>${n.s}</small></h3>
    <div><dt>規則</dt><dd>${n.rule}</dd></div>
    ${['pipeline','accounts','reports'].map(p=>`<div class="${p===page?'on':''}"><dt>${PAGE_NAME[p]}</dt><dd>${n[p]}</dd></div>`).join('')}`;
}
function syncSeg(){
  document.querySelectorAll('#seg-v button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v));
  document.querySelectorAll('#seg-p button').forEach(b=>b.setAttribute('aria-selected', b.dataset.p===page));
  try { localStorage.setItem('ws-ai-proposal', JSON.stringify({v, p:page})); } catch(e){}
}

/* ---------- Patch the prototype in the frame ---------- */
const frame = document.getElementById('frame'), ifr = document.getElementById('proto');
function fit(){ const s = frame.clientWidth/1440; ifr.style.transform = `scale(${s})`; frame.style.height = 900*s+'px'; }
addEventListener('resize', fit); fit();

const STYLE = `
body.business-theme.bct .ai-h { display:flex; align-items:center; gap:10px; }
body.business-theme.bct .ai-h img { width:34px; height:34px; flex:0 0 auto; object-fit:contain; }
body.business-theme.bct .ai-h b { display:block; font-size:14px; font-weight:600; color:var(--bct-midnight); }
body.business-theme.bct .ai-h small { display:block; font-size:12px; color:var(--text-tertiary); }
body.business-theme.bct .pv-asst .ai-h { padding-bottom:12px; border-bottom:1px solid var(--border-default); }
body.business-theme.bct .rp-insight .acc-ins-go { align-self:flex-start; margin-left:-8px; }
body.business-theme.bct .pv-main > .acc-ins { margin:0 0 16px; }
body.business-theme.bct .rp-head + .acc-ins { margin:-4px 0 16px; }`;

const FACE = 'assets/ai/ai-face.webp';
const note = (lead, text, action) => `<div class="acc-ins pp-add"><img src="${FACE}" alt=""><p><b>${lead}</b> ${text}</p>${action}</div>`;
const brief = sub => `<div class="ai-h pp-add"><img src="${FACE}" alt=""><span><b>Brief</b><small>${sub}</small></span></div>`;

function patch(w, key){
  const d = w.document, el = d.getElementById('view'), add = [];
  if(v==='now') return;
  if(key==='pipeline'){
    el.querySelector('.pv-mascot')?.remove();
    const asst = el.querySelector('.pv-asst');
    asst.insertAdjacentHTML('afterbegin', brief(v==='A' ? 'About the card you pick' : 'Watching 6 deals and 3 leads'));
    if(v==='A'){
      el.querySelector('#pv-chips').insertAdjacentHTML('beforebegin', note('3 things need you.',
        'Gulf Harbor closes Monday with pricing open, Data Lake has been quiet for 32 days, and Al Dhafra’s new lead has no reply <span class="nb">yet.</span>',
        '<button class="acc-ins-go" data-pick="gulf">Start with Gulf Harbor</button>'));
    }
  }
  if(key==='reports'){
    const ins = el.querySelector('.rp-insight');
    if(v==='A'){
      ins?.remove();
      const cards = [...el.querySelectorAll('.rp-bento > .rp-card')];
      const type = cards.find(c=>c.textContent.includes('Pipeline by deal type'));
      const wl = cards.find(c=>c.textContent.includes('Won and lost'));
      const act = cards.find(c=>c.textContent.includes('Activity, last 60 days'));
      if(type && wl) type.after(wl);
      if(act){ act.classList.remove('s8'); act.classList.add('s12'); }
      el.querySelector('.rp-head').insertAdjacentHTML('afterend', note('$400K to go, with 9 weeks left.',
        'Gulf Harbor is worth $540K and closes Monday, but its pricing still hasn’t gone <span class="nb">out.</span>',
        '<button class="acc-ins-go" data-record="gulf">Open Gulf Harbor</button>'));
    } else if(ins){
      ins.querySelector('.rp-tag').outerHTML = `<div class="ai-h pp-add"><img src="${FACE}" alt=""><span><b>Insight</b></span></div>`;
      ins.querySelector('.crm-actions').outerHTML = '<button class="acc-ins-go pp-add" data-view="pipeline">Show the 2 deals</button>';
    }
  }
  // Same light entrance as the rest of the page
  if(!w.matchMedia('(prefers-reduced-motion: reduce)').matches)
    el.querySelectorAll('.acc-ins.pp-add').forEach(n=>n.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:320,delay:120,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'}));
}

let ready = false;
function hook(){
  const w = ifr.contentWindow, d = w.document;
  if(ready || typeof w.openView !== 'function') return;
  const st = d.createElement('style'); st.textContent = STYLE; d.head.appendChild(st);
  const open = w.openView, sum = w.pvSummary;
  w.openView = function(key, opts){ open(key, opts); patch(w, key); };
  // A: the "3 things" list moves to the note above the board, so the brief starts empty.
  w.pvSummary = () => v==='A'
    ? `<p class="pv-muted">Nothing picked yet. You can also <span class="nb">ask me:</span></p>`
    : sum();
  ready = true; show();
}
// The frame can finish before this script runs (it waits for the font stylesheet), so check now as well.
ifr.addEventListener('load', hook);
if(ifr.contentDocument?.readyState === 'complete') hook();

function show(){
  renderNote(); syncSeg();
  if(ready) ifr.contentWindow.openView(page);
}
document.getElementById('seg-v').addEventListener('click', e => { const b=e.target.closest('button'); if(b){ v=b.dataset.v; show(); } });
document.getElementById('seg-p').addEventListener('click', e => { const b=e.target.closest('button'); if(b){ page=b.dataset.p; show(); } });
renderNote(); syncSeg();
</script>
</body>
</html>
